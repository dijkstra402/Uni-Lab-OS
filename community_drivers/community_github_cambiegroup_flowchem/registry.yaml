  description: '通过ReactIR原位红外光谱仪,科学家能够深入了解其在各种应用中的反应和过程.使用在线红外分析仪优化反应变量.更多FTIR红外光谱仪与傅里叶红外光谱仪相关,欢迎登陆梅特勒托利多METTLER
    TOLEDO官网. GitHub驱动: https://github.com/cambiegroup/flowchem'
  category:
  - community
  device_params:
    repo: cambiegroup/flowchem
    source_file: src/flowchem/devices/mettlertoledo/icir.py
    candidate_class: IcIR
    communication: ''
    photo_url: https://www.mt.com/dam/autochem/products/ftir-spectrometers-reactir/reactir-702l-ftir-spectrometer-300x300.jpg/_jcr_content/renditions/cq5dam.web.1280.1280.jpeg
    instrument_params: 请尽可能描述项目，以便为您提供更具针对性的服务：; 简化反应分析为了了解化学反应，化学家必须明确以下问题：反应开始的时间？反应停止的时间？反应动力学与机理是什么？这些瞬时中间体的影响是什么？反应是否与预期一致？是否形成了任何副产物？为什么？反应温度、加样速率和混合速率发生改变会造成什么后果？为了快速获得准确数据和快速分析反应，ReactIR原位FTIR仪器利用五个关键方面确保每一名化学家（包括专业与非专业化学家）了解反应情况。;
      多种FTIR探头和流通池ReactIR探头设计用于在各种条件下运行，几乎可以分析任何类型的化学物质基于探头与流动取样技术使您能够在间歇或连续设置中研究液相化学。了解有关DST取样技术的更多信息。;
      出色的性能从探头到检测器再到软件，ReactIR光谱仪经过优化可在中红外(Mid-IR)“指纹”区域内使用，因此是提供快速和准确分子信息的高灵敏度系统。在反应过程中跟踪关键反应组份的浓度变化。;
      ReactIR用于各种应用和行业。常见应用包括：连续/流动化学聚合反应合成反应结晶催化反应高压反应氢化反应氢甲酰化格氏反应卤化生物催化/酶催化有机催化寡核苷酸合成下游生物生产过程;
      使用ReactIR的在线FTIR分析以往，为了获得反应信息，通常要进行取样，利用HPLC进行离线分析。然而，对于移除样品会导致重要信息丢失、有毒或有害的化学品而言，这种方法并不直截了当。另外
    official_url: https://www.mt.com/global/en/home/products/L1_AutochemProducts/ReactIR.html
