  description: 'PowerArc™是一个完整的集成光源，包括电源、启动器、高效收集光学器件和灯罩，是用于紫外-可见-近红外应用的无臭氧氙灯光源。PowerArc光源非常适合太阳能模拟器、光化学、光诱导激发、
    光生物学等应用。 GitHub驱动: https://github.com/HORIBAEzSpecSDK/python-sdk'
  category:
