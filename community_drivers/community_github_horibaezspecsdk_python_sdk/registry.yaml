      90–274 V 交流电, 50–60 Hz; 额定功率: 50 - 100 w; 操作电压: 10 - 25 v; 操作电流: 3 - 7 A; 预燃电压:
      65–75 V 直流电; 最大电流处波动: < 3% 峰峰值; 预热后稳定性: 0.5%; 线路电压调整: 线路电压变化 5 v 时电流变化 < 0.5%;
      输入（用户可选）: 105–120 V/60 Hz or 210–240 V/50 Hz; 额定功率: 0 - 150 w; 操作电压: 10 - 24
      v; 操作电流: 0 - 8 A; 预燃电压: > 85 v; 最大电流处波动: < 10 mv; 预热后稳定性: 0.2%; 线路电压调整: 线路电压变化
      5 v 时电流变化 0.1%; 负载调整: 负载阻抗变化 50% 时电流变化 0.1%; 尺寸: 11.5 x 27.3 x 31.8 cm; 重量:
      5.45 kg'
