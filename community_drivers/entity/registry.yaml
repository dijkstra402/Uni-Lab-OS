  description: Entity是一款实验执行&合成设备，主要功能包括写入数据、初始化、复位。支持Signal, Slot, actuator names等操作。
  category:
  - 实验执行&合成设备
  device_params:
    支持操作数: '36'
    读取操作: set_joint_position_target、set_joint_velocity_target、set_joint_effort_target、set_tendon_len_target、set_tendon_vel_target 等7个
    控制操作: write_xml、reset、write_data_to_sim、write_ctrl_to_sim、write_root_state_to_sim 等20个
    运动操作: write_joint_position_to_sim、set_joint_position_target
    设备属性: root_body_id、is_fixed_base、is_articulated、is_actuated、has_tendon_actuators、has_site_actuators 等30个
    控制能力: 位置、压力、速度
