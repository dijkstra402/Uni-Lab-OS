flash_firmware:
  class:
    module: unilabos.devices.esp32.flash_firmware:FlashFirmware
    type: python
    status_types: {}
    action_value_mappings:
      ask_quit:
        action_name: ask_quit
  description: Flash Firmware是一款实验执行&合成设备。支持Signal, Slot, ask quit等操作。
  category:
  - 实验执行&合成设备
  init_param_schema:
    config:
      type: object
      properties:
        master:
          type: string
          default: null
        device:
          type: string
          default: null
        style:
          type: string
          default: null
        fonts:
          type: string
          default: null
  name: Flash Firmware
  manufacturer: Open Source
  icon: ascii_stl__writer.webp
  tags:
  - 实验执行&合成设备
  device_params:
    支持操作数: '2'
    通信接口: 串口(RS-232)
