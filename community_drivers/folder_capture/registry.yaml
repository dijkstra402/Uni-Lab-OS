  description: Folder Capture是一款后处理设备，主要功能包括使能、停止、启动、增益设置、状态查询、电流设置。支持Signal, Slot, discover等操作。
  category:
  - 后处理设备
  init_param_schema:
    config:
      type: object
      properties:
        source:
          type: string
          default: null
        sort_by:
          type: string
          default: name
        width:
          type: string
          default: null
        height:
          type: string
          default: null
        fps:
          type: number
          default: 30.0
        real_time:
          type: boolean
          default: true
        loop:
          type: boolean
          default: false
        watch_folder:
          type: boolean
          default: true
  name: File system event handler for folder watching
  manufacturer: Open Source
  icon: ascii_stl__writer.webp
  tags:
  - 后处理设备
  device_params:
    支持操作数: '30'
    读取操作: get_latest_frame、get_exposure、get_gain、get_frame_size、get_fps
    控制操作: start_async、stop、set_exposure、set_gain、enable_auto_exposure
    运动操作: on_moved
