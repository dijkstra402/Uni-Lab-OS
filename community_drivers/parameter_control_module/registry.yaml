  description: Parameter Control Module是一款实验执行&合成设备，主要功能包括停止、关闭、初始化、数据保存、日志记录、状态查询。支持Signal, Slot, append data等操作。
  category:
  - 实验执行&合成设备
  name: Enum relating a given DAQType and a viewer type
  manufacturer: Open Source
  icon: ascii_stl__writer.webp
  tags:
  - 实验执行&合成设备
