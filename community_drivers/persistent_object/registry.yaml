  description: Persistent Object是一款实验执行&合成设备，主要功能包括关闭、写入数据、加载、复位、读取数据、运动控制。支持Signal, Slot, about to be inserted等操作。
  category:
  - 实验执行&合成设备
  device_params:
    支持操作数: '106'
    读取操作: read_from_dict、get_identifier、read_project_properties、get_storage_properties、get_properties 等15个
    控制操作: set_value、write_to_dict、reset、set_root_item、set_component_item 等21个
    运动操作: remove_item、remove_relationship_item、remove_model_item
    设备属性: json_value、value、storage_key、uuid、item_uuid、item 等22个
    控制能力: 多通道、时间
  manufacturer: Open Source
  model:
    name: Persistent Object
    type: device
  name: Persistent Container Type
  tags:
  - 实验执行&合成设备
  resource_type: device
  icon: ascii_stl__writer.webp
  scene:
    domain: General
    scene_name: General
    step: Control
  version: 1.0.0
