rule_server:
  class:
    module: unilabos.devices.rule_server.rule_server:RuleServer
    type: python
    status_types:
      queues: String
      queue_info: String
    action_value_mappings:
      auto-stop:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: stop
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-task_advertisements:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
