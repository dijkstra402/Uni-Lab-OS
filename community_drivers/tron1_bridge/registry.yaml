          title: send_loop
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-destroy_node:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: destroy_node
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: Tron1 Bridge是一款机械臂，主要功能包括设备连接。支持Signal, Slot, cmd vel callback等操作。
  category:
  - 机械臂
  name: Bridge ROS2 cmd_vel messages to Tron1 WebSocket API
  manufacturer: Open Source
  icon: ascii_stl__writer.webp
  tags:
  - 机械臂
  device_params:
    支持操作数: '4'
    通信接口: TCP/IP
