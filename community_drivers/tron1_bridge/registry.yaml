tron1_bridge:
  class:
    module: unilabos.devices.mobile_base.generic.tron1_bridge:Tron1Bridge
    type: python
    status_types: {}
    action_value_mappings:
      auto-connect_ws:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: connect_ws
          type: object
          properties:
            goal:
              type: object
              properties:
                retry_on_fail:
                  type: boolean
                max_retries:
                  type: integer
        goal_default:
          retry_on_fail: false
          max_retries: 10
