  description: View2 D是一款后处理设备，主要功能包括成像、绘图、设备连接、设置、读取数据、运动控制。支持Signal, Slot, activate roi等操作。
  category:
  - 后处理设备
  init_param_schema:
    config:
      type: object
      properties:
        parent_widget:
          type: string
          default: null
  name: VIEW2 D
  manufacturer: Open Source
  icon: ascii_stl__writer.webp
  tags:
  - 后处理设备
  device_params:
    支持操作数: '88'
    读取操作: get_images、get_image、get_histograms、get_histogram、show_roi_target
    控制操作: set_autolevels、set_levels_sym、setup_histograms、set_autolevels、set_gradient
    运动操作: move_scale_roi_target、remove_roi_displayer、move_left_splitter、move_right_splitter、get_crosshair_position
    设备属性数: '12'
    控制能力: 位置控制、多通道
