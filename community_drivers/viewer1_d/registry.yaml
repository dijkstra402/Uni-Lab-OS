  description: Viewer1 D是一款后处理设备，主要功能包括状态查询、绘图、设备连接、设置、运动控制。支持Ndata, Signal, Slot等操作。
  category:
  - 后处理设备
  init_param_schema:
    config:
      type: object
      properties:
        parent:
          type: string
          default: null
        title:
          type: string
          default: ''
        show_toolbar:
          type: boolean
          default: true
        no_margins:
          type: boolean
          default: false
        flip_axes:
          type: boolean
          default: false
  name: This Object deals with the display of 1D data on a plotitem
  manufacturer: Open Source
  icon: ascii_stl__writer.webp
  tags:
  - 后处理设备
  device_params:
    支持操作数: '55'
    读取操作: get_axis、get_plot_items、get_plot_item、move_roi_target、get_double_clicked
    控制操作: set_crosshair_position、setup_widgets、setup_actions、set_crosshair_position
    运动操作: remove_data_displayer、remove_roi_displayer、move_roi_target、get_crosshair_position、set_crosshair_position
    设备属性数: '9'
    控制能力: 位置控制
