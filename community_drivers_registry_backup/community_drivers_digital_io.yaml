              properties:
                ouput_array:
                  type: string
        goal_default: {}
        handles: {}
      auto-read_line:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: read_line
          type: object
          properties:
            goal:
              type: object
              properties:
                line:
                  type: string
        goal_default: {}
        handles: {}
      auto-read_all_lines:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: read_all_lines
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
