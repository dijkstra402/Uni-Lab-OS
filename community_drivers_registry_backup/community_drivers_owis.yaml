owis:
  class:
    module: unilabos.devices.generic.owis_ps10:owis
    type: python
    status_types: {}
    action_value_mappings:
      auto-activate:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: activate
          type: object
          properties:
            goal:
              type: object
              properties:
                motor:
                  type: integer
        goal_default:
          motor: 0
        handles: {}
      auto-configure:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: configure
          type: object
          properties:
            goal:
              type: object
              properties:
                motor:
                  type: integer
                ref:
                  type: integer
        goal_default:
          motor: 0
          ref: 6
        handles: {}
      auto-move:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: move
          type: object
          properties:
            goal:
              type: object
              properties:
                count:
                  type: integer
                motor:
                  type: integer
                absol:
                  type: string
        goal_default:
          motor: 0
          absol: true
        handles: {}
      auto-isMoving:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: isMoving
          type: object
          properties:
            goal:
              type: object
              properties:
                motor:
                  type: integer
        goal_default:
          motor: 0
        handles: {}
      auto-getPos:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: getPos
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-setCurrents:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: setCurrents
          type: object
          properties:
            goal:
              type: object
              properties:
                dri:
                  type: integer
                hol:
                  type: integer
                amp:
                  type: integer
                motor:
                  type: integer
        goal_default:
          motor: 0
        handles: {}
  description: OWIS Positioning Stage驱动（OWIS GmbH），支持activate/configure/move/isMoving/getPos等6个操作。
  category:
  - 物流/机械
  init_param_schema:
    config:
      type: object
      properties:
        conf:
          type: string
          default: null
  cover: owis.webp
  device_params:
    品牌: OWIS GmbH
    功能: 参数配置、数据采集、电学测量、运动控制
    可控参数: absol、amp、count、dri、hol、motor、ref
    操作数: 6
  manufacturer: OWIS GmbH
  model:
    name: OWIS 精密位移台 自动化设备 位移台
    type: device
  name: OWIS 精密位移台 自动化设备 位移台
  tags:
  - 物流/机械
  resource_type: device
  icon: owis.webp
  scene:
    domain: Automation
    scene_name: Motion Control
    step: Positioning
  version: 1.0.0
