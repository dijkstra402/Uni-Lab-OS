          title: set_exposuretime
          type: object
          properties:
            goal:
              type: object
              properties:
                exposuretime:
                  type: string
        goal_default: {}
        handles: {}
      auto-start_live:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: start_live
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-stop_live:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: stop_live
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: Rest Pi Camera驱动，支持isConnected/post json/set iso/set exposuretime/start
    live等6个操作。
  category:
  - 荧光显微镜
  init_param_schema:
    config:
      type: object
      properties:
