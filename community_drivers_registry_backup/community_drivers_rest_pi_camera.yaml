rest_pi_camera:
  class:
    module: unilabos.devices.cameras.rest_pi_camera:RestPiCamera
    type: python
    status_types:
      json: String
      iso: String
      exposuretime: String
      snap: String
      resolution_preview: String
      preview: String
    action_value_mappings:
      auto-isConnected:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: isConnected
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-post_json:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: post_json
          type: object
          properties:
            goal:
              type: object
              properties:
                path:
                  type: string
                payload:
                  type: string
        goal_default:
          payload: {}
        handles: {}
      auto-set_iso:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_iso
          type: object
          properties:
            goal:
              type: object
              properties:
                iso:
                  type: string
        goal_default: {}
        handles: {}
      auto-set_exposuretime:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
