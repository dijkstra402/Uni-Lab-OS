uxbus_cmd_ser:
  class:
    module: unilabos.devices.universal.uxbus_cmd_ser:UxbusCmdSer
    type: python
    status_types:
      has_err_warn: String
      protocol_identifier: String
    action_value_mappings:
      auto-has_err_warn:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: has_err_warn
          type: object
          properties:
            goal:
              type: object
              properties:
                value:
                  type: string
        goal_default: {}
        handles: {}
      auto-set_protocol_identifier:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_protocol_identifier
          type: object
          properties:
            goal:
              type: object
              properties:
                protocol_identifier:
                  type: string
        goal_default: {}
        handles: {}
      auto-check_protocol_header:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: check_protocol_header
          type: object
          properties:
            goal:
              type: object
              properties:
                data:
                  type: string
                t_trans_id:
                  type: string
                t_prot_id:
                  type: string
                t_unit_id:
                  type: string
        goal_default: {}
        handles: {}
      auto-check_private_protocol:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: check_private_protocol
          type: object
          properties:
            goal:
              type: object
              properties:
                data:
                  type: string
        goal_default: {}
        handles: {}
      auto-send_modbus_request:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: send_modbus_request
          type: object
          properties:
            goal:
              type: object
              properties:
                reg:
                  type: string
                txdata:
                  type: string
                num:
                  type: string
                prot_id:
                  type: string
                t_id:
                  type: string
        goal_default:
          prot_id: -1
        handles: {}
      auto-recv_modbus_response:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: recv_modbus_response
          type: object
          properties:
            goal:
              type: object
              properties:
                t_funcode:
                  type: string
                t_trans_id:
                  type: string
                num:
                  type: string
                timeout:
                  type: string
                t_prot_id:
                  type: string
                ret_raw:
                  type: string
        goal_default:
          t_prot_id: -1
          ret_raw: false
        handles: {}
      auto-get_protocol_identifier:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: get_protocol_identifier
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: LaserPoint光电功率计激光功率计驱动（顶尖科仪（中国）股份有限公司），支持has err warn/set protocol
