  name: Cobolt 06-01 Series Diode Laser
  description: Cobolt 06-01是HÜBNER Photonics(原Cobolt AB)的紧凑型CW二极管激光模块，覆盖405-830nm多种波长，用于荧光显微/流式细胞/拉曼光谱。
