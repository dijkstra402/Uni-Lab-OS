  category:
  - devices
  - arbin_cycler
  init_param_schema:
    config:
      type: object
      properties:
        config:
          type: object
          default: null
        env_path:
          type: string
          default: /Users/sml/work/test/Unilab_副本/Uni-Lab-OS/.env
