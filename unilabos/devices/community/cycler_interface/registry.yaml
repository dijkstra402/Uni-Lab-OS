    module: unilabos.devices.devices.arbin_cycler.arbin_cycler_interface:CyclerInterface
    type: python
    status_types:
      num_channels: String
      login_feedback: String
    action_value_mappings:
      auto-read_channel_status:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: read_channel_status
          type: object
          properties:
            goal:
              type: object
              properties:
                channel:
                  type: integer
        goal_default: {}
        handles: {}
