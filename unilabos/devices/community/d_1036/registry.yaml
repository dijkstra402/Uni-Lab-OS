  name: Hielscher UP200St超声波处理器
  description: Hielscher UP200St是200W实验室级超声波处理器，频率26kHz，振幅连续可调。具有自动振幅补偿功能在负载下保持恒定振幅，内置SD卡自动记录超声参数确保实验可重复性。支持浏览器远程控制和脉冲模式，适用于均质乳化、细胞破碎、纳米分散和声化学应用。
