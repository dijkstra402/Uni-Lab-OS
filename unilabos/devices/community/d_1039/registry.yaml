  name: Mettler Toledo EasyMax 402自动化合成工作站
  description: Mettler Toledo EasyMax 402是中等规模自动化合成工作站，支持25-400mL反应体积和2个独立反应位。温度范围从-40°C到230°C，集成加热冷却和顶置搅拌，无需外部油浴。通过iControl软件实现实验自动化和数据记录，适用于反应优化、结晶研究和工艺放大开发。
