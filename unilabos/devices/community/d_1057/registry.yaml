  name: TA Instruments SDT 650 同步热分析仪
  description: TA Instruments SDT 650是同步TGA/DSC热分析仪，采用水平双光束设计，可同时测量热流和重量变化。天平灵敏度达0.1μg，温度上限1500°C。支持调制DSC(MDSC)和高分辨TGA(Hi-Res)技术，配备30位自动进样器和五年炉体质保，用于材料热性能表征。
