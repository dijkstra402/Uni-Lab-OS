  name: Hudson Robotics Sciclops 微孔板搬运机器人
  description: Hudson Robotics Sciclops是自动化微孔板搬运机器人，可在不同实验仪器和板存储区之间自动转移微孔板。配备旋转夹持臂和板堆叠器，支持SBS标准板格式。通过SoftLinx调度软件实现工作流程编排，可与液体处理器、读板器和培养箱等仪器集成，构建完整自动化工作站。
