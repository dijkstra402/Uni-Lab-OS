    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温度范围: -40°C至180°C
    容积: 约53L(1.9立方英尺)
    温变速率: 约5K/min
    技术: APT.line预热腔技术
    控制: 程序控制
    品牌: Binder
