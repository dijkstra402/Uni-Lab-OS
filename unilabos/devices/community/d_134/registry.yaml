  name: TA Instruments DSC 2500 示差扫描量热仪
  description: DSC 2500是TA Instruments Discovery系列的研究级示差扫描量热仪，采用专利Tzero传感器技术，提供卓越的基线性能、灵敏度和分辨率。适用于测量玻璃化转变、熔融、结晶等热转变，广泛应用于聚合物表征、药物分析、食品科学和材料研究领域。支持调制DSC实验，配备触摸屏界面和TRIOS数据分析软件。
