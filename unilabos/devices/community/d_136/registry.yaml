  name: Instron 5943/5944/5969 万能试验机
  description: Instron 5900系列万能试验机是全球广泛使用的材料测试平台。5943(1kN)和5944(2kN)为单柱台式设计，适用于生物材料、薄膜、纺织品等低力值精密测试。5969(50kN)为双柱设计，可进行拉伸、压缩和弯曲测试。符合ISO、ASTM等国际标准，配备数千种配件。已被6800系列取代，但仍有大量装机运行。
  manufacturer: Instron
  tags: &id001
  - 电子式静态测力仪
  category: *id001
  model:
    name: Instron 5943/5944/5969 万能试验机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    5943力值: 1kN
    5944力值: 2kN
    5969力值: 50kN
    速度范围: 0.001-1500mm/min
    位置分辨率: ≤0.02μm
    数据采集: 2500Hz
    品牌: Instron
