  name: Sartorius Picus 2 电动移液器
  description: Sartorius Picus 2是新一代电动移液器，配备蓝牙连接功能，可与Sartorius Pipetting移动应用集成。重量仅100克，具有完全电动化体验包括电动退吸头，大幅减轻肌肉疲劳。支持移液、多次分液、反向移液、稀释、滴定等8种移液模式。内置平板追踪器提高微孔板分液可靠性，1-3点校准调节功能确保准确性。
  manufacturer: Sartorius
  tags: &id001
  - 移液器
  category: *id001
  model:
    name: Sartorius Picus 2 电动移液器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
