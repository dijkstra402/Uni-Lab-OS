  name: Prior Scientific ProScan III 多轴显微镜控制器
  description: Prior Scientific ProScan III是一款紧凑型模块化多轴控制器，可同时控制电动载物台、聚焦电机、滤光轮和快门等最多16个步进电机轴。采用Prior专利IST智能扫描技术，通过逐台校准并存储参数来提高XY载物台运动精度。模块化堆叠设计最大限度减少台面占用空间。兼容MicroManager、Olympus
    CellSens、Nikon NIS Elements等主流显微镜软件，支持Windows/Linux/Mac系统。
  manufacturer: Prior Scientific
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Prior Scientific ProScan III 多轴显微镜控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制轴数: 最多16个步进电机轴
    最大台速: 300mm/s
    速度范围: 0-70rps
    通信: 1×USB2.0/2×RS232(115K波特率)
    TTL: 4路可编程TTL输入/输出
    电压: 38V
    尺寸: 177×177mm
    品牌: Prior Scientific
