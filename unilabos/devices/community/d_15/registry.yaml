  name: Prior Scientific ProScan 显微镜控制器
  description: Prior Scientific ProScan是ProScan系列的早期型号，用于自动化显微镜载物台和聚焦控制。支持XY载物台、Z轴聚焦驱动、滤光轮和照明快门的控制。通过RS-232串口或USB与主机通信，采用ASCII命令协议便于第三方软件集成。配备操纵杆用于手动操作。兼容MetaMorph、Micro-Manager、NIS-Elements等成像软件。现已被ProScan
    III取代。
  manufacturer: Prior Scientific
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Prior Scientific ProScan 显微镜控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制: 多轴(X/Y/Z)控制
    通信: RS-232串口/USB
    支持设备: 电动XY台/Z轴聚焦/滤光轮/快门
    分辨率: 亚微米级(取决于连接的载物台)
    品牌: Prior Scientific
