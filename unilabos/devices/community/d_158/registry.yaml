  name: Kern PCB 系列精密天平
  description: Kern PCB系列是实验室标准精密天平，由拥有175年历史的德国Kern & Sohn制造。内置防震系统确保快速可靠的称量结果，PRE-TARE功能支持已知容器重量扣除。IoT-Line版本配备KUP通用端口，可灵活连接USB、RS-232、蓝牙、WLAN和以太网适配器，实现直接数据采集和远程控制。支持GLP/ISO合规记录，兼容Vernier等教学软件。
