  name: Andor Shamrock/Kymera 光谱仪
  description: Andor Shamrock和Kymera系列是Oxford Instruments旗下的研究级Czerny-Turner光谱仪。Shamrock提供163/303/500/750mm四种焦距，Kymera
    193i和328i采用专利Adaptive Focus技术实现自动聚焦优化。Kymera 328i配备TruRes技术提供最高光谱分辨率。所有型号支持电动三光栅转塔和双探测器输出，覆盖UV至SWIR波段，可实现纳秒时间分辨率和单光子检测。
  manufacturer: Andor
