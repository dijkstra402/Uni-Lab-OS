  name: Sutter Lambda 10-3 光学滤光轮控制器
  description: Sutter Lambda 10-3是最新一代高性能滤光轮控制器，可同步独立控制3个滤光轮和2个快门(或2轮+3快门)。相邻滤光片切换时间40ms(标准10位轮)或30ms(4位高速轮)。内置自动检测功能，自动识别已安装设备和命令来源，无需手动配置。直驱系统消除皮带打滑和背隙问题。命令集向下兼容Lambda
    10-2。适用于荧光显微镜、钙成像、光遗传学等应用。
  manufacturer: Sutter Instrument
  tags: &id001
  - 光学组件
  category: *id001
  model:
    name: Sutter Lambda 10-3 光学滤光轮控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    切换速度: 40ms(相邻滤光片,10位轮)/30ms(4位高速轮)
    滤光轮控制: 3轮+2快门或2轮+3快门
    滤光片尺寸: 25mm/32mm/50mm
    滤光片位数: 10位/4位/5位
    滤光片厚度: 1-9mm/位
    通信: USB/RS-232(DB-9)/并口/键盘
    功率: 75W
    尺寸: 400×280×102mm
    重量: 11kg
    品牌: Sutter Instrument
  cover: Sutter Lambda 10-3 光学滤光轮控制器.webp
