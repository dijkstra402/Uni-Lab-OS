  name: Linkam T95热分析系统温度控制器
  description: Linkam T95热分析配置是T95系统控制器面向热分析应用的方案，支持DSC差示扫描量热、力学测试和环境参数控制等多种热分析实验。控制器可连接高分辨率力传感器、湿度传感器和气体传感器，实时采集多通道数据并叠加到视频画面。通过LINK软件的TASC模块可实现基于表面特征的自动热分析。兼容Linkam全系列温控载台，适用于材料科学和相变研究。该型号已停产，由T96替代。
  manufacturer: Linkam Scientific
