  name: Agilent 4155C半导体参数分析仪
  description: Agilent 4155系列（含4155A/B/C）是经典的半导体参数分析仪，内置4个中功率源监测单元(MPSMU)、2个电压源(VSU)和2个电压监测器(VMU)。电流测量范围10fA至100mA，电压范围2µV至100V，具有6位显示分辨率。支持DC连续和脉冲模式I-V特性扫描测量，可进行应力测试。4155C配备桌面EasyEXPERT界面，支持GPIB和LAN接口。该系列已停产，功能由Keysight
    B1500A半导体器件分析仪继承。
