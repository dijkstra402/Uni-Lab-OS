  name: Keysight N6705A模块化直流电源分析仪
  description: Keysight N6705A(原Agilent)是一款模块化直流电源分析仪，将最多4个高级电源模块与数字万用表、示波器、任意波形发生器和数据记录器功能集成于一体。主机总功率600W，可从23种N6700系列电源模块中选配，覆盖50W至300W、最高100V/20A的多种规格。每个模块内置电压表、电流表、示波器和数据记录功能。支持GPIB、USB和LAN远程控制，符合LXI标准。该型号已停产，后续为N6705C。
  manufacturer: Keysight
