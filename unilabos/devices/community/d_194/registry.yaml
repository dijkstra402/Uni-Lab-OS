  name: EA PS 2000B系列可编程直流实验室电源
  description: EA Elektro-Automatik PS 2000B系列是紧凑型微处理器控制的可编程直流实验室电源，提供100W、160W和332W三个功率等级。采用Flexi-range自动量程输出技术，在额定功率包络内灵活分配电压和电流。配备TFT彩色触摸屏、数字编码器设定和Mini
    USB接口。支持ModBus RTU和SCPI通信协议，内置过压(OVP)、过流(OCP)和过温(OTP)硬件保护。适用于研发、维修、测试和教育实验室。
