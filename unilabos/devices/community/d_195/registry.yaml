  name: GW Instek GPP-4323四通道可编程直流电源
  description: GW Instek GPP-4323是一款四通道可编程直流电源，提供两路32V/3A主通道和两路辅助通道(5V/1A和15V/1A)，总功率217W。CH1和CH2支持跟踪串联(64V)或并联(6A)模式，并内置恒流/恒压/恒阻负载功能。采用4.3英寸TFT
    LCD大屏显示，提供1mV/0.1mA高设定分辨率和低至350µVrms的超低纹波噪声。硬件级OVP/OCP/OTP保护确保安全运行，内置8种模板序列波形输出，支持智能温控风扇静音设计。
  manufacturer: GW Instek
