  name: HP 4141B八通道直流源/监测器
  description: HP 4141B是惠普公司开发的八通道高速直流源/监测器，专为半导体器件DC参数测试设计。配备4个源监测单元(SMU)、2个电压源单元(VSU)和2个电压测量单元(VMU)，每通道最大输出/测量时间仅4ms。支持DC电压/电流同时输出和监测，电压范围±0.01V至±200V。提供完整的I-V测量解决方案，适用于半导体器件特性表征和参数提取。该仪器已停产，后续为Keysight
    E5260A系列。
  manufacturer: Keysight
  tags: &id001
  - 半导体参数测试仪
  category: *id001
  model:
    name: HP 4141B八通道直流源/监测器
    type: device
  version: 1.0.0
  resource_type: device
