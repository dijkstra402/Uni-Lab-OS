  name: HP 4145B半导体参数分析仪
  description: HP 4145B是惠普公司经典的独立式半导体参数分析仪，配备4个源监测单元(SMU)、2个辅助电压源和2个电压监测器。可自动执行高速DC半导体器件特性表征，源/测量范围覆盖50fA至100mA电流和1mV至100V电压。最多支持1140个测量显示点，内置CRT屏幕可以图形、列表、矩阵或散点模式显示结果。具备灵活的图形分析功能用于快速参数提取。该仪器为行业经典设备，已停产。
  manufacturer: Hewlett-Packard
