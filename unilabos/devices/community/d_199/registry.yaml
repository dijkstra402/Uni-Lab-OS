  name: iseg SHR高压源表
  description: iseg SHR是德国iseg公司推出的台式高精度高压源表(SMU)，基于iseg专利HV发生技术和iCS控制系统设计。最多配备4个独立通道，每通道支持电压和电流独立控制及电子极性反转。创新的6kV通道提供三档电子切换模式(2kV/4mA、4kV/3mA、6kV/2mA)实现最大灵活性。标准型纹波10mV，高精度型可达2-3mV。配备4.3英寸TFT电容触屏和旋钮控制，内置ARM
    Linux平台的iCS2控制系统支持数据记录和图形显示。
  manufacturer: iseg Spezialelektronik
  tags: &id001
  - 电源与源表
