  name: Keysight E3632A 双量程直流电源
  description: Keysight E3632A是一款120W单输出台式直流电源，具备双量程输出（15V/7A或30V/4A），内置电压电流测量功能，低纹波噪声，支持GPIB和RS-232远程编程控制，适用于实验室和自动化测试。
  manufacturer: Keysight
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: Keysight E3632A 双量程直流电源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    最大功率: 120W
    量程1: 0-15V/7A
    量程2: 0-30V/4A
    电压精度: 0.05%+10mV
    纹波噪声: <350µVrms
    接口: GPIB, RS-232
    品牌: Keysight
  cover: Keysight E3632A 双量程直流电源.webp
