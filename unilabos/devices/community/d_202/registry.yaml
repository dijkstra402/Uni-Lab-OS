  name: KORAD KD3005P 可编程线性直流电源
  description: KORAD KD3005P是一款可编程线性直流电源，输出电压0-30V、电流0-5A，支持恒压/恒流模式，具备USB接口用于PC远程控制，内置5组存储，带过压过流保护，适用于电子原型开发和自动化测试。
