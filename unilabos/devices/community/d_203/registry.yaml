  name: KORAD KWR100系列 可编程直流电源
  description: KORAD KWR100系列是300W可编程直流电源，提供宽范围电压电流输出（30V/30A或60V/15A），1mV/1mA高精度分辨率，支持LAN、USB和RS-232多种通信接口，具备电压斜率设置和远程补偿功能，适用于大电流测试和电池充电。
  manufacturer: KORAD
