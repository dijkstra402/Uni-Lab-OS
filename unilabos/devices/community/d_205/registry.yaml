  name: Rohde & Schwarz HMP4000系列 多通道直流电源
  description: R&S HMP4000系列是高性能多通道直流电源（3或4通道），每通道0-32V/0-10A输出，最大384W总功率，具有低纹波噪声、隔离浮动输出、远程感应、EasyArb任意波形功能，支持串并联组合，适用于工业生产和实验室测试。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 电源与源表
