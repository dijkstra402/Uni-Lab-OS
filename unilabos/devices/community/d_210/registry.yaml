  name: Hameg HM8118 可编程LCR电桥
  description: Hameg HM8118（现属Rohde & Schwarz）是一款高精度可编程LCR电桥，测试频率20Hz至200kHz共63步，基本精度0.05%，可测量L/C/R/D/Q/|Z|等多种参数，支持串并联测量模式和变压器参数测试，配备分选接口用于元器件分拣，已停产。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  model:
    name: Hameg HM8118 可编程LCR电桥
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 20Hz-200kHz(63步)
    基本精度: 0.05%
    电容: 0.01pF-100mF
    电阻: 0.1mΩ-100MΩ
    电感: 10nH-100kH
    接口: RS-232, USB, 可选GPIB
    品牌: Rohde & Schwarz
