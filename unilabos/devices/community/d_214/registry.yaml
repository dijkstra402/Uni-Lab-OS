  name: Signal Recovery 7265 双相DSP锁相放大器
  description: Signal Recovery 7265是一款基于DSP技术的双相锁相放大器，频率范围1mHz至250kHz，电压灵敏度低至2nV、电流灵敏度低至2fA，具备信号恢复和矢量电压表两种工作模式，内置频谱显示和32k点数据缓存，配备三个辅助ADC输入和四个DAC输出。已停产。
  manufacturer: Signal Recovery
  tags: &id001
  - 锁相放大器与微弱信号检测
  category: *id001
  model:
    name: Signal Recovery 7265 双相DSP锁相放大器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 1mHz-250kHz
    电压灵敏度: 2nV-1V
    电流灵敏度: 2fA-1µA
    滤波器斜率: 6/12/18/24dB/oct
    时间常数: 10µs-50000s
    振荡器输出: 0-5V
    接口: GPIB, RS-232
    缓存: 32k点
    品牌: Signal Recovery
  cover: Signal Recovery 7265 双相DSP锁相放大器.webp
