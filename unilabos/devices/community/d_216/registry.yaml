  name: Agilent/Keysight 33600A系列 Trueform波形发生器
  description: Agilent 33600A系列采用Trueform信号发生技术，提供1GSa/s采样率和最高120MHz带宽，抖动仅1ps（比DDS低200倍），谐波失真仅0.03%，支持80/120MHz多种型号及1/2通道配置，内置PRBS和脉冲发生功能，可软件升级扩展带宽和存储深度。
  manufacturer: Keysight
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Agilent/Keysight 33600A系列 Trueform波形发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    采样率: 1GSa/s
    带宽: 最高120MHz
    存储深度: 最大64MSa
    抖动: 1ps
    谐波失真: 0.03%THD
    通道: 1或2通道
    波形: 正弦/方波/脉冲/噪声/PRBS/任意波
    接口: LAN, USB, 可选GPIB
