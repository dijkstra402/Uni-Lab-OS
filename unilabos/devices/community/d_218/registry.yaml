  name: HP/Keysight 8114A 高功率脉冲发生器
  description: HP 8114A是一款高功率脉冲发生器，可提供高达100V/2A的快速正负脉冲，频率范围1Hz至15MHz，上升时间7ns，支持用户自定义电压、电流和占空比限制，通过GPIB接口和SCPI命令实现自动化控制，适用于激光二极管和闪存器件测试。已停产。
  manufacturer: Keysight
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: HP/Keysight 8114A 高功率脉冲发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    最大幅度: 100V(高阻)
    最大电流: 2A
    频率范围: 1Hz-15MHz
    上升时间: 7ns
    接口: GPIB
    触发: TTL输入
    品牌: Keysight
