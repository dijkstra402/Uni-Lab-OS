  name: Wasatch Photonics WP-532X 拉曼光谱仪
  description: Wasatch Photonics WP-532X是高性能532nm拉曼光谱仪系列，532nm激发波长提供更强的拉曼散射信号，适合无机材料和碳纳米材料分析。光谱范围最宽可达270-4700cm⁻¹。采用f/1.3高通量或f/1.8高分辨率光学设计，配合可更换狭缝(15/25/50µm)优化灵敏度与分辨率。科学级探测器支持两种TEC温控模式。提供实验室整机和OEM模块两种形态，附赠ENLIGHTEN软件和多平台SDK。
  manufacturer: Wasatch Photonics
  tags: &id001
  - 激光拉曼光谱仪
  category: *id001
  model:
    name: Wasatch Photonics WP-532X 拉曼光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    激发波长: 532nm
    光谱范围: 270-4700cm⁻¹(TEC调节型)/270-4250cm⁻¹(TEC制冷型)
    分辨率: 8-11cm⁻¹(25µm狭缝)
    光学设计: f/1.3/f/1.8
    探测器: 科学级CCD(10°C/-15°C)
    最小积分时间: 3ms/8ms
    通信: USB2.0 TypeB
    尺寸: 24.3×17.2×6.0cm
    重量: <2.3kg
    狭缝选项: 15/25/50µm
    品牌: Wasatch Photonics
  cover: Wasatch Photonics WP-532X 拉曼光谱仪.webp
