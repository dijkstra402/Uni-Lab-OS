  name: Rohde & Schwarz SMB100A 微波信号发生器
  description: R&S SMB100A是一款高性能微波信号发生器，频率覆盖9kHz至40GHz，具有出色的频谱纯度（SSB相位噪声-128dBc典型值），高输出功率达+27dBm，支持AM/FM/脉冲调制，仅2U高度紧凑设计，可通过频率倍频器扩展至110GHz，适用于航空航天和生产测试。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Rohde & Schwarz SMB100A 微波信号发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 9kHz-40GHz(取决于选件)
    相位噪声: -128dBc@1GHz/20kHz偏移
    最大输出功率: +27dBm
    调制: AM/FM/φM/脉冲
    接口: LAN, USB, GPIB
    重量: 5.3kg
    品牌: Rohde & Schwarz
