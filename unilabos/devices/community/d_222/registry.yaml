  name: Siglent SDG系列 函数/任意波形发生器
  description: Siglent SDG系列函数/任意波形发生器覆盖入门到高性能多个产品线，采用EasyPulse和TrueArb专利技术，克服传统DDS抖动和失真问题，提供低至150ps的抖动和<0.075%的THD，支持多种调制方式和内置频率计，适用于教育、研发和生产测试。
  manufacturer: Siglent
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Siglent SDG系列 函数/任意波形发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    最大带宽: 30-120MHz(按型号)
    采样率: 150MSa/s-1.2GSa/s
    分辨率: 14/16位
    通道: 1/2
    波形存储: 16Kpts-8Mpts
    调制: AM/FM/PM/FSK/ASK/PWM
    接口: USB, LAN, 可选GPIB
    品牌: Siglent
