  name: R&S HMO3004 数字示波器
  description: R&S HMO3004是罗德与施瓦茨HMO3000系列4通道混合信号数字示波器，提供300MHz至500MHz带宽选项，采样率4GSa/s，存储深度8Mpts，支持高达200000:1的缩放比。标配混合信号分析功能，可扩展至16路逻辑通道。支持多种串行总线协议触发与硬件加速解码，内置三位半数字电压表，适用于嵌入式开发和服务维护。该产品已停产，后续型号为R&S
    RTM3000。
  manufacturer: Rohde & Schwarz
