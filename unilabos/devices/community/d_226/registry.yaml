  name: R&S RTx 系列示波器
  description: R&S RTx是罗德与施瓦茨示波器产品线的统称，涵盖从入门级RTC1000到高性能RTP的完整系列。RTC1000提供50-300MHz带宽入门方案；RTM3000覆盖100MHz-1GHz中端市场；RTO6面向600MHz-6GHz高性能应用，配备15.6英寸触摸屏；RTP旗舰系列支持4-16GHz带宽，40GSa/s采样率及750000波形/秒捕获率。全系支持混合信号分析、协议解码和频率响应分析。
