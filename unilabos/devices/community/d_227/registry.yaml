  name: Keithley 194 高速电压表
  description: Keithley 194是一款双通道高速数字电压表，最高可达1000读数/秒的测量速度，具备5.5位分辨率。支持直流和交流(真有效值)电压测量，直流量程从20mV至300V，输入阻抗超过1GΩ。配备IEEE-488总线接口，适用于高速数据采集、瞬态捕获和生产线自动化测试。该产品已停产，现由Tektronix(Keithley母公司)提供技术文档支持。
