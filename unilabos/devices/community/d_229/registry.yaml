  name: Keysight 34411A 6.5位高性能数字万用表
  description: Keysight 34411A是34410A的增强版本，提供6.5位分辨率和50000读数/秒的高速测量能力(4.5位模式)。配备1M读数存储器和模拟电平及前/后触发功能，适用于高吞吐量自动化测试系统。支持直流/交流电压、电流、电阻、频率、周期、电容、温度和二极管测试等多种功能，并配备LAN、USB和GPIB连接。该产品已停产，推荐替代产品为34465A。
