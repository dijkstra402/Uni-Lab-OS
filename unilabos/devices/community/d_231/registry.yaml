  name: Keysight 53200A系列 通用频率计数器/定时器
  description: Keysight 53200A系列(含53210A/53220A/53230A)是新一代350MHz射频/通用频率计数器/定时器，可选6GHz或15GHz微波通道。旗舰型号53230A提供12位/秒频率分辨率和20ps时间间隔分辨率。内置数学分析和彩色图形显示(趋势图/直方图)，1M读数存储和数据记录功能。首批符合LXI
    Class C标准的频率计，支持LAN、USB和GPIB连接。
