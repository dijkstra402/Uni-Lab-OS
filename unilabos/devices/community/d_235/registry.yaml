  name: Keithley 3706A 系统开关/万用表
  description: Keithley 3706A是一款高密度系统开关/万用表，在2U紧凑机箱内提供6个插件卡槽。满载时可支持576个两线复用通道或2688个单极矩阵交叉点。可选7.5位高性能数字万用表提供26位分辨率和13种内置测量功能，速度超过14000读数/秒。支持LXI
    Class B标准，内置Web浏览器界面，TSP-Link可无缝连接2600系列源表进行系统扩展。
  manufacturer: Tektronix
