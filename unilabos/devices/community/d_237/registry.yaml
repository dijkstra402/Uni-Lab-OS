  name: Keithley 6485 皮安计
  description: Keithley 6485是一款5.5位高速皮安计，采用反馈式电流放大器设计，电压负载低于200μV，远优于传统万用表分流器方案。8个电流量程覆盖20fA至20mA，最高1000读数/秒是Keithley最快的皮安计。内置2500读数时间戳数据缓冲提供最小值/最大值/标准差统计。220V过载保护和显示开关功能，适用于光敏器件暗电流等测量场景。
