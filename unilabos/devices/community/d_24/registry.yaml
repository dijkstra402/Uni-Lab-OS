  name: Ocean Optics USB2000+ 微型光纤光谱仪
  description: Ocean Optics USB2000+是一款通用型微型光纤光谱仪，采用2MHz A/D转换器和Sony ILX511B 2048元素CCD阵列探测器。f/4交叉Czerny-Turner光学结构提供0.3-10nm可配置分辨率。USB2.0接口直接从主机取电无需外部电源。通过USB每毫秒可捕获完整光谱(每秒1000幅)。集成10路可编程数字I/O、13位模拟输入和脉冲发生器。14种光栅选项覆盖UV至近红外。
  manufacturer: Ocean Optics
  tags: &id001
  - 紫外-可见分光光度仪
  category: *id001
  model:
    name: Ocean Optics USB2000+ 微型光纤光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    探测器: Sony ILX511B CCD(2048像素)
    波长范围: 200-1100nm(光栅配置)
    光学分辨率: 0.3-10.0nm FWHM
    光学结构: f/4交叉Czerny-Turner
    信噪比: '250:1'
    动态范围: 2×10⁸(系统)/1300:1(单次)
    A/D分辨率: 16位
    积分时间: 1ms-65s
    接口: USB2.0/RS-232
    功耗: 250mA@5VDC
    品牌: Ocean Optics
