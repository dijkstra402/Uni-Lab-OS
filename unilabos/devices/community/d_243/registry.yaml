  name: HP 3457A 数字万用表
  description: HP 3457A(现Keysight遗留产品)是一款高性能6.5位数字万用表，提供±0.002%的1年直流电压精度。支持直流/交流电压、直流/交流电流、二线和四线电阻、频率和周期测量。积分时间可从500ns调整至100个电源周期，4.5位模式下读取速度达1300读数/秒。内置自动校准功能提升准确度，配备HP-IB(GPIB)接口。该产品已停产，推荐替代产品包括3458A和34461A。
  manufacturer: Keysight
