  name: Rigol DM3000系列 数字万用表
  description: Rigol DM3000系列数字万用表提供可靠且经济的完整DMM功能，包括DM3058E(5.5位)、DM3058(5.5位)和DM3068(6.5位)三个型号。DM3068旗舰型号提供6.5位分辨率、0.0035%
    DCV精度和10000读数/秒测试速率。全系列支持双屏同时显示电压/电流和频率，10组预设配置和通过/失败测试功能。USB存储器可克隆配置至其他设备，适用于生产线自动化测试。
  manufacturer: Rigol
