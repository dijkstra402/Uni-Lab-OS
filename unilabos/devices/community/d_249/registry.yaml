  name: UNI-T UT61E 数字万用表
  description: UNI-T UT61E是一款22000计数真有效值数字万用表，提供全面的测量功能覆盖直流/交流电压(最高1000V/750V)、直流/交流电流(最高10A)、电阻(最高220MΩ)、电容(最高220mF)、频率测量和二极管/连续性测试。直流电压基本精度±0.1%，支持自动和手动量程切换。内置RS-232C接口可连接PC进行数据传输和记录，是广受好评的高性价比专业万用表。
