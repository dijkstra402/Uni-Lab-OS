  name: R&S ZNL 矢量网络分析仪
  description: R&S ZNL是一款三合一矢量网络分析仪，集VNA、频谱分析仪和功率计于一体，频率范围覆盖5kHz至20GHz。配备10.1英寸触摸屏，支持MultiView模式在网络分析和频谱分析间切换。可选电池组实现便携式现场操作，支持12V/24V直流供电。适用于研发实验室、服务中心、高校和生产设施，可替代多台独立仪器，降低设备投资成本。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  model:
    name: R&S ZNL 矢量网络分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 5kHz-20GHz
    端口: 2端口双向
    三合一: VNA+频谱分析仪+功率计
    显示: 10.1英寸触摸屏
    频谱分析扩展: 最高26.5GHz
    连接器: N(f)或3.5mm(m)
    品牌: Rohde & Schwarz
  cover: R&S ZNL 矢量网络分析仪.webp
