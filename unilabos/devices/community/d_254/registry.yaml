  name: R&S FPC 频谱分析仪
  description: R&S FPC是一款入门级频谱分析仪，德国设计制造，基础型号覆盖5kHz至1GHz，可通过软件密钥升级至2GHz或3GHz。配备10.1英寸高分辨率显示屏，支持1Hz分辨率带宽，最大输入功率达+30dBm。可选前置放大器将灵敏度提升至-165dBm，内置VSWR桥实现单端口矢量网络分析。支持WiFi、USB和LAN连接，具备EMI调试、调制分析等功能，适合教育、服务维护和基础RF工程应用。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  model:
    name: R&S FPC 频谱分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 5kHz-1/2/3GHz(可升级)
    相位噪声: <-92dBc(1Hz)@500MHz,30kHz偏移
    DANL: <-158dBm/Hz(带前放)
    显示: 10.1英寸WXGA(1366x768)
    分辨率带宽: 1Hz
    最大输入: +30dBm
    品牌: Rohde & Schwarz
