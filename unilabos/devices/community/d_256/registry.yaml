  name: Eurotherm 2400 温度控制器/编程器
  description: Eurotherm 2400系列是高稳定性温度/过程控制器，配备自适应整定功能，提供1/4、1/8和1/16 DIN三种面板尺寸。内置8段设定值编程器，可扩展至20个程序各16段。采用模块化硬件设计，支持双PID设置、Instant
    Accuracy通用输入。具备高速Modbus RTU、Profibus DP和DeviceNet通讯，支持多区编程和PDSIO回传。适用于塑料加工、热处理、窑炉、环境箱、化学制药和玻璃炉等应用。该产品已停产，推荐EPC3000替代。
  manufacturer: Eurotherm
  tags: &id001
  - 冷热源
  category: *id001
  model:
    name: Eurotherm 2400 温度控制器/编程器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    输入类型: mA/mV/RTD/TC/Volts
    面板尺寸: 1/16/1/8/1/4 DIN
    PV精度: <0.2%
    防护等级: IP65
    显示: 2x4位LED
    控制方式: On/Off/PID/VP
    编程器: 20x16段
    通讯: Modbus/Profibus/DeviceNet
    供电: 24V DC/AC或85-264V AC
    品牌: Eurotherm
