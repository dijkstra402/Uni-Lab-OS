  name: Scientific Instruments Model 9700 低温温度控制器
  description: Scientific Instruments Model 9700是一款基于微处理器的低温温度控制器，温度范围覆盖1.4K至800K，支持硅二极管和铂电阻温度传感器。具备两个独立控制回路和PID控制算法，加热器输出功率最大50W，在4.2K时温度稳定性优于±0.01K。配备RS-232和IEEE-488.2
    GPIB通讯接口，支持可编程温度设定点和升温速率，广泛应用于低温物理研究、材料科学和低温系统精密温度控制。
  manufacturer: Scientific Instruments
  tags: &id001
  - 冷热源
  category: *id001
  model:
    name: Scientific Instruments Model 9700 低温温度控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温度范围: 1.4K-800K
    传感器: 硅二极管/铂电阻RTD
    控制回路: 双独立通道
    加热器输出: 最大50W
    温度稳定性: ±0.01K@4.2K
    分辨率: 0.001K(<10K)/0.01K(>10K)
    显示: 5位LED
    接口: RS-232/IEEE-488.2 GPIB
    品牌: Scientific Instruments
