  name: CreaPhys RCU001 蒸发速率控制单元
  description: CreaPhys RCU001是一款蒸发速率控制单元，专为有机薄膜沉积系统设计，通过石英晶体微天平(QCM)传感器实现精确的沉积速率监测和PID控制。支持亚埃/秒级速率控制精度，适用于OLED制造、有机光伏器件和有机薄膜晶体管的研究与生产。可与CreaPhys蒸发源和MBRAUN手套箱集成沉积系统配合使用，支持共蒸发掺杂工艺。CreaPhys现已并入MBRAUN，产品线作为MBRAUN旗下真空镀膜系统品牌继续运营。
  manufacturer: MBRAUN
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: CreaPhys RCU001 蒸发速率控制单元
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    类型: 蒸发速率控制器
    控制方式: PID温度调节
    传感器: 石英晶体微天平(QCM)
    应用: 有机材料蒸发源
    精度: 亚埃/秒级速率控制
    兼容: CreaPhys蒸发源和沉积系统
    品牌: MBRAUN
