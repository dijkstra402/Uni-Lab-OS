  name: FormFactor Velox 探针台控制软件
  description: FormFactor Velox 3是业界领先的探针台控制软件，支持200mm和300mm半自动及全自动晶圆探针台，兼容15+种不同平台，全球装机量超过2100台。作为Contact
    Intelligence技术的核心组件，支持24/7自主半导体测试。功能包括Velox Dash触摸屏界面、工作流向导、AutoAlign快速晶圆对准、VueTrack无人值守多温测试、电动探针管理器和SECS/GEM工业标准接口。注意：Velox是软件平台而非物理探针台，需搭配FormFactor探针台硬件使用。
