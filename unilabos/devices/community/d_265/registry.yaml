  name: Newport Oriel Cornerstone 260 单色仪
  description: Newport Oriel Cornerstone 260(CS260B)是一款高性能1/4米单色仪，采用非对称平面Czerny-Turner光学设计，F/3.9光圈比提供出色的杂散光抑制和最小化像差。集成Newport运动台实现更快扫描速度和更高波长精度，采用更大光栅改善光通量。出厂完成校准和对准，支持2或4个预配置光栅、电动狭缝控制(6µm至3mm)。配备USB和RS232通讯接口，兼容Oriel滤波轮和TracQ
    Basic软件，适用于光谱学、太阳能电池测试和荧光测量等研究应用。
  manufacturer: Newport
  tags: &id001
  - 光学组件
  category: *id001
  model:
    name: Newport Oriel Cornerstone 260 单色仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    焦距: 260mm
    F/#: F/3.9
    光谱范围: 200-20000nm(取决于光栅)
    杂散光: 0.01%
    光栅: 最多4个可选
    狭缝: 6µm-3mm(6µm步进)
    输出端口: 最多3个
    接口: USB 2.0/RS232
    重量: 9.5kg
    品牌: Newport
  cover: Newport Oriel Cornerstone 260 单色仪.webp
