  name: Ocean Optics Flame-S 微型光谱仪
  description: Ocean Optics Flame-S是一款紧凑坚固的微型光谱仪，相比早期USB系列光谱仪显著改善了热稳定性。可更换入射狭缝设计允许用户自定义分辨率。Sony
    ILX511B 2048像素CCD探测器覆盖190-1100nm波长范围。USB2.0供电无需外部电源，仅265克重量适合实验室和现场使用。兼容OceanView和OceanDirect软件，适用于吸收、透射、荧光和辐照度测量。
  manufacturer: Ocean Optics (Ocean Insight)
  tags: &id001
  - 紫外-可见分光光度仪
  category: *id001
  model:
    name: Ocean Optics Flame-S 微型光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    探测器: Sony ILX511B线性硅CCD(2048像素)
    波长范围: 190-1100nm(光栅配置)
    光学分辨率: 0.1-10.0nm FWHM
    信噪比: '250:1'
    动态范围: 1300:1(单次)/2×10⁸(系统)
    积分时间: 1ms-65s
    杂散光: <0.10%@600nm
    接口: USB2.0(USB供电)
    尺寸: 89.1×63.3×34.4mm
    重量: 265g
    光纤接口: SMA905
    品牌: Ocean Optics (Ocean Insight)
  cover: Ocean Optics Flame-S 微型光谱仪.webp
