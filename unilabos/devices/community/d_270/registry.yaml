  device_params:
    功率范围: 100fW-300W
    显示: 6位真空荧光
    采样分辨率: 20000计数(<25Hz)/4096计数(<1kHz)
    单位: W/dBm/dB/J/Ergs/A/V
    接口: RS-232C/IEEE-488
    探测器: 818系列兼容(190-1800nm)
    功能: DC/峰峰值/脉冲测量
    品牌: Newport
