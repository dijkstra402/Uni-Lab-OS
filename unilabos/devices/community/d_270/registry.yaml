  name: Newport 1835-C 高性能光功率计
  description: Newport 1835-C是一款多功能高性能光功率计，测量范围覆盖100fW至300W，支持DC、峰峰值和脉冲光功率测量。配备6位真空荧光显示和模拟条形图(10X缩放)，可显示W、dBm、dB、J等多种单位。同时具备RS-232C和IEEE-488双接口，IEEE-488数据吞吐率50-100Hz。兼容Newport
    818系列硅、锗和InGaAs半导体探测器，覆盖190-1800nm波长范围。具备可编程触发输入/输出控制和报警功能。该产品已停产，现代替代型号为1936-R/2936-R系列。
  manufacturer: Newport
  tags: &id001
  - 光传感器
  category: *id001
  model:
    name: Newport 1835-C 高性能光功率计
    type: device
  version: 1.0.0
