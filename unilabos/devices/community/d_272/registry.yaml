  name: Keysight N7744A 光多端口功率计
  description: Keysight N7744A是一款4通道光多端口功率计，专为光多端口器件表征和高通量制造测试设计。配备4个InGaAs传感器端口，波长覆盖1250至1650nm，动态范围65dB，最小平均时间仅1µs。测量速度比前代方案快10倍，时间分辨率提升25倍。创新N7740光纤连接概念采用四适配器快锁机构，支持MU、FC、SC和LC连接器。作为LXI兼容仪器，支持LAN和USB并行编程。适用于复用器、PON分路器、WSS和ROADM等多端口器件测试。已停产，替代型号为N7744C。
  manufacturer: Keysight
  tags: &id001
  - 光传感器
  category: *id001
  model:
    name: Keysight N7744A 光多端口功率计
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道: 4个InGaAs传感器端口
    波长范围: 1250-1650nm
    动态范围: 65dB(扫描/记录)
    最小平均时间: 1µs
    功率不确定度: ±2.5%
    偏振相关性: <±0.01dB
    采样率: 最高1M样本/秒
    缓存: 每端口1M+1M缓冲
    接口: LAN/USB/GPIB
    合规: LXI
    品牌: Keysight
  cover: Keysight N7744A 光多端口功率计.webp
