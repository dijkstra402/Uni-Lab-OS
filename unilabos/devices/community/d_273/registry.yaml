  name: Keysight N7778C 可调谐激光源
  description: Keysight N7778C是N777-C系列XP4级可调谐激光源的价值线型号，波长覆盖1240nm至1650nm，峰值输出功率超过+12dBm，信号与SSE比≥75dB/nm。支持双向扫描速度达200nm/s，波长重复性±1.5pm，0.1pm调谐分辨率。电机与压电执行器自动协调实现平滑无超调波长调谐。Option
    013针对硅光子/集成光子技术优化，在1290-1340nm提供超过+16dBm输出功率。可搭配N774xC功率计和N7786C偏振合成器进行插损、PDL和色散的扫描波长测量。
  manufacturer: Keysight
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Keysight N7778C 可调谐激光源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1240-1650nm(无间隙,型号相关)
    最大功率: '>12dBm(标准)/>18dBm(Option 013)'
    SSE比: ≥75dB/nm
    波长精度: ±4pm(静态)/±10pm(扫描)
    重复性: ±1.5pm
    扫描速度: 最高200nm/s双向
    调谐分辨率: 0.1pm
    品牌: Keysight
  cover: Keysight N7778C 可调谐激光源.webp
