  name: Keysight N7770系列 可调谐激光源
  description: Keysight N7770系列是新一代可调谐激光源产品家族，覆盖1240nm至1650nm全波长范围无间隙。包含三款型号：N7776C顶级线(亚皮米重复性和最低SSE)、N7778C价值线(高性价比制造测试)和N7779C基础线(快速步进调谐)。所有型号基于共同腔体和激光模块设计，具备窄线宽、优异长期稳定性和低自发辐射。软件兼容前代8160xA和81600B激光器，支持Web浏览器远程界面(LAN/USB)。可选5英寸电容触摸屏，适用于CWDM、DWDM和PON器件测试。
  manufacturer: Keysight
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Keysight N7770系列 可调谐激光源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1240-1650nm(全系列无间隙)
    型号: N7776C(顶级)/N7778C(价值)/N7779C(基础)
    最大功率: '>12dBm'
    扫描速度: 最高200nm/s
    线宽: 窄线宽
    分辨率: 0.1pm
    接口: LAN/USB/Web界面
    品牌: Keysight
