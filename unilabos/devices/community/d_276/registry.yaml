  name: Keysight 81600B 可调谐激光源模块
  description: Keysight 81600B系列是高性能可调谐激光源模块，专为WDM开发者和制造商设计。覆盖1260-1640nm全部传输波段，内置高性能波长计、相干控制单元和60dB衰减器，信号与自发辐射比大于70dB/nm。支持高速波长扫描（最高80nm/s），可用于光学组件精密表征和光放大器测试。该产品已停产，替代型号为N777xC系列。
  manufacturer: Keysight
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Keysight 81600B 可调谐激光源模块
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1260-1640nm
    信号与SSE比: '>70dB/nm'
    波长精度: ±3.6pm
    光输出功率: 最高+9dBm
    扫描速度: 最高80nm/s
    内置衰减器: 60dB
    品牌: Keysight
