  name: Keysight 81900A 光开关模块
  description: Keysight 81900A是一款适配8163B/8164B/8166B光波测量系统的光开关模块，用于多通道光信号路由和自动化测试。该型号信息较少，可能已停产或为定制型号。Keysight的光开关模块系列（包括81591B、81594B、81595B等）支持单模和多模光纤，具有低插入损耗和高重复性，切换寿命超过1000万次。
