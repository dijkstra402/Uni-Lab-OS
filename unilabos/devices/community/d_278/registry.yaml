  name: Artifex Engineering OPM150 光功率计
  description: Artifex Engineering OPM150是一款低成本、多功能的USB供电光功率计，用于nW至kW级光功率的精密测量。响应时间仅100μs，采样率高达600样/秒，比热电堆快1000倍。支持多种光电探测器头和积分球，覆盖250-2490nm波长范围。体积小巧可放入口袋，支持自动探测器识别和单独校准数据上传，配备Python库、LabVIEW
    VI和SDK。
  manufacturer: Artifex Engineering
  tags: &id001
  - 光传感器
  category: *id001
  model:
    name: Artifex Engineering OPM150 光功率计
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    功率范围: nW-12kW(配积分球)
    波长范围: 250-2490nm(取决于探测器)
    采样率: 最高600样/秒
    增益范围: 5档
    带宽: 10kHz
    探测器精度: ±5%
    基础单元精度: ±1%
    线性度: ±0.2%
    尺寸: 60×81×36mm
    品牌: Artifex Engineering
  cover: Artifex Engineering OPM150 光功率计.webp
