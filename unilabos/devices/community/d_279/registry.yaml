  name: Artifex Engineering TZA500 跨阻放大器
  description: Artifex Engineering TZA500是一款紧凑型精密跨阻放大器，用于从pA到mA级微弱电流的精密测量，输出电压与输入电流线性成正比。具有6档增益范围、4档可选带宽、极性反转和独特的自动归零功能（可消除高达10V的偏移）。采用差分跨阻输入级设计，抗电磁干扰能力强，特别适合光电二极管电流测量和光功率监测应用。
  manufacturer: Artifex Engineering
  tags: &id001
  - 锁相放大器与微弱信号检测
  category: *id001
  model:
    name: Artifex Engineering TZA500 跨阻放大器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    电流范围: 100nA-10mA(6档增益)
    带宽: 10kHz
    上升时间: 45μs
    噪声等效电流: 30pA(RMS)
    精度: ±1%
    线性度: ±0.1-0.2dB
    输出: 10V满量程
    A/D: 12位
    接口: USB和DB25硬线
    尺寸: 105×45×116mm
    品牌: Artifex Engineering
  cover: Artifex Engineering TZA500 跨阻放大器.webp
