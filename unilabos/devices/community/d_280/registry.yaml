  name: Photo Research PR-655 SpectraScan 光谱辐射计
  description: Photo Research PR-655 SpectraScan是一款经济型便携式光谱辐射计，用于光谱级光度和色度测量。配备128个探测器元件，覆盖380-780nm可见光谱，分辨率3.12nm/像素。完全手持电池供电，无需PC即可独立运行，内置AutoSync自动同步功能确保显示背光测量精度。支持SD卡存储、SpectraWIN
    2软件分析，适用于显示器测试、LED测试和工业色度应用。
  manufacturer: Photo Research
  tags: &id001
  - 光传感器
  category: *id001
  model:
    name: Photo Research PR-655 SpectraScan 光谱辐射计
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    光谱范围: 380-780nm
    探测器: 128元
    光谱分辨率: 3.12nm/像素
    动态范围: 0.2-30000fL
    测量孔径: 1°或1/2°
    显示: 2.25×3英寸彩色触摸屏
    接口: USB/蓝牙/RS-232
    电池: 锂电USB充电
    品牌: Photo Research
