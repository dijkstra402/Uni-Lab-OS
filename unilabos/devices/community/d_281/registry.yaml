  name: Konica Minolta CS-100A 亮度色度计
  description: Konica Minolta CS-100A是一款便携式非接触三刺激色度计，采用SLR单镜反光设计，可远程测量亮度和色度。1°接受角支持最小14.4mm测量直径，选配近摄镜头可缩至1.3mm。支持CIE
    1931和CIE 1976色空间，内置微处理器进行信号处理，可进行色差测量和用户校准。适用于显示器、LED、交通信号灯和汽车照明测量。该产品已停产，替代型号为CS-150/CS-160。
  manufacturer: Konica Minolta
