  name: Inficon XTM/2 薄膜沉积监控仪
  description: Inficon XTM/2将ModeLock技术的超高测量速度和精度扩展到仅监控应用中。紧凑的半机架设计，所有操作和编程功能可从单一屏幕访问。频率分辨率仅需250ms即可达到0.1Hz，16秒平均模式下速率分辨率可达0.01Å。采用新型被动智能振荡器，支持15至100英尺（4.5-30米）线缆长度，真空内线缆最长2米。提供多种配置包括蚀刻/沉积模式和图表记录功能。
  manufacturer: Inficon
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: Inficon XTM/2 薄膜沉积监控仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    晶振范围: 6.0-5.0MHz±0.1Hz
    厚度分辨率: 0.123Å/250ms
    厚度精度: 0.5%
    频率分辨率: 0.1Hz/250ms
    速率分辨率: 0.01Å(16秒平均)
    存储膜数: '9'
    通信: RS-232
    品牌: Inficon
