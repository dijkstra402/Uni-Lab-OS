  name: Sycon STM-100 薄膜厚度/速率监控仪
  description: Sycon STM-100是由Sycon Instruments（后被Inficon收购）生产的石英晶振微天平薄膜厚度/速率监控仪。使用6MHz标准石英晶振传感器，实时显示沉积速率（Å/s）和累积厚度，内置多种沉积材料的声学阻抗（Z-ratio）和密度数据库。作为入门级单通道监控仪，广泛用于科研实验室的热蒸发和溅射系统中。该产品已停产，后继产品为Inficon
    SQC/SQM/STM系列。
  manufacturer: Inficon
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: Sycon STM-100 薄膜厚度/速率监控仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    测量原理: 石英晶振微天平(QCM)
    晶振频率: 6MHz
    分辨率: 埃级
    显示: 数字显示速率和厚度
    品牌: Inficon
