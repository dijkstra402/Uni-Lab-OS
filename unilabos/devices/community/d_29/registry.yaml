  name: Ocean Optics NIRQuest 近红外光谱仪
  description: 'Ocean Optics NIRQuest系列是近红外光谱仪，采用InGaAs线性阵列探测器覆盖900-2500nm近红外波段。提供三种波长范围型号:
    NIRQuest+1.7(至1700nm)、+2.2(至2200nm)和+2.5(至2500nm)。TEC制冷探测器实现高达12000:1的信噪比。交叉Czerny-Turner光学结构配合多种光栅和狭缝选项。适用于水分检测、化学分析、食品农业质量控制、制药分析和材料鉴定等应用。'
  manufacturer: Ocean Optics
  tags: &id001
  - 近红外光谱仪
  category: *id001
  model:
    name: Ocean Optics NIRQuest 近红外光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    探测器: InGaAs线性阵列(256/512像素)
    波长范围: 900-1700nm(NIRQuest+1.7)/900-2200nm(+2.2)/900-2500nm(+2.5)
    光学结构: 交叉Czerny-Turner
    光谱分辨率: 3-10nm FWHM
    信噪比: 最高12000:1
    接口: USB
    品牌: Ocean Optics
