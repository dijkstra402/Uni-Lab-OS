  name: JEVATEC JEVAmet VCU 通用真空控制器
  description: 注意：JEVATEC JEVAmet VCU实际上是通用真空控制器而非膜厚仪。该设备是JEVATEC自主制造的多通道真空传感器控制显示单元，支持1-3通道配置，兼容JEVATEC、Leybold、Pfeiffer
    Vacuum和Inficon等品牌的主动和被动真空传感器。提供6位绿色LED显示、前面板按键操作、RS232/RS485通信接口和可编程开关点功能。已集成到SweepMe!测量软件中。
  manufacturer: JEVATEC
  tags: &id001
  - 真空测量仪器
  category: *id001
  model:
    name: JEVATEC JEVAmet VCU 通用真空控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: 1-3通道
    显示: 6位LED(绿色)
    单位: mbar/Pa/Torr
    电源: 100-240VAC 50/60Hz
    接口: RS232/RS485
    模拟输出: 每通道1路
    开关点: 最多6个可编程
    外壳: 铝管壳体 1/4 19英寸机架3U高
    品牌: JEVATEC
  cover: JEVATEC JEVAmet VCU 通用真空控制器.webp
