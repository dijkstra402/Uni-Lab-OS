    测量原理: 石英晶振微天平(QCM)
    组成: 石英振荡器+频率测量系统+通信接口
    通信: RS232
    控制器: TMC13
    适用环境: 超高真空(UHV)
    应用: MBE/PVD/溅射/蒸发
    品牌: PREVAC
