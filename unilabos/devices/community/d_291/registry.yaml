  name: PREVAC TM1x 薄膜厚度监控仪
  description: PREVAC TM1x（包括TM13和TM14型号）是石英晶振薄膜厚度监控传感器，由石英振荡器、频率测量系统和通信接口组成。通过RS232将测量结果传输至TMC13控制器或PC。专为超高真空(UHV)环境设计，适配标准真空法兰，广泛应用于分子束外延(MBE)、物理气相沉积(PVD)等薄膜沉积研究。PREVAC是波兰精密真空仪器制造商。
  manufacturer: PREVAC
  tags: &id001
  - 蒸镀仪
