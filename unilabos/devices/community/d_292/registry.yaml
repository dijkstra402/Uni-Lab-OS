  name: PREVAC TMC13 薄膜厚度监控控制器
  description: PREVAC TMC13是最新技术的膜厚监控控制器，专为各类镀膜和沉积工艺的监控与控制而设计。支持最多6路传感器输入和2路真空计通道，配备7英寸TFT显示屏。DSP处理器实现高速高精度测量，改善薄膜质量和重复性。具备参数自动保存、实时速率图表显示和专用测量软件。适用于MBE等精密薄膜沉积应用，兼容PREVAC
    TM13/TM14传感器。
