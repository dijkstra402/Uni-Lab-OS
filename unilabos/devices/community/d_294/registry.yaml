  name: Rotrics DexArm 多功能桌面机械臂
  description: Rotrics DexArm是一款4轴多功能桌面机械臂，具有0.05mm超高重复精度和专利减速器设计。模块化末端执行器支持3D打印（PLA/TPU/木材/碳纤维，精度0.1mm）、2500mW激光雕刻（405nm）、吸盘拾放和软夹爪抓取。配备3.5英寸触摸屏和Rotrics
    Studio软件，支持C++/Python/Java/ROS 2.0编程。示教再现功能可拖动手臂录制动作，40dB超低噪音适合桌面使用。
  manufacturer: Rotrics
  tags: &id001
  - 转运与协作机器人
  category: *id001
  model:
    name: Rotrics DexArm 多功能桌面机械臂
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    自由度: '4'
    重复精度: 0.05mm
    最大载荷: 500g
    最大速度: 500mm/s
    连接: WiFi/USB-C×2
    电源: DC 12V 7A
    噪音: 40dB
    尺寸: 175×128×315mm
    重量: 2.4kg
    模块: 3D打印/激光雕刻/吸盘/夹爪
    工作温度: 0-50°C
    品牌: Rotrics
