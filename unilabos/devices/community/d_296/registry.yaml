  name: Kern 573 精密天平
  description: Kern 573系列与572系列同属IoT-Line精密天平，共享相同的功能平台但提供更大量程和较低分辨率。573-34型号量程650g/精度0.01g，573-46型号量程6500g/精度0.1g。具备GLP/ISO记录、计件、配方、百分比测定、防振称量和悬挂称量等功能。压铸铝外壳坚固可靠，不锈钢秤盘直径150mm，支持KERN通用端口多接口扩展，适合实验室日常工作和工业高精度应用。
  manufacturer: Kern
  tags: &id001
  - 电子天平
  category: *id001
  model:
    name: Kern 573 精密天平
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    最大量程: 650g(573-34型)/6500g(573-46型)
    可读性: 0.01g(573-34)/0.1g(573-46)
    重复性: 0.01g
    线性度: 0.03g
    秤盘直径: 150mm
    外壳: 压铸铝
    接口: KUP
    净重: ~2.3kg
    品牌: Kern
