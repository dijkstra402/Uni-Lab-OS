  name: OWIS PS 10-32 单轴位置控制单元
  description: 注意：OWIS PS 10-32实际是单轴位置控制单元而非平移台本身，"32"指最多可联网32台设备。通过USB连接电脑，支持步进电机（1/128微步保证平稳运行和精细分辨率）和DC伺服电机（A/B-Index编码器，带宽7.5MHz）。支持三角和梯形速度曲线的点对点运动。配套OWISoft软件可管理多台PS
    10-32/PS 30/PS 35/PS 90+控制单元，提供C/C++/C#/LabVIEW等SDK。
  manufacturer: OWIS
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: OWIS PS 10-32 单轴位置控制单元
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制轴数: 单轴
    接口: USB
    电机类型: 步进电机/DC伺服电机
    微步模式: 最高1/128
    数字输入: 4路TTL+4路模拟
    数字输出: 1路TTL+4路SPS(2路可配PWM)
    编码器带宽: 7.5MHz(DC伺服)
    多点连接: 最多32台设备
    运动曲线: 三角/梯形
    品牌: OWIS
  cover: OWIS PS 10-32 单轴位置控制单元.webp
