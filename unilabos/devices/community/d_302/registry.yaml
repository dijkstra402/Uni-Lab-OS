  name: MBRAUN SCU101 手套箱系统控制器
  description: MBRAUN SCU101是MBRAUN手套箱系统的控制单元，负责管理和监控手套箱内的惰性气体环境。控制单元可实时显示和控制O₂和H₂O浓度（维持<1ppm水平）、箱内压力调节以及气体净化系统状态。配备触摸屏界面，支持净化器自动再生循环控制、数据记录和报警功能，适用于MBRAUN
    LABstar、UNIlab等系列手套箱工作站。
