  name: Keithley 707A 半导体开关矩阵主机
  description: Keithley 707A是一款六卡槽半导体开关矩阵主机，专为需要复杂信号路由的自动化测试系统设计。支持高达7680个交叉点，兼容多种Keithley
    7000系列开关卡，提供低漏电信号通路和高隔离度，适合低电流和高阻抗测量。通过GPIB接口实现远程控制和自动化，广泛应用于半导体测试、器件特性表征和自动化测试系统。
