  name: Keithley 707B 半导体开关矩阵主机
  description: Keithley 707B是六卡槽半导体开关矩阵主机，为707A的升级型号。内置计算机处理能力，可执行存储的TSP脚本指令、进行计算并生成数字触发信号，响应时间达微秒级。配备10/100M以太网连接和内置Web控制页面，可通过标准Web浏览器访问。与Keithley
    Series 2600B SMU无缝配合，支持Keithley自动化表征套件(ACS)和Python脚本。
