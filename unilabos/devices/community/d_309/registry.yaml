  name: Keysight E5250A 低漏电开关主机
  description: Keysight E5250A是低漏电开关主机，可将B1500A、4155C或4156C等单一测量站扩展为自动化测量系统。插件模块可配置为交叉点矩阵（用于通用参数测量）或多路复用器（用于长期可靠性测量）。支持E5252A矩阵卡（10输入×48输出，含Kelvin开关）和E5255A多路复用卡（最多96输出），多主机级联可达384通道。
