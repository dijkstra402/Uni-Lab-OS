  name: Ocean Optics HR2000+ 高分辨率光谱仪
  description: Ocean Optics HR2000+是一款高分辨率微型光纤光谱仪，采用Sony ILX511B 2048像素CCD阵列，可实现最高0.035nm的光学分辨率。系统动态范围达8.5×10⁸，杂散光极低(<0.05%@600nm)。14种光栅选项和多种狭缝尺寸(5-200µm)提供灵活配置。USB2.0接口供电和通信。适用于UV-Vis吸收光谱、荧光测量、激光表征和等离子体监测。已停产，现被Ocean
    HR系列(HR2/HR4/HR6)取代。
  manufacturer: Ocean Optics
  tags: &id001
  - 紫外-可见分光光度仪
  category: *id001
  model:
    name: Ocean Optics HR2000+ 高分辨率光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    探测器: Sony ILX511B CCD(2048像素)
    波长范围: 200-1100nm(配置)
    光学分辨率: 最高0.035nm FWHM
    信噪比: '250:1'
    动态范围: 8.5×10⁸(系统)/1300:1(单次)
    积分时间: 1ms-65s
    杂散光: <0.05%@600nm/<0.10%@435nm
    接口: USB2.0/RS-232
    尺寸: 148.6×104.8×45.1mm
    重量: 570g
    光纤接口: SMA905
    品牌: Ocean Optics
