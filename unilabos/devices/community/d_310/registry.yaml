  name: NF CA5351 可编程电流放大器
  description: NF CA5351是一款可编程电流输入-电压输出前置放大器，在高增益和宽带宽方面实现了业界领先水平。在10¹⁰V/A增益下等效输入噪声仅2.5fA/√Hz，在10⁶V/A增益下带宽可达DC至500kHz。独特的输入电路设计确保在存在电缆或传感器电容时不会产生谐振，内置低噪声直流电源和12档滤波器。广泛应用于同步辐射设施微小电流检测和生物化学粒子测量等领域。
