  name: Rohde & Schwarz NGP800 直流电源
  description: Rohde & Schwarz NGP800系列是高性能可编程直流电源，提供5个型号覆盖400W和800W功率等级。2或4路200W输出可各提供最高64V或20A，电气等效且隔离的输出可串联(至250V)或并联(至80A)。配备5英寸TFT触摸屏，支持恒压/恒流模式自动切换、数据记录、QuickArb任意波形生成、OVP/OCP/OPP/OTP保护和自动调速静音风扇。
