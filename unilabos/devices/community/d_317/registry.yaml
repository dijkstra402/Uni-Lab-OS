  name: Bentham 610 恒流稳定灯电源
  description: Bentham 610是恒流稳定直流灯电源，为Bentham系列白炽灯和氙灯光源及校准标准灯提供卓越的稳定性和可靠的长期性能。最大功率250W，支持恒流模式和软件控制的恒压模式。用户友好的界面允许通过前面板或USB
    2.0接口完全控制，LCD显示设定电流、实际电流、灯电压、运行时间和灯功率等参数，内置灯泡运行时间跟踪功能。
