  name: Lambda ZUP 可编程直流电源
  description: TDK-Lambda ZUP系列是紧凑型可编程直流电源，提供从ZUP6-132(6V/132A)到ZUP120-3.5(120V/3.5A)的多种型号，功率覆盖200W至800W。支持恒压和恒流模式自动切换、远程感测、过压保护和串并联运行。通过前面板、RS-232/RS-485或可选GPIB接口进行控制，1U高度适合机架安装，通用交流输入(85-265VAC)设计，广泛应用于实验室和工业测试系统。
