  name: Optris CT 系列红外测温仪
  description: Optris CT系列红外测温仪（高温计）配备全球最小的红外传感头之一，光学分辨率高达75:1。采用独立控制箱+传感头两件式设计，传感头不锈钢外壳可在最高250°C环境温度下无需冷却运行。涵盖CT
    LT(通用低温)、CT 1M/2M(金属)、CT 3M(金属加工)、CT 4M(超快)、CT G5(玻璃)、CT P3/P7(塑料)等多个型号，覆盖-50°C至2200°C温度范围，适用于金属、陶瓷和玻璃行业。
  manufacturer: Optris
