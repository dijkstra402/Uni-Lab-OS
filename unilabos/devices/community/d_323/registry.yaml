  name: PyroScience FireSting-O2 光纤溶氧仪
  description: PyroScience FireSting-O2是紧凑型PC控制USB光纤溶氧仪，基于独特的REDFLASH红光激发近红外检测技术。测量范围0-100%O₂（气体）和0-44mg/L（溶解氧），检测限低至0.01mg/L。内置大气压和相对湿度传感器，支持自动温度和压力补偿。兼容从50μm微传感器到3mm探针的全系列光学氧传感器和温度传感器。Pyro
    Workbench软件免费提供，支持LabVIEW和Python库集成。
  manufacturer: PyroScience
