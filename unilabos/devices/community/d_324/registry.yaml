  name: Opsens Solutions CoreSens 光纤传感器信号调理器
  description: Opsens Solutions CoreSens是新一代光纤传感器信号调理器，采用模块化可扩展架构。基于双通道测量模块设计，支持WLX-2(S)白光偏振干涉(WLPI)和GSX-2半导体禁带(SCBG)两种技术，可测量温度、压力、应变和位移。单机箱最多26通道，通过EtherCAT主/桥控制模块可管理多达50个机箱共1300个测量通道。采样率最高1000Hz，内置Web服务器应用无需安装软件即可配置和数据采集。
  manufacturer: Opsens Solutions
