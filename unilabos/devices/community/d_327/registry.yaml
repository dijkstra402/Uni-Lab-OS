  name: Keithley 2110 5.5位双显示数字万用表
  description: Keithley 2110是一款5.5位USB数字万用表，具备双行LCD显示功能，可同时显示两种不同测量结果。支持15种测量功能，包括电容和热电偶温度测量。在5.5位分辨率下可达200读数/秒，4.5位下高达50000读数/秒。配备USB接口和可选GPIB接口，附带KI-Tool软件。适合生产测试、研发和教学应用。
  manufacturer: Tektronix
