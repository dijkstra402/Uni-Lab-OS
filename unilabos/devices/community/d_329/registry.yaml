  name: Keithley 2750 万用表/开关系统
  description: Keithley 2750是Integra系列中最大容量的万用表/开关系统，支持最多5个7700系列开关卡，可扩展至200个两极复用通道。具备扩展低电阻测量能力和内置20mV钳位功能，保护敏感器件并防止干电路测试中的自热误差。集成信号调理、缩放、激励和I/O功能，适用于精密数据采集和大规模多通道测量应用。
