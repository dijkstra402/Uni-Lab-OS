  name: Physik Instrumente C-863 Mercury DC电机伺服控制器
  description: Physik Instrumente C-863 Mercury是一款紧凑的单轴DC电机伺服控制器，支持直接DC电机控制和PWM控制模式。伺服周期50μs(20kHz)，编码器输入支持高达60MHz的AB正交信号。提供USB和RS-232双接口，支持RS-232总线架构菊花链连接最多16个控制器。内置数据记录器、宏命令语言和非易失性宏存储，支持自动启动宏的独立运行。支持失速检测、限位开关和参考点开关。附带PIMikroMove软件，兼容LabVIEW、C++、MATLAB和Python。
  manufacturer: Physik Instrumente
