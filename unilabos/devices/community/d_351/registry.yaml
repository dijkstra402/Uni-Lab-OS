  name: E-545 PInano压电控制器
  description: E-545是PI公司为PInano XY和XYZ平台设计的经济型多通道压电控制器，支持压阻或电容传感器。运动可通过模拟信号或三种数字PC接口（USB、TCP/IP和RS-232）控制，也可通过上传宏命令序列到内部非易失性存储器实现独立运行。具备高带宽模拟伺服控制，适用于显微镜样品扫描和纳米定位应用。该产品为早期型号，目前PI推荐使用E-727系列数字控制器作为替代方案。
