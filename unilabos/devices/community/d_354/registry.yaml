  name: BIO2.100双轴超低轮廓纳米定位平台
  description: BIO2.100是PiezoConcept公司的双轴超低轮廓纳米定位平台，专为倒置显微镜集成设计。每轴行程100µm，分辨率达0.1nm，重复性0.2nm，基底噪声仅0.01nm(典型值)。谐振频率500/400Hz，刚度0.6/0.5N/µm。采用硅HR传感器和铝材质(可选Invar材质以提高热稳定性，兼容Bruker
    AFM)。超低轮廓高度仅15.5mm，矩形孔径可容纳显微镜载玻片，可与粗定位平台组合使用。标配模拟控制器，可选USB接口。适用于超分辨显微镜、高速共聚焦成像、扫描探针显微镜、单分子光谱、粒子追踪和光片显微镜等应用。
  manufacturer: PiezoConcept
  tags: &id001
