  name: MFF101电动滤光片翻转架
  description: MFF101是Thorlabs公司的电动滤光片翻转架，用于将滤光片、光学元件或光束挡块在光路中切换。支持2个位置，可容纳直径最大1英寸(25.4mm)的光学元件，两位置间翻转角度90度，典型翻转时间约500ms。采用USB接口进行计算机控制，兼容Thorlabs
    APT和Kinesis软件平台。配备BNC输入/输出用于外部触发和同步。MFF101为英制螺纹版本，MFF101/M为公制螺纹版本。支持标准光学支柱安装，可单独使用或与其他K-Cube组合在KCH601控制器集线器中构建多通道系统。广泛应用于光路中光学元件的自动切换、光束导向和路由以及需要光学元件切换的自动化实验装置。
  manufacturer: Thorlabs
  tags: &id001
  - 光学调整架
  category: *id001
  model:
    name: MFF101电动滤光片翻转架
    type: device
  version: 1.0.0
  resource_type: device
