  name: BBD201单通道台式三相无刷直流伺服控制器
  description: BBD201是Thorlabs公司的单通道台式三相无刷直流伺服控制器。支持Thorlabs三相无刷直流伺服电机产品系列，提供编码器反馈用于闭环速度和位置控制，配备前面板显示和控制以补充远程PC操作。BBD系列无刷直流电机控制器非常适合需要高速运行(数百mm/s)和高编码器分辨率(<100nm)的运动控制应用。与MLS203系列双轴扫描平台配合使用时特别适合显微镜样品操作，或与150mm、220mm、300mm、600mm平移台或直驱旋转台配合用于通用运动应用。集成到APT产品系列中，提供Thorlabs标准控制和编程接口，便于集成到自动化运动控制应用中。USB连接提供即插即用PC控制操作，支持Kinesis或传统APT软件平台。可通过多种编程语言控制包括Visual
    Basic、LabVIEW、C++等。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
