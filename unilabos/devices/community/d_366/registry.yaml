  name: KDC101 K-Cube直流伺服电机控制器
  description: KDC101是Thorlabs公司的K-Cube直流伺服电机控制器，设计用于驱动Thorlabs的直流伺服电机执行器和平台系列。采用紧凑的K-Cube外形(60mm×60mm×49.4mm)，USB连接用于通过Thorlabs
    Kinesis或APT软件进行PC控制。顶部面板控件配备速度轮和LCD显示，可独立操作。兼容各种直流伺服电机驱动的执行器、平移台和旋转台/架，如Z812系列。可单独使用或与其他K-Cube组合在多通道系统中，使用KCH601控制器集线器。支持闭环位置控制与编码器反馈，提供精确的运动控制。适用于实验室自动化、精密定位、光学对准等应用。可通过多种编程语言控制包括LabVIEW、Python、C++等，便于集成到自动化系统中。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: KDC101 K-Cube直流伺服电机控制器
    type: device
  version: 1.0.0
