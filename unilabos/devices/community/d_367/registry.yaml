  name: Thorlabs KPA101 K-Cube位置对准控制器
  description: Thorlabs KPA101是一款K-Cube紧凑型位置对准控制器，用于处理四象限或横向效应位置探测器的X/Y位置信号，支持自动对准反馈环路以保持光束居中，通过USB连接计算机并使用Kinesis或APT软件控制，可应用于光束转向、自动光学对准和主动光束稳定。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs KPA101 K-Cube位置对准控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    功能: X/Y位置信号处理
    兼容探测器: PDQ系列四象限探测器
    接口: USB 2.0
    软件: Kinesis/APT
    尺寸: 60×60×49.4mm
    供电: K-Cube电源/集线器
    品牌: Thorlabs
  quality_review:
    grade: B
    status: needs_sdk
    note: Thorlabs KPA101 pymodaq 插件; 需要 pymodaq + Thorlabs SDK
    reviewed_at: '2026-04-26'
