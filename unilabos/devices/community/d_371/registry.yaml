  name: Thorlabs CCS200 紧凑型CCD光谱仪
  description: Thorlabs CCS200是一款紫外-可见-近红外宽谱紧凑型CCD光谱仪，光谱覆盖200-1000nm，采用背照式CCD增强紫外灵敏度，3648像素阵列，16位AD转换，适用于荧光、吸收光谱和光源表征，配备OSA软件和LabVIEW/C++/Python等多种编程接口。
  manufacturer: Thorlabs
  tags: &id001
  - 紫外-可见分光光度仪
  category: *id001
  model:
    name: Thorlabs CCS200 紧凑型CCD光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    光谱范围: 200-1000nm
    光谱精度: <0.5nm@633nm
    探测器: 3648像素CCD
    分辨率: <2.0nm FWHM
    积分时间: 10µs-60s
    信噪比: '300:1'
    动态范围: '1300:1'
    AD转换: 16位
    接口: USB 2.0
    品牌: Thorlabs
  cover: Thorlabs CCS200 紧凑型CCD光谱仪.webp
