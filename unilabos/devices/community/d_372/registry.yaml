  name: Thorlabs DCC3240M 高灵敏度USB 3.0 CMOS相机
  description: Thorlabs DCC3240M是一款高灵敏度USB 3.0单色CMOS相机，采用e2v EV76C560传感器，1.3百万像素，5.3µm像素尺寸，支持全局快门和卷帘快门切换，全分辨率39.7fps，具备外部触发输入，C-Mount镜头接口，兼容30mm笼式系统，配备ThorCam软件和SDK。
  manufacturer: Thorlabs
  tags: &id001
  - 工业与科学相机
  category: *id001
  model:
    name: Thorlabs DCC3240M 高灵敏度USB 3.0 CMOS相机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    传感器: e2v EV76C560
    分辨率: 1280×1024(1.3MP)
    像素尺寸: 5.3µm
    快门: 全局/卷帘可切换
    帧率: 39.7fps
    位深: 最高10位
    接口: USB 3.0
    镜头接口: C-Mount
    尺寸: 47.6×60.3×76.7mm
    品牌: Thorlabs
