  name: Bruker D8 Advance X射线衍射仪
  description: D8 Advance是Bruker基于独特D8平台设计的多功能X射线粉末衍射仪,支持XRD、PDF、SAXS和WAXS应用。专利DAVINCI.DESIGN实现光路组件的免工具免对准快速切换,TWIN/TWIN光路可在聚焦Bragg-Brentano和平行束几何间自动电动切换。配备动态束流优化(DBO)技术,在全角度范围内保证最高数据质量。
