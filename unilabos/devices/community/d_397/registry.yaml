  name: Newport ESP300通用运动控制器/驱动器
  description: Newport ESP300是先进的独立运动控制器，集成电机驱动器，可控制最多3轴步进和直流电机。支持1000倍可编程微步分辨率和S曲线速度曲线，具备RS-232和GPIB接口。与ESP兼容平台即插即用，已被ESP301继任但仍广泛使用于精密光学定位。
  manufacturer: Newport
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Newport ESP300通用运动控制器/驱动器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制轴数: 1-3轴
    电机类型: 步进和直流电机
    最大电流: 3A/轴
    微步分辨率: 1000x可编程
    接口: RS-232/GPIB(IEEE-488)
    DAC分辨率: 18-bit
    电源: 150W/400W可选
    品牌: Newport
