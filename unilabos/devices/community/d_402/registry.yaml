  name: Alicat MC系列质量流量控制器
  description: Alicat MC系列层流差压质量流量控制器支持EtherNet/IP工业通讯协议，经ODVA认证，可集成到任何EtherNet/IP网络中。单一设备可控制质量流量、体积流量或压力，最低流量可达0.05微升/分钟。支持设备级环网（DLR）拓扑，提供容错冗余。本地显示屏可同时显示质量流量、体积流量、绝对压力和温度数据。每台设备附带终身有限保修和NIST可追溯校准证书。
  manufacturer: Alicat Scientific
  tags: &id001
  - 科里奥利质量流量计
  category: *id001
  model:
    name: Alicat MC系列质量流量控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    精度: ±0.5%读数
    响应时间: 30-100ms
    压力范围: 最大160 PSIG
    量程比: '10000:1'
    通讯: EtherNet/IP/Modbus TCP/PROFINET
    预装气体校准: 98+种
    认证: ODVA认证
    品牌: Alicat Scientific
