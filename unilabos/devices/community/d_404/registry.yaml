  name: Dressler Cesar 1312 射频等离子发生器
  description: Dressler Cesar 1312（现归属Advanced Energy）是一款1200W射频等离子发生器，工作频率13.56 MHz。采用高效E类开关模式设计，产生更少热量，降低关键组件温度应力。独特的操作菜单提供对电源操作的深度控制，支持两种模拟和三种数字接口选项。适用于半导体制造、等离子体增强CVD、溅射和反应离子刻蚀等工艺。19英寸机架式安装，空气冷却设计。
  manufacturer: Advanced Energy
  tags: &id001
  - 射频与微波测试设备
  category: *id001
  model:
    name: Dressler Cesar 1312 射频等离子发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率: 13.56 MHz
    功率: 1200W
    交流输入: 230V(187-253V)
    冷却: 空气冷却
    尺寸: 483×500×88mm
    接口: 模拟/RS-232/Ethernet/Profibus/主动前面板
    设计: E类开关模式
    品牌: Advanced Energy
