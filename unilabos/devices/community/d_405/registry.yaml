  name: Gentec-EO BLU 无线激光功率计
  description: Gentec-EO BLU是一款集探测器与蓝牙无线计量于一体的激光功率测量系统，无需单独的监视器。操作人员可在距探测器最远30米处通过手机或平板查看测量数据，提升工作安全性。通过Gentec-EO
    BLU App（iOS/Android）或PC蓝牙适配器显示数据。集成化设计节省50%校准成本。USB充电锂离子电池可连续工作5天。附带NIST可追溯校准证书和个人波长校正证书。
  manufacturer: Gentec
  tags: &id001
  - 光传感器
  category: *id001
  model:
    name: Gentec-EO BLU 无线激光功率计
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    无线接口: 蓝牙
    工作距离: 最远30m
    电池: USB充电锂离子电池
    续航: 最长5天连续使用
    兼容探测器: 热电堆传感器
    校准: NIST可追溯
    统计功能: 当前值/最大/最小/平均/标准差/RMS
    品牌: Gentec
