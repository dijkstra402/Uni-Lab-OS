  name: HP E3631A 80W三路输出直流电源
  description: HP E3631A（现归属Keysight Technologies）是一款80W三路输出直流电源，提供6V/5A和±25V/1A三路独立输出。采用线性电源设计，具有极低噪声性能。双真空荧光显示器可同时显示电压和电流。标配GPIB和RS-232接口，支持SCPI协议远程编程。±25V输出可相互跟踪用于对称双极性供电。所有输出均配备过压保护。该产品已停产，推荐替代型号为E36312A/E36311A。
  manufacturer: Keysight
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: HP E3631A 80W三路输出直流电源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    输出1: 0-6V/0-5A
    输出2: 0-+25V/0-1A
    输出3: 0--25V/0-1A
    总功率: 80W
    纹波噪声: <350μVrms
    接口: GPIB/RS-232
    编程精度: 0.05%+20mV
    品牌: Keysight
  cover: HP E3631A 80W三路输出直流电源.webp
