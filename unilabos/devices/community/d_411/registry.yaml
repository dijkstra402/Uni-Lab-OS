  name: Lake Shore 475 DSP高斯计
  description: Lake Shore 475是一款基于数字信号处理器（DSP）技术的高精度霍尔效应高斯计，专为最苛刻的DC和AC磁场测量应用设计。DSP技术结合精密磁场测量能力，可替代磁场测量系统中的多台仪器。支持最高1000读数/秒的数据缓冲采样和100读数/秒的计算机接口采样。集成电磁铁场控制算法（PI控制），配备1024个场读数的数据缓冲区。兼容Lake
    Shore各类霍尔探头，获CE认证，提供3年保修。
  manufacturer: Lake Shore
  tags: &id001
  - 半导体参数测试仪
  category: *id001
  model:
    name: Lake Shore 475 DSP高斯计
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    满量程范围: 3.5G-350kG
    DC分辨率: 0.02mG
    DC精度: ±0.05%
    频率范围: DC-50kHz
    AC滤波器: 15带通+3低通
    采样速率: 最高1000读数/秒
    接口: IEEE-488/TTL触发/模拟输出
    品牌: Lake Shore
  quality_review:
    grade: B
    status: needs_sdk
    note: 'Lake Shore 475: 自研 instrumentkit 风格实现'
    reviewed_at: '2026-04-26'
