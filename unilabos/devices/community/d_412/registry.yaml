  name: MingHe MHS-5200A 双通道DDS信号发生器
  description: MingHe MHS-5200A是一款双通道DDS（直接数字合成）信号发生器，有6M/12M/20M/25M多种频率版本。采用大规模集成电路和高速FPGA
    MCU微处理器，表面贴装工艺。CH1和CH2完全对称，各通道可独立设置参数。支持正弦波、三角波、方波、锯齿波及16组用户自定义任意波形。内置60MHz频率计和计数器功能，支持脉冲串输出。可通过前面板或USB接口进行PC控制。配备LC1602
    LCD显示屏。
  manufacturer: MingHe
  tags: &id001
  - 信号源与发生器
