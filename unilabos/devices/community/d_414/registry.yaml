  name: Newport ESP-301 三轴集成运动控制器/驱动器
  description: Newport ESP-301是一款三轴集成运动控制器/驱动器，采用64位浮点DSP处理器实现高精度同步控制。支持DC有刷和2/4相步进电机，每轴最大3A。具备数字PID伺服环、速度和加速度前馈控制算法，支持同步点对点、3D线性和2D圆弧插补、主从运动。配备80字符LCD显示屏和前面板键盘，支持Newport
    ESP平台自动检测和自动配置。可存储99个程序到64KB非易失性存储器。该产品已于2020年停产，替代型号为ESP302。
  manufacturer: Newport
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Newport ESP-301 三轴集成运动控制器/驱动器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: '3'
    电机类型: 2/4相步进电机和直流有刷电机
    电流: 最大3A/轴
    DAC分辨率: 16bit
    编码器频率: 5MHz
    伺服更新: 0.4ms
    接口: USB/RS-232
    尺寸: 76.2×429.5×320mm
    重量: 6kg
    品牌: Newport
