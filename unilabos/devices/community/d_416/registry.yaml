  name: Pfeiffer TPG 361 单通道真空规控制器
  description: Pfeiffer TPG 361是一款单通道真空规测量与控制单元，属于ActiveLine系列产品。兼容Pfeiffer的Pirani规、冷阴极规和热阴极规等多种真空传感器，压力测量范围取决于所连接的传感器类型。具备数字显示、可配置设定点继电器用于过程控制、模拟输出用于记录和监控。支持RS-232串行通讯接口进行远程控制。ActiveLine系列提供经典模拟输出，覆盖从超高真空到过压的宽泛真空范围。
  manufacturer: Pfeiffer Vacuum
  tags: &id001
  - 真空测量仪器
  category: *id001
  model:
    name: Pfeiffer TPG 361 单通道真空规控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '1'
    系列: ActiveLine
    兼容规管: Pirani/冷阴极/热阴极
    接口: 模拟输出/继电器设定点/RS-232
    电源: 100-240VAC
    安装: 机架式/台式
    显示: 数字压力显示
    品牌: Pfeiffer Vacuum
