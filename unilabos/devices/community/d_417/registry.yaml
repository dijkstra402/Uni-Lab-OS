  name: Pfeiffer TPG 362 双通道真空规控制器
  description: Pfeiffer TPG 362是一款双通道真空规测量与控制单元，是TPG 361的双通道版本，同属ActiveLine系列。支持两路真空传感器同时测量，兼容Pirani规和冷阴极规。Pirani规覆盖1000至5.4×10⁻⁴
    mbar范围，冷阴极规覆盖10⁻²至5.4×10⁻⁹ mbar范围。具备2至4个可配置设定点继电器、数字显示和可选择的压力单位（mbar/Torr/Pa）。紧凑的半19英寸机架宽度设计，支持面板安装或台式使用。
  manufacturer: Pfeiffer Vacuum
  tags: &id001
  - 真空测量仪器
  category: *id001
  model:
    name: Pfeiffer TPG 362 双通道真空规控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '2'
    系列: ActiveLine
    兼容规管: Pirani(1000-5.4×10⁻⁴mbar)/冷阴极(10⁻²-5.4×10⁻⁹mbar)
    设定点继电器: 2-4个可配
    接口: RS-232/RS-485/模拟输出
    电源: 100-240VAC
    品牌: Pfeiffer Vacuum
