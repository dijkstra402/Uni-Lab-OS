  name: Phase Matrix QuickSyn FSW-0020 频率合成器
  description: Phase Matrix QuickSyn FSW-0020（现归属National Instruments）是一款高性能微波频率合成器，覆盖0.5至20GHz频率范围。采用宽带基波VCO，无倍频处理，消除了谐波频谱污染。专利相位精化技术提供快速切换和低相位噪声的独特组合。在20GHz下10kHz偏移处相位噪声为-116dBc/Hz，触发列表模式下切换速度快至100μs。支持AM、FM、相位和脉冲调制。紧凑金属屏蔽封装，单12V直流供电，功耗不到20W。
  manufacturer: Phase Matrix
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Phase Matrix QuickSyn FSW-0020 频率合成器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 0.5-20GHz(可扩展至0.2GHz)
    频率分辨率: 0.001Hz
    输出功率: -10至+13dBm
    切换速度: 100μs
    相位噪声: -116dBc/Hz@10kHz偏移@20GHz
    调制: AM/FM/相位/脉冲
    功耗: <20W
    电源: 12VDC
    接口: USB/GPIB
    品牌: Phase Matrix
