  description: Picowatt AVS-47B是一款由芬兰RV-Elektroniikka Oy制造的精密交流电阻桥，专用于低温传感器的电阻测量。支持多种计算机接口方案：USB-Picobus（免费标准接口，支持Windows/LabVIEW）、AVS47-Serial/USB-W串行接口（USB或RS232）以及AVS47-Picolink光纤链路（用于电气隔离场景）。该产品已停产，后继型号为AVS-48SI，提供改进的性能指标。现有AVS-47桥仍提供维修服务和配件支持。
