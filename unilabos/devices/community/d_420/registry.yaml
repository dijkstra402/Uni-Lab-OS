  name: Sunpower CryoTel GT 斯特林低温制冷机
  description: Sunpower CryoTel GT是一款整体式斯特林低温制冷机，在77K下提供16W制冷量。采用Sunpower气体轴承技术实现运动部件无接触运行，MTTF超过200,000小时。任意方向安装，温度稳定性±0.1K。2005年商业化以来，已成功应用于高温超导滤波器、高空气球、锗探测器、红外探测器、射电望远镜和激光二极管冷却等领域。作为CryoTel系列产品之一，代表了Sunpower三十年自由活塞斯特林技术的成果。亦有GTLT低温变体可达30K以下。
  manufacturer: Sunpower
  tags: &id001
  - 冷热水机
  category: *id001
  model:
    name: Sunpower CryoTel GT 斯特林低温制冷机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    制冷量: 16W@77K(23°C排热)
    额定输入功率: 240W
    最低温度: 40K
    电源: 48VDC
    质量: 3.1kg
    长度: 276mm
    直径: 83mm
    温度稳定性: ±0.1K
    工作频率: 60Hz
    MTTF: 200000小时
    方向: 任意
    品牌: Sunpower
