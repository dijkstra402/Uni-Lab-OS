  name: Tektronix TDS5XX系列数字示波器
  description: Tektronix TDS5XX系列（包括TDS520B和TDS540B）是一组配备InstaVu采集技术的数字化示波器，每秒可捕获100,000个波形用于观察快速变化信号。TDS520B为2通道+2辅助通道，最高1GS/s；TDS540B为4通道，最高2GS/s。均提供500MHz带宽，支持边沿、脉宽、毛刺、矮脉冲、图形和状态等多种触发类型，具备25种自动测量功能。FastFrame分段采集存储器和双窗口缩放功能。该产品已停产，可通过Tektronix
    Encore翻新计划获取。
  manufacturer: Tektronix
  tags: &id001
  - 示波器与波形分析仪
  category: *id001
  model:
    name: Tektronix TDS5XX系列数字示波器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    带宽: 500MHz
    采样率: 最高2GS/s(TDS540B)
    通道: 2+2辅助(TDS520B)/4(TDS540B)
    记录长度: 50K(可选500K)
    垂直分辨率: 8bit(Hi-Res可达12bit)
    灵敏度: 1mV-10V/div
    InstaVu: 100000波形/秒
    品牌: Tektronix
