  name: Delta Elektronika PSC-ETH 以太网通信模块
  description: PSC-ETH是Delta Elektronika为其可编程直流电源系列设计的以太网通信模块，提供LAN连接能力，支持SCPI命令协议进行远程编程控制。该模块内置Web界面，用户可通过网络浏览器实时监控和控制电源参数，适用于需要远程操控的工业和科研应用场景。
