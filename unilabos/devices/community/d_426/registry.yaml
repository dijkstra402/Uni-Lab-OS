  name: Glassman FR系列高压直流电源
  description: Glassman FR系列（现由XP Power生产）是一款300W高压直流电源，输出电压范围从1kV到60kV，提供正极、负极和可逆极性配置。采用1U
    19英寸机架安装设计，具备电压和电流调节功能，内置短路、电弧和过载保护。支持RS232/USB数字控制接口，适用于电子束系统、离子注入、X射线发生和静电应用等领域。
