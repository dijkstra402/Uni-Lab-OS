  name: Thorlabs BSC201单通道台式步进电机控制器
  description: BSC201是Thorlabs BSC200系列单通道台式步进电机控制器，专为驱动高功率双相双极步进电机设计，支持编码器反馈闭环定位。提供梯形和S形速度曲线选择，理论微步分辨率达409600步，速度是前代产品的两倍以上。USB连接支持多台设备通过集线器级联实现多轴控制，兼容Kinesis和APT软件平台。
