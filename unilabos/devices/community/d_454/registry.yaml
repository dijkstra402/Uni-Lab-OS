  name: Thorlabs PAX1000系列高动态范围偏振分析仪
  description: Thorlabs PAX1000系列偏振分析仪用于测量准直单色光的偏振态，三种型号覆盖400-1700nm波长范围。采用真零级四分之一波片旋转测量法，采样率最高200Hz，可同时显示5个测量源。配套软件支持长期测量和数据校正，需外接DS15电源实现最高采样率。
