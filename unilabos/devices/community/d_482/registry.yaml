  description: Cryomagnetics TM620是一款双通道低温温度监测仪，专为监测低温制冷机、屏蔽层和超导磁铁温度而设计。配备明亮的双行真空荧光显示屏，可同时显示两个温度传感器的读数。支持开尔文、摄氏、华氏和电阻值多种显示模式。具有声音报警功能和高低温控制输出设定点。标配RS-232通信接口，可选IEEE-488.2接口。采用19英寸机架安装设计，提供免费LabVIEW驱动程序。
