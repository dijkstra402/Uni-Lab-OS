  name: 8753D RF矢量网络分析仪
  description: HP 8753D是Hewlett-Packard生产的经典RF矢量网络分析仪，频率覆盖30kHz至3GHz（可扩展至6GHz）。内置合成RF源和S参数测试集，支持全双端口校准和误差校正。配备彩色CRT显示屏，可同时显示4个通道。具有时域分析（选件010）、列表频率扫描和混频器测试等功能，广泛用于滤波器、放大器、电缆和天线的特性分析。该产品已停产，替代型号为E5071C
    ENA。
