  name: Keysight N5222B PNA微波矢量网络分析仪
  description: Keysight N5222B是PNA系列微波矢量网络分析仪，专为有源器件测试设计。频率覆盖900 Hz至26.5 GHz，提供2端口和4端口配置。内置脉冲调制器和脉冲发生器，可快速准确地进行脉冲S参数测量。配备源极和接收机衰减器、偏置器等组件，提供卓越的射频性能。支持超过120个软件选件，可表征RF功率放大器、混频器和调制器等器件的非线性行为。采用多点触控显示屏和直观图形界面。
  manufacturer: Keysight
