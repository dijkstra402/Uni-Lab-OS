  name: Rigol DG4000系列 函数/任意波形发生器
  description: Rigol DG4000系列是多功能信号发生器，集函数发生、任意波形发生、脉冲发生、谐波发生（最高16次）、模拟/数字调制和频率计于一体。采用DDS技术产生稳定精确的低失真信号，双通道性能相同，支持通道间频率/幅度/相位耦合。配备7英寸高分辨率显示屏，支持AM/FM/PM/ASK/FSK/PSK/PWM等多种调制方式，具有线性/对数/步进扫描功能，标配LXI-C以太网、USB接口。
  manufacturer: Rigol
  tags: &id001
  - 信号源与发生器
