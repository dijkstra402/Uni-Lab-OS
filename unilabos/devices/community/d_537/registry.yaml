  name: Rigol DS1074Z 数字示波器
  description: Rigol DS1074Z是一款4通道70 MHz数字示波器，采用RIGOL UltraVision技术实现深存储、高捕获率和多级亮度分级显示。采样率1
    GSa/s，标配12M点存储深度，可选升级至24M点。支持最多60000帧硬件实时波形录制回放，具备窗口触发、N沿触发、延迟触发等高级触发功能。可选RS232/I2C/SPI协议解码，支持混合信号升级至16路数字通道，是入门级示波器中性价比极高的选择。
  manufacturer: Rigol
