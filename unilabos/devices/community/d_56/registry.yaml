  name: Inficon SQM-160/SQC-310 薄膜监控仪/控制器
  description: Inficon SQM-160是入门级单通道薄膜速率/厚度监控仪,可存储50个膜程序,通过RS-232通信和数据记录,适用于单源简单蒸镀监测。SQC-310是进阶双通道沉积控制器,具备PID闭环控制、模拟输出(0-10V/4-20mA)驱动蒸发源功率调节,支持共蒸镀监测、自动晶片失效切换和多层工艺序列编程,适用于更复杂的真空镀膜应用。
  manufacturer: Inficon
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: Inficon SQM-160/SQC-310 薄膜监控仪/控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    SQM-160: 单通道监控仪/速率0.01-999.9Å/s/厚度至999999Å/50个膜程序/RS-232接口
    SQC-310: 双通道控制器/PID闭环控速/0-10V或4-20mA模拟输出/自动晶片切换/多层序列/快门控制/RS-232和可选Ethernet
    品牌: Inficon
