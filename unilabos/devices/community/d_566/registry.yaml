  name: Ametek 7270 DSP锁相放大器
  description: Ametek Signal Recovery 7270是通用型DSP数字信号处理锁相放大器,频率范围1 mHz至250 kHz。具备双参考/双谐波检测功能,可同时测量两个不同频率的信号,支持串联解调模式。信号输入放大器可设置为单端或差分电压模式及单端电流模式。内置频谱显示模式,方便选择参考频率时避开干扰信号。快速捕获模式可存储100,000个数据点。通过RS-232、USB和以太网实现远程控制。
  manufacturer: Signal Recovery
  tags: &id001
  - 锁相放大器与微弱信号检测
  category: *id001
  model:
    name: Ametek 7270 DSP锁相放大器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 1 mHz至250 kHz
    全量程灵敏度: 2 nV至1V
    动态储备: '>100 dB'
    电压设定分辨率: 1 μV
    偏置: ±300% F.S.
    接口: RS-232/USB/以太网
    品牌: Signal Recovery
