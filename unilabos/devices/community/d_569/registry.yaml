  name: Cryogenic SMS120C 超导磁铁电源
  description: Cryogenic SMS120C是英国Cryogenic Limited生产的SMS系列智能超导磁铁电源控制器,最大输出电流±120A。具备四象限操作能力,可实现线性磁场扫描平滑过零。前面板手动控制与USB远程控制兼备,支持LabVIEW软件集成。内置持续开关加热器控制、失超检测保护和自动降流功能。可选配高分辨率20位DAC(3
