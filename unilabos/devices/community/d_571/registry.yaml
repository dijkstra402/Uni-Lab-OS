  name: Cryomagnetics Model 4G 超导磁铁电源
  description: Cryomagnetics Model 4G是第四代双极性超导磁铁电源,专为超导磁铁高感性负载优化设计。全系列为四象限真双极系统,可平滑扫描过零。PID控制扫描,电流可设定分辨率0.1
    mA。内置持续开关加热器电源、失超检测保护和自动降流功能。配备彩色TFT LCD显示屏,支持USB、以太网和IEEE-488.2接口。提供4G-100(±100A)、4G-150(±150A)和4G-200S(±200A)等多个功率等级,可选配磁场匀场控制功能。
