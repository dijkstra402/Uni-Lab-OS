  name: Gentec Maestro 激光功率能量计
  description: Gentec Maestro是触摸屏激光功率和能量测量显示仪,单通道设计,兼容Gentec-EO全系列热电堆、热释电、光电二极管和太赫兹探测器。配备5.6英寸640x480像素18位彩色触摸LCD,支持实时显示、示波器模式、统计分析和数字调谐针等多种显示方式。提供USB、以太网和RS-232多种通信接口及模拟输出。内置可充电镍氢电池,续航6.5小时,支持便携使用。可通过USB存储设备保存数据。
