  name: Holzworth HS9000 多通道射频合成器
  description: Holzworth HS9000系列(现更新为HS9100系列)是高性能多通道射频合成器平台,采用专有非PLL合成架构,实现业界领先的低相位噪声和快速切换。每台1U机箱可配置1至8个独立可调通道,各通道频率范围可独立指定。集中式参考分配子系统确保所有通道100%相位相干。无风扇传导冷却机箱设计,最小化通道间温度梯度,确保最佳信号稳定性。适用于粒子加速器时钟、卫星定位跟踪等高精度应用。
  manufacturer: Holzworth
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Holzworth HS9000 多通道射频合成器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 250 kHz至6.7 GHz
    通道数: 1至8通道(每1U机箱)/最高16通道(窄带配置)
    相位相干: 100%通道间相位相干
    平均功耗: 7W/通道
    安装方式: 1U 19英寸机架
    架构: 非PLL专有合成技术
    品牌: Holzworth
  cover: Holzworth HS9000 多通道射频合成器.webp
