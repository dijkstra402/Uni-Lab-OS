  name: Oxford Instruments Kelvinox IGH 稀释制冷机智能气体处理系统
  description: Oxford Instruments Kelvinox IGH是配备智能气体处理系统的稀释制冷机，可达约10mK基底温度，具备多档混合室加热功率控制，通过ISOBUS通信接口实现远程控制，适用于量子输运、低温凝聚态物理等超低温实验研究。
