  name: Rigol DP932 三路输出可编程直流电源
  description: Rigol DP932是DP900系列三路输出可编程线性直流电源，提供两路32V/3A和一路6V/3A输出，低纹波噪声，支持独立/串联/并联模式，具备定时功能和波形显示，通过USB和LAN接口远程控制，适用于通用实验室测试。
  manufacturer: Rigol
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: Rigol DP932 三路输出可编程直流电源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    输出通道: '3'
    通道1: 0-32V/0-3A
    通道2: 0-32V/0-3A
    通道3: 0-6V/0-3A
    总功率: ~195W
    接口: USB/LAN(LXI)
    分辨率: mV/mA级
    保护: OVP/OCP
    品牌: Rigol
