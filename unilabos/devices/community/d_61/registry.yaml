  name: Julabo Presto A40 高动态温控系统
  description: Julabo Presto A40是一款高动态温控过程系统，工作温度范围宽达-40°C至+250°C，温度稳定性可达±0.01°C。采用风冷设计，结构紧凑，适用于反应器温控和材料应力测试。磁力耦合离心泵免维护，自润滑设计确保长使用寿命。多种通信接口支持网络远程控制和上位系统集成，可快速补偿放热/吸热反应，是化学合成和工艺开发的理想温控方案。
  manufacturer: Julabo
  tags: &id001
  - 全封闭循环装置
  category: *id001
  model:
    name: Julabo Presto A40 高动态温控系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温度范围: -40~+250°C
    温度稳定性: ±0.01~±0.05°C
    加热功率: 2.3kW
    制冷量(20°C): 1.2kW
    泵流量: 0~40L/min
    泵压力: 最大1.7bar
    制冷剂: R449A
    活性换热体积: 1.7L
    尺寸: 330×589×671mm
    重量: 79kg
    品牌: Julabo
  cover: Julabo Presto A40 高动态温控系统.webp
