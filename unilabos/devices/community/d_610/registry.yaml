  name: Andor Shamrock SR750 切尔尼-特纳光谱仪
  description: Andor Shamrock SR750是一款高性能Czerny-Turner光谱仪，焦距750mm，配备三光栅电动转台，可实现亚纳米级光谱分辨率。适用于拉曼光谱、光致发光、等离子体诊断等精密光谱分析应用，可与Andor系列CCD和EMCCD探测器无缝集成。
  manufacturer: Andor
  tags: &id001
  - 紫外-可见分光光度仪
  category: *id001
  model:
    name: Andor Shamrock SR750 切尔尼-特纳光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    焦距: 750mm
    光圈比: f/9.7
    光学结构: Czerny-Turner
    光栅转台: 三光栅电动转台
    光谱分辨率: <0.05nm
    波长范围: UV-NIR
    杂散光: <1×10⁻⁵
    探测器兼容: Andor CCD/EMCCD/iCCD
    品牌: Andor
