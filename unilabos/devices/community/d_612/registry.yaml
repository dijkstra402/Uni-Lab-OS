  name: Stanford Research Systems SIM928 隔离直流电压源
  description: SRS SIM928是一款超低噪声隔离直流电压源模块，设计用于SIM900主机框架。其输出电路通过光隔离与所有接地充电电路分离，内置两组独立镍氢充电电池，可在满载条件下持续运行12小时，电池切换几乎无毛刺，提供全天候不间断的超纯净直流电压输出。
  manufacturer: Stanford Research Systems
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: Stanford Research Systems SIM928 隔离直流电压源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    输出范围: ±20V
    分辨率: 1mV
    最大输出电流: ±10mA
    噪声: 10µVrms(1kHz带宽)
    浮动输出: ±40V(共模对地)
    电池供电: 双镍氢可充电电池
    通信: RS-232(最高38400bps)
    充电周期: 1000次
    品牌: Stanford Research Systems
  cover: Stanford Research Systems SIM928 隔离直流电压源.webp
  quality_review:
    grade: B
    status: needs_sdk
    note: 需要 qcodes; SIM928 VisaInstrument
    reviewed_at: '2026-04-26'
