  name: Lauda Proline RP 845 制冷加热循环浴
  description: Lauda Proline RP 845是一款专业级制冷加热循环恒温器，温度范围覆盖-45°C至200°C，温度稳定性优于±0.01K。采用专利SmartCool数字制冷管理技术，节能高达75%。PowerAdapt系统自动调节功率消耗，VarioFlex高性能压力-吸力泵配有八级泵力设置，可连接开放和封闭回路。不锈钢浴槽耐腐蚀，适用于实验室精密温控和工业过程控制。
  manufacturer: Lauda
