  name: Rohde & Schwarz ZNLE3 矢量网络分析仪
  description: R&S ZNLE3是一款高性能、高性价比的双端口矢量网络分析仪，频率覆盖1MHz至3GHz，可完成S11/S21/S12/S22全双端口测量。配备10.1英寸多点触摸屏和Windows
    10操作系统，机身深度不足24cm、重量约6kg，是同级别中最紧凑的VNA产品。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  model:
    name: Rohde & Schwarz ZNLE3 矢量网络分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 1MHz-3GHz(可扩展至100kHz)
    端口数: '2'
    迹线噪声: 典型0.001dB(@10kHz带宽)
    IF带宽: 1Hz-500kHz
    灵敏度: 120dBm
    测试端口连接器: N(f)
    显示: 10.1英寸触摸屏
    系统: Windows 10
    接口: USB/LAN/GPIB(可选)
    重量: 约6kg
    品牌: Rohde & Schwarz
