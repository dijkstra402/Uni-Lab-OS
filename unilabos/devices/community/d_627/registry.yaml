  name: ERA Instruments ERASynth++ 开源射频信号发生器
  description: ERA Instruments ERASynth++是ERASynth系列中频率最高的型号，覆盖250kHz至20GHz，配备15-20GHz腔体滤波器。采用与ERASynth+相同的多环PLL架构和OCXO参考源，无分数N或整数边界杂散，精密铣削镀镍铝合金外壳，开源设计适合预算有限的专业RF应用。
  manufacturer: ERA Instruments
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: ERA Instruments ERASynth++ 开源射频信号发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 250kHz-20GHz
    幅度范围: -60至+15dBm
    相位噪声: -120dBc/Hz(@1GHz/10kHz偏移)
    频率切换时间: 250µs
    参考: OCXO(±25ppb)
    接口: WiFi/Mini USB/SMA
    尺寸: 10.5×14.5×2cm
    功耗: <7W
    品牌: ERA Instruments
