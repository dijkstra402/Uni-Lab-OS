  name: Thorlabs KBD101 K-Cube无刷直流伺服电机控制器
  description: Thorlabs KBD101是一款紧凑型K-Cube无刷直流伺服电机控制器，可驱动多种旋转和直线无刷三相直流电机。具有用户可配置的S曲线加减速轮廓，实现快速平稳定位无振动和冲击。顶部控制面板配有速度轮，前部双向触发端口可用于外部设备同步控制。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs KBD101 K-Cube无刷直流伺服电机控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    电机功率: 最大2.5W
    峰值线圈电流: 最大2A
    最大速度: 500mm/s(配DDS系列平台)
    触发端口: 2个双向5V逻辑
    尺寸: 60×60×49.2mm
    接口: USB 3.0(Micro-B)
    软件: Kinesis/XA
    品牌: Thorlabs
  cover: Thorlabs KBD101 K-Cube无刷直流伺服电机控制器.webp
