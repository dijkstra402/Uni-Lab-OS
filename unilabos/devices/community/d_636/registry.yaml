  name: Thorlabs BPC002 双通道台式压电控制器
  description: Thorlabs BPC002是一款双通道150V高功率台式压电控制器，可同时驱动两个独立的压电通道进行纳米级位置控制。支持开环电压控制和闭环位置反馈模式，灵活的软件设置使其可兼容第三方压电元件，适合双轴压电扫描和定位应用。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs BPC002 双通道台式压电控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '2'
    输出电压: 75-150V可选
    最大输出电流: 0.5A/通道
    控制模式: 开环/闭环
    显示: 电压或位置(微米)
    波形发生: 内置
    触发输出: 支持
    接口: USB
    软件: APT/Kinesis
    品牌: Thorlabs
