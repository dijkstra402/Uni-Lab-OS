  name: Thorlabs BNT001 台式NanoTrak控制器
  description: Thorlabs BNT001是一款台式NanoTrak自动对准控制器，设计用于最大化光学系统的光功率吞吐量。通过驱动压电执行器使光纤端面做圆形扫描运动，执行功率梯度搜索确定峰值功率方向并自动定位。内置红外InGaAs光电二极管，支持PID闭环控制。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs BNT001 台式NanoTrak控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    探测器类型: Si或InGaAs PIN光电二极管
    光电流范围: 1nA-10mA
    光功率监测: BNC多量程
    信号相位补偿: -180°至180°
    圆形扫描频率: 1-300Hz
    接口: USB
    软件: APT/Kinesis
    品牌: Thorlabs
