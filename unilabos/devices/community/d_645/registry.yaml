  name: Thorlabs MFF102 电动滤光片翻转架
  description: Thorlabs MFF102是一款双位高速电动滤光片翻转架，可将滤光片、透镜等光学元件快速翻入或翻出自由空间光束路径。支持四种控制方式：顶部按钮、遥控手柄、SMA外部信号触发和PC软件控制。具有速度反馈平滑过渡和机械硬止动定位，含Kinesis软件和电源。
  manufacturer: Thorlabs
  tags: &id001
  - 光学调整架
  category: *id001
  model:
    name: Thorlabs MFF102 电动滤光片翻转架
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    翻转位置: 2个(0°和90°)
    翻转时间: ~500ms(典型,<50g负载)
    兼容光学元件: 最大Ø2英寸(50.8mm)
    螺纹: SM1(1.035"-40)
    截面尺寸: 30×30mm
    控制方式: 顶部按钮/遥控手柄/SMA外部触发/PC软件
    供电: 15V
    安装: 8-32螺孔
    品牌: Thorlabs
