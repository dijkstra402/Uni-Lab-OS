  name: Thorlabs KNA101 K-Cube NanoTrak自动对准控制器
  description: Thorlabs KNA101是一款K-Cube NanoTrak自动对准控制器，通过驱动压电执行器使光纤端面做圆形扫描运动执行功率梯度搜索，自动定位至最大光功率吞吐量位置。适用于光纤到光纤和光纤到自由空间系统的自动对准优化，USB即插即用兼容Kinesis软件。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs KNA101 K-Cube NanoTrak自动对准控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    功能: 光纤自动对准优化
    驱动电压: 最高±125V
    扫描模式: 圆形抖动功率梯度搜索
    信号输入: 模拟光功率反馈
    输出电压: 0-75V或0-150V
    接口: USB(Micro-B)
    尺寸: ~60×60×47mm
    软件: Kinesis/APT
    品牌: Thorlabs
