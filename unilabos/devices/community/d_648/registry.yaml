  name: Thorlabs KSG101 K-Cube应变片读数器
  description: Thorlabs KSG101是一款紧凑型单通道K-Cube应变片读数器，用于读取压电驱动平台和支架中的应变片传感器信号，支持USB连接和Kinesis/APT软件平台，可实现闭环位置反馈控制，适用于纳米定位系统。
  manufacturer: Thorlabs
  tags: &id001
  - 数据采集与记录仪
