  model:
    name: Thorlabs KSG101 K-Cube应变片读数器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '1'
    接口: USB
    兼容软件: Kinesis/APT
    外形: K-Cube紧凑型
    显示: 内置LCD实时读数
    供电: KCH601/KCH301控制器集线器或独立电源
    品牌: Thorlabs
