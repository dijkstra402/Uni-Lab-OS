  name: Lake Shore 218低温温度监测仪
  description: Lake Shore 218是一款多功能八通道低温温度监测仪，可同时显示全部八个通道数据，支持几乎所有类型的二极管和电阻温度传感器，测量范围低至1.2K，具备低噪声、高分辨率特性，配备IEEE-488和RS-232C接口，适用于低温研究和超导磁体系统。
  manufacturer: Lake Shore
  tags: &id001
  - 低温温度控制器
  category: *id001
  model:
    name: Lake Shore 218低温温度监测仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '8'
    温度范围: 1.2K-800K
    传感器: 二极管/RTD/热电偶/Cernox
    接口: IEEE-488/RS-232C
    显示单位: K/°C/V/Ω
    报警: 高低报警继电器
    品牌: Lake Shore
