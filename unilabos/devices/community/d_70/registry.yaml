  name: ThalesNano H-Cube 连续流动加氢反应器
  description: ThalesNano H-Cube系列是革命性的连续流动加氢反应器，通过电解水现场产氢，无需储存高压氢气瓶，安全性极高。CatCart一次性催化剂卡盒技术避免接触危险的催化剂粉末。H-Cube
    Mini Plus适合常规加氢，H-Cube Pro双电解槽可产氢60NmL/min并支持冷却至10°C。可扩展Gas Module(14种气体)和Phoenix高温反应器(450°C)。2005年获R&D
    Top 100大奖，已成为实验室加氢行业标准。
  manufacturer: ThalesNano
  tags: &id001
  - 催化剂评价装置
  category: *id001
  model:
    name: ThalesNano H-Cube 连续流动加氢反应器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温度范围: 室温~100°C(Mini Plus)/10~150°C(Pro)
    压力范围: 常压~100bar
    氢气产生: 电解水现场制氢
    液体流量: 0.3~3mL/min
    催化剂: CatCart一次性催化柱
    Pro尺寸: 370×510×400mm
    Pro重量: 23kg
    电源: 115-230VAC
    品牌: ThalesNano
