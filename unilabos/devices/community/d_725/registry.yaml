  name: Silicon Software microEnable系列图像采集卡
  description: Silicon Software microEnable系列是基于FPGA的高性能图像采集卡，支持Camera Link、CoaXPress和GigE
    Vision等多种接口标准，DMA传输速率最高900MB/s，内置FPGA处理器可执行实时图像预处理而不占用CPU，可通过VisualApplets进行FPGA编程。
  manufacturer: Silicon Software
  tags: &id001
  - 工业与科学相机
  category: *id001
  model:
    name: Silicon Software microEnable系列图像采集卡
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    系列: microEnable 5 ironman/marathon/IV/III
    接口: Camera Link/CoaXPress/Camera Link HS/GigE Vision
    DMA传输: 最高900MB/s
    总线: PCIe x4
    FPGA: 可编程图像预处理
    软件: VisualApplets/HALCON
    品牌: Silicon Software
