  name: BitFlow Axion/Aon/Neon系列Camera Link图像采集卡
  description: BitFlow Axion-CL是第二代PCIe Gen 2高性能Camera Link图像采集卡系列，支持多达四路Camera Link相机同步或独立运行，采用StreamSync
