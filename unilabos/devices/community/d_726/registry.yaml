  category: *id001
  model:
    name: BitFlow Axion/Aon/Neon系列Camera Link图像采集卡
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    总线: PCIe Gen 2 x4
    相机支持: 最多4路Camera Link Base/Medium/Full/80-bit
    速度: 85MHz
    DMA: StreamSync引擎
    格式: 面阵/线阵/彩色/单色
    配置: XML/BFML
    品牌: BitFlow
