  name: Omicron DeepStar系列高速调制半导体激光器
  description: Omicron DeepStar系列（现归属Coherent）是专为荧光显微镜和生物光子学设计的高速调制二极管激光器，调制频率超150MHz，提供UV至红光多种波长选择，纳秒级开关时间，单模光纤耦合输出，是STED超分辨和荧光寿命成像的理想光源。
