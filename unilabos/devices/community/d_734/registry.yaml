  name: CoolLED pE-300系列显微镜LED光源
  description: CoolLED pE-300系列是替代传统卤素灯的白光LED显微镜照明系统，色温约5700K日光平衡，强度0-100%电子连续可调，LED寿命超25000小时，即时开关无需预热，低热量输出，支持USB和TTL控制，兼容各主要品牌显微镜，适用于明场和相差观察。
