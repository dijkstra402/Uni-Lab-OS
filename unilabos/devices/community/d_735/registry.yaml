  name: CoolLED pE-4000通用型16波长LED荧光光源
  description: CoolLED pE-4000是通用型LED荧光照明系统，提供16个独立可选波长覆盖365至770nm，最多4个波长同时输出，每个波长0.1%精度独立强度调节，微秒级切换速度无需机械快门，支持TTL和USB控制，LED寿命数万小时，兼容各主流品牌荧光显微镜。
