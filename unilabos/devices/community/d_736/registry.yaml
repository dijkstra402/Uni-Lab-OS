  name: LUDL MAC2000模块化显微镜自动化控制器
  description: LUDL MAC2000是模块化显微镜自动化控制器系统，通过单一总线可控制多达255个独立模块，支持XY电动平台、Z聚焦驱动、滤光片轮和快门等设备，RS-232接口连接外部计算机，可通过CPU模块实现键盘独立操控，兼容Micro-Manager开源显微镜软件。
  manufacturer: LUDL
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: LUDL MAC2000模块化显微镜自动化控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    架构: 模块化最多255个模块
    接口: RS-232 (9600波特/2停止位)
    控制: XY平台/Z聚焦/滤光片轮/快门
    模块: EMOT电机/EDAIO数字IO/EAFC自动对焦
    软件: Micro-Manager兼容
    品牌: LUDL
  cover: LUDL MAC2000模块化显微镜自动化控制器.webp
