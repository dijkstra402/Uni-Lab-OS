  resource_type: device
  device_params:
    通道数: '4'
    每通道最大电流: 3A
    接口: USB(菊花链)
    数字I/O: 4个TTL输入/2个TTL输出
    软件兼容: Zaber Launcher/µManager
    品牌: Zaber
