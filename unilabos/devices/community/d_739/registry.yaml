  name: Zaber Nucleus X-LCA4 四通道LED控制器
  description: Zaber X-LCA4是Nucleus系列四通道LED控制器，专为显微镜照明设计，每通道可独立控制高达3A电流，支持USB菊花链连接和TTL低延迟控制，输出极其稳定，兼容µManager显微镜软件。
