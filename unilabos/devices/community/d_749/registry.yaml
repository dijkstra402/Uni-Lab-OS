  name: Omicron LuxX+ 增强型半导体激光器
  description: Omicron LuxX+是LuxX系列的增强版半导体激光器，单模输出功率最高达500mW，保持同样紧凑尺寸，具备高稳定CW运行、快速模拟调制和电子快门功能，集成RS-232和USB接口，适用于生物技术和显微镜应用。
  manufacturer: Omicron
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Omicron LuxX+ 增强型半导体激光器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 375-830nm
    输出功率: 最高500mW单模
    调制: '>150kHz全开关'
    光束直径: ~1mm
    尺寸: 40×40×100mm
    接口: RS-232/USB 2.0
    老化补偿: AAC自动
    品牌: Omicron
