  name: Omicron LedHUB LED Light Engine
  description: LedHUB是Omicron-Laserage生产的多通道LED光源系统，专为荧光显微镜、光遗传学、钙成像、光刺激和工业检测设计。模块化设计使其成为灵活的照明解决方案。
  manufacturer: Omicron
  tags: &id001
  - 仪用光源
  category: *id001
  model:
    name: Omicron LedHUB LED Light Engine
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    模块化设计: 支持4-8个LED通道，独立控制
    波长范围: 255-940nm (取决于LED模块)
    快速切换: 微秒级波长切换
    独立通道控制: 各LED通道独立调制强度和时序
    控制方式: TTL/模拟输入，外部触发
    输出: 光纤耦合(液体光导或光纤)
    品牌: Omicron
  cover: Omicron LedHUB LED Light Engine.webp
