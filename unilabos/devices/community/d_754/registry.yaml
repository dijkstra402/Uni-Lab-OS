  name: Hamamatsu C10600 FESCA-200 Streak Camera
  description: Hamamatsu C10600 FESCA-200飞秒条纹相机，用于超快光谱学、荧光寿命测量、激光诊断、等离子体物理。已被C16910系列替代，后者融合了Hamamatsu
    40年研究经验。
  manufacturer: Hamamatsu
  tags: &id001
  - 工业与科学相机
  category: *id001
  model:
    name: Hamamatsu C10600 FESCA-200 Streak Camera
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    型号: C10600 (FESCA-200)
    时间分辨率: ~200fs (最快扫描速度)
    扫描速度范围: 皮秒至毫秒
    探测器: 条纹管+荧光屏
    光阴极: S-20/S-25等可选
    光谱响应: UV至近红外
    读出: CCD/科学相机
    触发: 单次/同步扫描
    注意: 已停产，替代型号C16910
    品牌: Hamamatsu
