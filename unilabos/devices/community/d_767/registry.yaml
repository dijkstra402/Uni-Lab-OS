  name: Princeton Instruments SpectraPro SP-2300i Spectrograph
  description: SpectraPro SP-2300i是Princeton Instruments的中焦距成像光谱仪，300mm焦距兼顾分辨率和通量。广泛用于拉曼、光致发光、荧光光谱、吸收/发射光谱和等离子体诊断。
  manufacturer: Princeton Instruments
  tags: &id001
  - 光栅摄谱仪
  category: *id001
  model:
    name: Princeton Instruments SpectraPro SP-2300i Spectrograph
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    焦距: 300mm
    光圈比: f/4.0
    光学设计: Czerny-Turner成像光谱仪
    光栅转塔: 三光栅(150/300/600/1200/1800 g/mm可选)
    波长范围: 185nm至1400nm+ (取决于光栅和探测器)
    波长精度: +-0.2nm
    波长重复性: +-0.05nm
    软件: LightField
    品牌: Princeton Instruments
