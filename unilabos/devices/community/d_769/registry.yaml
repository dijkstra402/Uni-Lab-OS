    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    焦距: 750mm
    光圈比: f/9.7
    光学设计: Czerny-Turner成像光谱仪
    光栅转塔: 三光栅
    波长范围: UV至近红外
    分辨率: 亚纳米级
    波长精度: +-0.2nm
    波长重复性: +-0.05nm
    软件: LightField
