  name: Princeton Instruments SpectraPro SP-2750i Spectrograph
  description: SpectraPro SP-2750i是Princeton Instruments SpectraPro系列的最高端型号，750mm焦距提供最高光谱分辨率。配备ResXtreme技术，专为高要求的拉曼、光致发光和荧光光谱学应用。
