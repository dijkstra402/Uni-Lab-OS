  name: Newport ESP301 Motion Controller/Driver, 3-Axis, USB, RS232
  description: Newport ESP301是3轴运动控制器/驱动器，继承ESP300，提供USB接口和扩展前面板功能。驱动和控制最多3轴运动，支持DC和2相步进电机(每轴最大3A)。已于2020年停产，推荐替代型号ESP302-3N。
  manufacturer: Newport
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Newport ESP301 Motion Controller/Driver, 3-Axis, USB, RS232
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: '3'
    驱动类型: 2相/4相步进电机和有刷直流电机
    接口: USB, RS-232
    命令集: 100+ ASCII命令
    控制算法: 数字PID伺服，速度和加速度前馈
    电机控制: 16位DAC, 5MHz最大编码器输入, 0.4ms更新率
    补偿: 线性误差和反向间隙补偿
    轮廓: 2D轮廓, 梯形/S曲线速度轮廓
    运动: 同步点对点, 3D线性和2D圆弧插值, 主从, 电子齿轮
    面板: 按键和80字符LCD
    编程: 最多99个程序/64kB非易失存储
    尺寸: 76.2x429.5x320mm
    重量: 6kg
    电源: 115/230V, 50/60Hz
    状态: 2020年9月停产，替代型号ESP302-3N
    品牌: Newport
