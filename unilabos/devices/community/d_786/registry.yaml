  name: NI PCIe-6363 X系列多功能数据采集卡
  description: NI PCIe-6363是X系列旗舰多功能数据采集卡，提供32路16位模拟输入、4路模拟输出、48路数字I/O和4个计数器，支持自校准和NI-STC3高级时序功能，兼容LabVIEW和NI-DAQmx多线程驱动。
  manufacturer: National Instruments
  tags: &id001
  - 数据采集与记录仪
  category: *id001
  model:
    name: NI PCIe-6363 X系列多功能数据采集卡
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    模拟输入: 32路(16bit/2MS/s单通道/1MS/s多通道)
    模拟输出: 4路(16bit/2.86MS/s)
    数字I/O: 48路(32路硬件定时10MHz)
    计数器: 4个32bit
    总线: PCIe
    自校准: 2年周期
    品牌: National Instruments
