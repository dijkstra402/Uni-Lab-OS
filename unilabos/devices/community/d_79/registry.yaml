  name: Universal Robots UR3e 协作机器人
  description: Universal Robots UR3e是e系列升级版紧凑型协作机器人，相比UR3显著提升了精度(±0.03mm)和安全性。内置工具法兰力/扭矩传感器实现精密力控制和高灵敏碰撞检测。IP54防护等级提升了环境适应性。全新控制器架构提供更强的计算性能，500mm工作半径和3kg载荷特别适合实验室自动化、精密装配和台面级操作任务。PolyScope
    5编程环境增强了脚本功能和第三方设备集成能力。
  manufacturer: Universal Robots
  tags: &id001
  - 转运与协作机器人
  category: *id001
  model:
    name: Universal Robots UR3e 协作机器人
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    有效载荷: 3kg
    工作半径: 500mm
    自重: 11.2kg
    重复精度: ±0.03mm
    自由度: 6轴
    关节范围: ±360°
    工具速度: 最高1m/s
    功耗: 约100W
    底座直径: 128mm
    防护等级: IP54
    通信: TCP/IP/Modbus/EtherNet/IP
    品牌: Universal Robots
