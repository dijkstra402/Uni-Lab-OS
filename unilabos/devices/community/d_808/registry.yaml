  name: AMI Model 430 磁铁电源编程器
  description: AMI Model 430是美国磁学公司的数字化磁铁电源编程器，以0.1 mA步进精度控制超导磁铁系统，支持多轴磁铁系统控制实现虚拟磁场旋转，具备失超检测保护功能、持续电流开关控制和液氦液位监测，可选磁通门高稳定度系统将精度提升十倍以上。
  manufacturer: American Magnetics
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: AMI Model 430 磁铁电源编程器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    电流编程精度: 0.1 mA步进
    标准四象限系统: 5~250 A
    双极电流: 100~500 A
    持续开关加热电流: 0~100 mA
    通信接口: 以太网/RS-232
    高稳定度选件: 磁通门
    品牌: American Magnetics
