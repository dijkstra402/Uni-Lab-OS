  name: Anritsu MG3692C 微波信号发生器
  description: Anritsu MG3692C是MG3690C系列微波信号发生器，频率覆盖2至20 GHz，提供+23 dBm高输出功率，无需外部放大即可简化测试配置，具备超低相位噪声和快速频率切换特性，支持AM/FM/PM全套调制功能，适用于高频系统研发、微波器件测试和雷达信号模拟。
