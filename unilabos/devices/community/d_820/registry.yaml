  name: Danfysik System 8500 电流稳定高性能电源
  description: Danfysik System 8500是电流稳定高性能电源系列，包含Model 854线性调节型（稳定性<0.2 ppm）、855可控硅型（100
    ppm，可达20000 A）和859开关模式型（10 ppm，真四象限运行），专为加速器磁铁应用定制设计，广泛服务于科研和医疗加速器领域。
  manufacturer: Danfysik
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: Danfysik System 8500 电流稳定高性能电源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    电流范围: 40~20000 A
    电压: 最高2000 V
    功率: 1~1000 kW
    稳定性: 2~100 ppm
    型号: 854(线性)/855(可控硅)/859(开关)
    通信: RS232/RS422/GPIB可选
    品牌: Danfysik
