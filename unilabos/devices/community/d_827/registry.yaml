  name: HP 3437A 系统电压表
  description: HP 3437A是微处理器控制的3½位高速系统电压表，采用逐次逼近型ADC和采样保持电路，最高可达5700采样/秒，1V阶跃输入建立时间仅1.5微秒，支持触发延迟和突发读数模式，输出格式可选ASCII或二进制，专为高速系统测量应用设计。
  manufacturer: Keysight
  tags: &id001
  - 电表与万用表
  category: *id001
  model:
    name: HP 3437A 系统电压表
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    分辨率: 3½位
    输入量程: ±100 mV/±1 V/±10 V
    采样速率: 最高5700采样/秒
    精度: 0.03%+2字(1V量程)
    建立时间: 1.5 μs
    触发延迟: 100 ns~1 s
    接口: HP-IB(GPIB)
    品牌: Keysight
