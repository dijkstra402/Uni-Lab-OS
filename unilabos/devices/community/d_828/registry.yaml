  name: HP 3478A 5½位数字万用表
  description: HP 3478A是低成本全功能系统数字万用表，提供3½至5½位可选分辨率和5种自动量程测量功能，5½位模式下可达100 nV直流分辨率，真有效值交流测量带宽300
    kHz，支持电子校准无需开盖调整，具备前后面板输入切换和HP-IB远程控制功能。
  manufacturer: Keysight
  tags: &id001
  - 电表与万用表
  category: *id001
  model:
    name: HP 3478A 5½位数字万用表
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    分辨率: 3½~5½位可选
    功能: DCV/真有效值ACV/2线4线电阻/DCI/ACI
    最高分辨率: 100 nV(DC)
    读取速度: 最高90读数/秒
    ACV带宽: 300 kHz
    接口: HP-IB(GPIB)
    品牌: Keysight
