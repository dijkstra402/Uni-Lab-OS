  name: HP 8753E RF矢量网络分析仪
  description: HP 8753E是RF矢量网络分析仪，频率范围30 kHz至3或6 GHz（选件006），集成S参数测试组件支持完整正反向测量，动态范围达110
    dB，测量和数据传输速度比前代提升7倍，支持同时显示四个S参数，适用于滤波器、双工器、放大器等有源和无源RF器件表征。
  manufacturer: Keysight
