  name: HP 11713A 衰减器/开关驱动器
  description: HP 11713A是GPIB控制的衰减器/开关驱动器，可同时驱动两个可编程衰减器和两个机电开关，最多控制10个开关或衰减器段，内置24V电源带短路保护，切换时间小于10毫秒，前面板提供状态监测，配备两根插入式驱动电缆，是RF自动测试系统的标准配件。
  manufacturer: Keysight
  tags: &id001
  - 射频与微波测试设备
  category: *id001
  model:
    name: HP 11713A 衰减器/开关驱动器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    驱动通道: 最多10个开关/衰减器段
    驱动电压: 24 V DC
    电流限制: 1.3 A峰值/0.65 A稳态
    切换时间: <10 ms
    兼容衰减器: 8494/5/6/7系列
    兼容开关: 8761/8762/8765系列
    接口: GPIB
    品牌: Keysight
