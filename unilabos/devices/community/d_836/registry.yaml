  name: HP 6634A 系统直流电源
  description: HP 6634A是6630A系列100W单输出系统直流电源，输出0-100V/0-1A，采用串联线性调节，具备可编程过压保护（SCR限幅）和过流保护，支持电流吸收和远端感应，后面板Fast/Normal模式开关可在响应速度和低纹波间切换，配备完整GPIB可编程控制和软件校准。
