  name: ILX Lightwave LDP-3811 脉冲激光二极管驱动器
  description: ILX Lightwave LDP-3811是微处理器控制的精密脉冲激光二极管驱动器，提供双量程200/500 mA输出，支持CW和脉冲两种工作模式，脉冲上升时间小于25
    ns，占空比可调0.01%至100%，内置完善的激光二极管保护电路，包括电流限制和输出短路保护，适用于低功率激光二极管测试。
  manufacturer: Newport
