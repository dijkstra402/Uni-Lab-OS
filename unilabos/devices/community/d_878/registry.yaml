  name: XRV系列工业X射线发生器
  description: 紧凑型高性能X射线发生器，功率范围1.8kW至6.0kW，电压范围160kV至450kV，可选负极、正极或双极配置。采用有源功率因数校正、专有逆变器拓扑实现高效率、固态封装高压部分、基于DSP的控制。包含双直流灯丝电源和发射电流调节、电弧检测/熄灭及全面诊断功能
