  name: SG380系列射频信号发生器
  description: 采用有理逼近频率合成（RAFS）架构的射频信号发生器，提供超高频率分辨率和优异的相位噪声性能。标准型号生成DC至2.025GHz（SG382）、4.05GHz（SG384）或6.075GHz（SG386）的正弦波。具有多种调制能力，包括AM、FM、相位调制、脉冲调制和扫描功能
