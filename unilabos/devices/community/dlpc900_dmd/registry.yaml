  name: Texas Instruments DLPC900 数字微镜设备控制器
  description: 可扩展DMD控制器，用于高速光图案生成，支持3D扫描、3D打印、光谱分析等工业应用，DLP9000需双DLPC900
  manufacturer: Texas Instruments
  icon: dlpc900_dmd.webp
  tags: &id001
  - 运动控制系统
  category: *id001
  device_params:
    内存: 128MB DRAM
    封装: BGA-516(ZPC)
    支持DMD: DLP6500/DLP670S/DLP500YX/DLP9000
    1-bit图案率: 最高9523Hz
    8-bit灰度图案率: 最高1031Hz
    预存图案: 最多400-1024个1-bit图案
    数据时钟: 400MHz
    吞吐量: 38Gbps
    波长范围: 400-700nm
    品牌: Texas Instruments
  model:
    name: Texas Instruments DLPC900 数字微镜设备控制器
    type: device
  scene:
    domain: Biology
    scene_name: Cell Analysis
    step: High-Content Imaging
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        vendor_id:
          default: null
          type: integer
        product_id:
          default: null
          type: integer
        debug:
          default: null
          type: boolean
        firmware_pattern_info:
          default: null
          type: string
        presets:
          default: null
          type: string
        config_file:
          default: null
          type: string
        firmware_patterns:
          default: null
          type: string
        initialize:
          default: null
          type: boolean
        dmd_index:
          default: null
          type: integer
        hid_path:
          default: null
          type: string
        platform:
          default: null
          type: string
