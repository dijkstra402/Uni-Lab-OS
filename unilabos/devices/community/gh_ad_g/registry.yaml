  name: A&D G系列
  description: A&D GX/GF系列精密电子天平，采用专利Super Hybrid Sensor技术，响应时间低至1秒。称量范围220g至32.2kg，可读性0.001g至0.1g。GX型内置电动校准砝码，GF型外部校准。RS-232C和USB双向通信，支持GLP/GMP/ISO合规数据输出，IP65防护等级（M系列），用于实验室称量和质量控制。
