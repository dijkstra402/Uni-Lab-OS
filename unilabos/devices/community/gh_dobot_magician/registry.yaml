    Power In: 12V / 6.5A DC
    Consumption: 78W Max
    Working Temperature: -10° - 60° C
    Axis: Range
    Joint 1 base: -120° ~+120°
    Joint 2 rear arm: -5°~+90°
    Joint 3 forearm: -15°~+90°
    Joint 4 rotation servo: -140°~+140°
    Net Weight: 3.4 KG
    Gross weight ( Standard Version): 7.2 KG
    Gross weight ( Education Version): 8.0 KG
    品牌: Dobot
  model:
