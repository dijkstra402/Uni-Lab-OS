  name: 3216 IGES file
  description: Eurotherm 3216 1/16 DIN温度控制器（48×48mm），支持热电偶、RTD/Pt100和线性输入，精度±0.25%。PID自整定，可选升温/保温编程，继电器/SSR/模拟量输出。双四位LED显示，Modbus
    RTU通讯，传感器断线检测和手动/自动无扰切换。适用于炉窑、包装机械和实验室设备温控。
