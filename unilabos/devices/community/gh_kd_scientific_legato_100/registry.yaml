    source: https://github.com/yaq-project/yaqd-kds
  name: Legato® 100 Syringe Pump
  description: 仅注射单个注射泵。可容纳 0.5 µl 至 60 ml 的注射器。用户可定义流速以及可选择的目标体积或时间值来控制总输注体积。
  manufacturer: KD Scientific
  icon: Syringe-Pumps-by-KD-Scientific-newLogo.jpg
  tags: &id001
  - 注射泵
  category: *id001
  device_params:
    Accuracy: ±0.5%
    Syringes (Min/Max): 0.5 µl to 60ml
    Flow Rate: 'Minimum (0.5 µl syringe): 1.28 pl/min Maximum (10ml syringe): 25.99
      ml/min Maximum (60ml syringe): 88.28 ml/min'
    Display: 4.3 WQVGA TFT Color Display with Touchpad
    Non-Volatile Memory: Stores all Settings
    Connectors: RS485 - IEEE-1394 6 pos USB - Type B I/O & TTL - 15 pin D-Sub Connector
    Linear Force (Max): 13.6 kg (30 lb) @ 100% Force Selection
    Drive Motor: 0.9 Stepper Motor
    品牌: KD Scientific
  model:
    name: Legato® 100 Syringe Pump
    type: device
  scene:
    domain: Chemistry
    scene_name: Fluid Control
    step: Dispensing
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        name:
          default: null
          type: string
        config:
          default: null
          type: string
        config_filepath:
          default: null
          type: string
