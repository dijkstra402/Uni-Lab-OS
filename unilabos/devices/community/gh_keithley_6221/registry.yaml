  name: Keithley 6221
  description: Keithley 6221高精度交直流电流源，直流电流范围100fA至105mA，交流频率1mHz至101.8kHz。输出顺从电压105V，最低量程分辨率100fA。配合2182A纳伏表可实现Delta模式、脉冲Delta及微分电导测量。三同轴输出，支持GPIB、RS-232及以太网接口，用于霍尔效应测量、超导研究和纳米器件表征。
