  name: Keithley 6517B
  description: Keithley 6517B静电计/高阻表，集成电压、电流、电阻和电荷四种测量。电流范围1fA至20mA，输入阻抗超200TΩ，电阻测量可达10^16Ω。内置±1kV可编程电压源，支持交替极性电阻测量法。最高425读数/秒，GPIB和RS-232接口，适用于高阻材料表征、绝缘电阻测试及半导体漏电流测量。
