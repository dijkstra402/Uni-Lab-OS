    source: https://github.com/EmpaEconversion/aurora-neware
  name: Neware BTS 8.0系列
  description: Neware BTS 8.0新一代电池测试系统，基于BTS 8.0升级版控制软件平台，具备更优的界面设计和数据管理能力。支持锂离子、磷酸铁锂、钠离子等多种电池类型的高精度充放电测试。高采样频率和快速脉冲测试能力，模块化架构支持大规模通道扩展。集成环境箱联动和集中式数据库管理，适用于电池研发、化成分容和循环寿命测试。
  manufacturer: Neware
  icon: 76SHPfje.png
  tags: &id001
  - 电池测试设备
  category: *id001
  device_params:
    Voltage: 0-5V/channel (up to 60V+)
    Current: mA to 300A
    Channels: 8-16/unit
    Accuracy: ±0.05% FSR
    Modes: CC, CV, CP, CR
    Functions: cycle, pulse, DCIR
    Software: BTS 8.0
    Communication: Ethernet
    品牌: Neware
  model:
    name: Neware BTS 8.0系列
    type: device
  scene:
    domain: Chemistry
    scene_name: Battery Testing
    step: Cycling
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        ip:
          default: null
          type: string
        port:
          default: null
          type: integer
