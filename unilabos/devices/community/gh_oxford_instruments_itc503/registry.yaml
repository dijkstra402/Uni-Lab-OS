  name: Oxford Instruments ITC503
  description: Oxford Instruments ITC503低温温度控制器，温控范围约0.3K至500K，3个传感器输入通道，兼容铑铁电阻、Cernox、Pt100等多种温度计。PID控制并自整定，加热器最高80W，可选配针阀控制氦气流量。GPIB和RS-232通信，控温精度达毫开尔文级别，适用于低温恒温器和超导磁体系统。
  manufacturer: Oxford Instruments
  icon: 2026_03_17_QD-Oxford_partnership_with_FSU_300x200.jpg
  tags: &id001
  - 冷热源
  category: *id001
  device_params:
    Type: Temperature controller
    Inputs: '3'
    Control: PID auto-tune
    Heater output: 80W
    Sensors: Pt100, thermocouple, Cernox
    Range: 0.3K-500K
    Interface: GPIB, RS-232
    Gas flow control: built-in
    品牌: Oxford Instruments
  model:
