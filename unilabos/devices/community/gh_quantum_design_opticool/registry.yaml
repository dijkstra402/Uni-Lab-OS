    source: https://github.com/microsoft/Qcodes
  name: Quantum Design OptiCool
  description: 无冷冻剂 OptiCool 平台利用了 Quantum Design 在工程和制造自动化温度和磁场控制系统方面 40 多年的经验。 OptiCool
    平台具有全自动冷却和 350 K 至 1.7 K 范围内的无缝温度控制，还具有对光学测量至关重要的低振动和稳定性。 OptiCool 的创新样品盒技术和 89
    毫米直径 x 84 毫米高的大样品体积为实验设计提供了令人兴奋的可能性，使研究人员能够创建和构建用于光学测量的定制设置。系统具有顶部窗口和多个侧窗选项，可定制您的光学访问，包括底部窗口选项。标准
    OptiCool 具有 7 特斯拉 spli
