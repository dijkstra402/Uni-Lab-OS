  name: CS580 Current Source
  description: Stanford Research Systems CS580超低噪声电压控制电流源，输出范围100fA至100mA，顺从电压可调至±50V，四象限源/漏操作。采用线性电源和CPU时钟停止架构消除数字干扰，带宽最高150kHz，谐波失真0.01%。三同轴输出和主动驱动保护端，光纤隔离远程控制接口，用于半导体输运测量和超导研究。
  manufacturer: Stanford Research Systems
  icon: SRS%20Navigation%20Background.png
