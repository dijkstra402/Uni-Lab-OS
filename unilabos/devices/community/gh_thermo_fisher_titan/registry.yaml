  icon: Krios-5-instrument-1024.gif
  tags: &id001
  - 透射电子显微镜
  category: *id001
  device_params:
    Accelerating voltage: 300 kV
    Information limit: ~0.1 nm
    Resolution: sub-2 Å
    Electron source: X-FEG/C-FEG
    Energy filter: Selectris/Selectris X
    Detector: Falcon 4i
    Autoloader: 12 grids
    Software: EPU
    品牌: Thermo Fisher
  model:
    name: Cryo TEM | Krios Cryo TEM | Cryo EM Microscope
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: TEM Imaging
  version: 1.0.0
  resource_type: device
