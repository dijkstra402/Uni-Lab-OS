  name: Cryo TEM | Krios Cryo TEM | Cryo EM Microscope
  description: Thermo Fisher Krios G4是顶级冷冻透射电子显微镜(Cryo-TEM)，工作电压300kV，配备冷场发射电子枪和直接电子探测器，支持自动化数据采集。
