  name: 3325A Synthesizer/Function Generator [Obsolete]
  description: HP 3325A合成器/函数信号发生器，频率范围1μHz至21MHz（正弦波），采用直接数字合成架构，频率分辨率达1μHz，幅度范围1mV至10Vpp（50Ω负载）。内置线性/对数扫频、AM/FM/相位调制功能，配备HP-IB（IEEE-488/GPIB）接口，适用于实验室校准、通信测试及自动化测试系统。已停产。
