  name: 85645A 300 kHz to 26.5 GHz tracking source [Obsolete]
  description: HP 85645A跟踪信号源，频率覆盖300kHz至26.5GHz，配合HP 8560系列频谱分析仪实现标量网络分析。输出功率约-10dBm至+1dBm，功率平坦度±1.5dB，通过锁相跟踪频谱分析仪本振实现同步扫描。支持归一化校准以消除系统频响误差，适用于滤波器特性测试、放大器增益测量和电缆损耗分析。已停产。
