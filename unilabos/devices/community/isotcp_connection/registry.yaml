        port:
          type: integer
          default: 102
        local_tsap:
          type: integer
          default: 256
        remote_tsap:
          type: integer
          default: 258
        tpdu_size:
          type: string
          default: 10
  device_params:
    可控参数: data、timeout
    操作数: 5
  manufacturer: Open Standard
  model:
    name: Generic Isotcp Connection
    type: device
  name: Open Standard TPDU sizes per ISO 8073 / RFC 905
  tags:
  - 实验执行&合成设备
  resource_type: device
  icon: isotcp_connection.webp
  scene:
