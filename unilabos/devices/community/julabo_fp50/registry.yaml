  name: Discontinued products FP50-HL
  description: JULABO FP50高性能制冷加热循环器，温度范围宽达-50°C至+200°C，温度稳定性±0.01°C，制冷能力强劲，适用于反应釜温控和材料测试等精密应用。该型号已停产。
  manufacturer: Julabo
  icon: logo_og.png
  tags: &id001
  - 高低温循环装置
  category: *id001
  device_params:
    温度范围: -50°C~+200°C
    温度稳定性: ±0.01°C
    加热功率: 2kW
    制冷功率: 0.7kW(-20°C)/0.4kW(-30°C)/0.1kW(-40°C)
    泵流量: 最高~22L/min
    泵压力: 0.5-0.7bar
    浴槽容积: ~8-15L
    接口: RS232
    品牌: Julabo
  model:
    name: Discontinued products FP50-HL
    type: device
  scene:
    domain: Laboratory
    scene_name: Environmental Control
    step: Temperature Control
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        intf:
          default: null
          type: string
        conf:
          default: null
          type: string
