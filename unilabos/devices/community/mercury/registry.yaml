  name: Oxford Instruments Mercury iTC 低温温度控制器
  description: Oxford Instruments Mercury iTC 是低温环境控制器，温度范围<1K至>800K，支持多种低温传感器，以太网/USB远程控制。
  manufacturer: Oxford Instruments
  icon: mercury.webp
  tags: &id001
  - 低温温度控制器
  category: *id001
  device_params:
    温度范围: <1K至>800K(依传感器)
    传感器: Cernox/RuO2/铂电阻/热电偶
    加热器: 多路输出
    PID: 自整定
    功能: 温度扫描/斜坡编程
    接口: Ethernet(TCP/IP)/USB/ISOBUS
    控制: 触摸屏
    兼容: MercuryiPS磁体电源
    品牌: Oxford Instruments
  model:
    name: Oxford Instruments Mercury iTC 低温温度控制器
    type: device
  scene:
    domain: Chemistry
    scene_name: Synthesis
    step: Heating
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        intf:
          default: null
          type: string
        conf:
          default: null
          type: string
