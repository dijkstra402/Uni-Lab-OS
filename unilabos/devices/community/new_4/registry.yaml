  name: MBraun LABmaster 惰性气体手套箱工作站
  description: MBraun LABmaster SP/DP是MBraun公司旗舰级惰性气体手套箱工作站。采用不锈钢（1.4301/304型）箱体，耐刮擦聚碳酸酯观察窗。自动可再生气体净化系统持续维持O2<1ppm和H2O<1ppm的超高纯度水平，可选单柱（SP）或双柱（DP）净化器实现24/7不间断运行。大型主过渡舱（内径390mm×长600mm），泄漏率<10⁻⁵mbar·l/s。PLC彩色触摸屏实时监控O2/H2O浓度及气压，自动气压调控±15mbar，脚踏开关操作。配备4个DN40
    KF穿透法兰、0.3μm H13粉尘过滤器。模块化设计支持多箱体集群扩展，可选配真空烘箱、溶剂纯化系统、显微镜集成等。广泛应用于锂电池、有机电子、空气敏感合成等领域。
  manufacturer: MBRAUN
  tags: &id001
  - 实验台与工作台
  category: *id001
  model:
    name: MBraun LABmaster 惰性气体手套箱工作站
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    O2含量: <1ppm
    H2O含量: <1ppm
    泄漏率: <0.05vol%/h(Class1)
    净化容量: O2去除30L/H2O去除1300G
    气体循环: 84m³/h
    工作气体: Ar/N₂
    箱体材质: 不锈钢1.4301
    过渡舱: 内径390mm×600mm
    控制: PLC彩色触摸屏
    粉尘过滤: 0.3μm H13
    品牌: MBRAUN
