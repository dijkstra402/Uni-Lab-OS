  name: G2301 Gas Concentration Analyzer
  description: Picarro基于腔衰荡光谱(CRDS)技术的气体分析仪，ppb级灵敏度，低漂移无需频繁校准。此为启动器(Launcher)应用。
  manufacturer: Picarro, Inc.
  icon: pica_launcher_app.webp
  tags: &id001
  - 气相分子吸收光谱仪
  category: *id001
  device_params:
    技术: CRDS腔衰荡光谱
    代表型号: G2301(CO2/CH4/H2O), G2401(CO2/CH4/CO/H2O)
    CO2精度: <50ppb(5分钟平均)
    CH4精度: <1ppb
    CO精度: <1.5ppb
    灵敏度: ppb-ppt级
    特性: 低漂移,几乎无需常规校准
    测量: 连续实时
    品牌: Picarro, Inc.
  model:
    name: G2301 Gas Concentration Analyzer
    type: device
  scene:
    domain: Chemistry
    scene_name: Analysis
    step: GC-MS
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        root:
          default: null
          type: string
