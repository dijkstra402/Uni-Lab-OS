  init_param_schema:
    config:
      type: object
      properties:
        port:
          type: string
          default: null
        sn:
          type: string
          default: null
  device_params:
    支持操作数: '8'
    读取操作: get_stages、get_stages
    设备属性: serial_number、channel_count
    控制能力: 多通道、时间
    通信接口: 串口(RS-232)
  manufacturer: Open Standard
  model:
    name: Communication Port 通用通信端口
    type: device
  name: Communication Port
  tags:
