port:
  class:
    module: unilabos.devices.serial.port:Port
    type: python
    status_types:
      serial_number: String
      channel_count: String
      stages: String
    action_value_mappings:
      auto-send_message:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: send_message
          type: object
          properties:
            goal:
              type: object
              properties:
                msg:
                  type: string
        goal_default: {}
        handles: {}
      auto-fileno:
