        goal_default: {}
        handles: {}
      auto-recv_message:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: recv_message
          type: object
          properties:
            goal:
              type: object
              properties:
                block:
                  type: string
                timeout:
                  type: string
        goal_default:
          block: true
        handles: {}
      auto-run:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
