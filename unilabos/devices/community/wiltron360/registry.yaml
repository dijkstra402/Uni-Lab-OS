  name: Vector Network Analyzer
  description: Wiltron/Anritsu 360B矢量网络分析仪，全功能双端口设计，支持完整S参数测量和12项误差校正，广泛用于航空航天和微波元件测试。
  manufacturer: Anritsu
  icon: wiltron360.webp
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  device_params:
    频率范围: 10MHz-40GHz(360SS67可达65GHz)
    动态范围: '>90dB'
    测量参数: S11/S21/S12/S22全双端口
    误差校正: 12项全矢量校正
    显示: 幅度/相位/Smith圆图/极坐标
    时域: 支持
    接口: GPIB(IEEE-488)
    连接器: Type-N/3.5mm/2.4mm/K
    品牌: Anritsu
  model:
    name: Vector Network Analyzer
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: Dielectric Measurement
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        inst:
          default: null
          type: string
