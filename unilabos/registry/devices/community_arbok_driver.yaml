          title: measurements
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-get_idn:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
