              type: object
              properties:
                cmd:
                  type: string
        goal_default: {}
        handles: {}
      auto-create_measurement_from_experiment:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: create_measurement_from_experiment
          type: object
          properties:
            goal:
              type: object
              properties:
                experiment:
                  type: string
                qc_measurement_name:
                  type: string
                name:
                  type: string
        goal_default:
          name: measurement
        handles: {}
      auto-check_db_engine_and_bucket_connected:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: check_db_engine_and_bucket_connected
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-measurements:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
