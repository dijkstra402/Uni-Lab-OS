          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-get_run_from_id:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: get_run_from_id
          type: object
          properties:
            goal:
              type: object
              properties:
                run_id:
                  type: number
        goal_default: {}
        handles: {}
      auto-get_data_from_id:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
