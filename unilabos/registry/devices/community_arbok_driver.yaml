              type: object
              properties:
                qua_program:
                  type: string
                duration:
                  type: integer
                nr_controllers:
                  type: integer
                plot:
                  type: string
        goal_default:
          nr_controllers: 1
          plot: true
        handles: {}
      auto-ask_raw:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
