          title: get_data_from_id
          type: object
          properties:
            goal:
              type: object
              properties:
                run_id:
                  type: number
        goal_default: {}
        handles: {}
  description: Arbok Quantum Readout Driver是由QuTech生产的表征设备，主要功能包括写入数据、测量、设备连接、运行。支持Signal,
    Slot, ask raw等操作。
  category:
  - 表征设备
  init_param_schema:
    config:
      type: object
      properties:
        name:
          type: string
          default: null
        device:
          type: string
          default: null
  device_params:
    功能: 参数配置、数据采集
    可控参数: add_config、cmd、持续时间、experiment、host_ip、name、new_measurement、nr_controllers
    操作数: 15
  manufacturer: QuTech
  model:
    name: Generic Arbok Quantum Readout Driver
    type: device
  name: Arbok Quantum Readout
  tags:
  - 表征设备
  resource_type: device
  icon: arbok_driver.webp
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: Analysis
  version: 1.0.0
