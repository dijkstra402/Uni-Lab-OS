arbok_driver:
  class:
    module: unilabos.devices.community.arbok_driver.driver:ArbokDriver
    type: python
    status_types:
      measurements: String
      idn: String
      run_from_id: String
      data_from_id: String
    action_value_mappings:
      auto-reset_measurements:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: reset_measurements
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-connect_opx:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: connect_opx
          type: object
          properties:
            goal:
              type: object
              properties:
                host_ip:
                  type: string
                qm_config:
                  type: object
                reconnect:
                  type: boolean
        goal_default:
          reconnect: false
        handles: {}
      auto-reconnect_opx:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: reconnect_opx
          type: object
          properties:
            goal:
              type: object
              properties:
                host_ip:
                  type: string
                qm_config:
                  type: object
        goal_default: {}
        handles: {}
      auto-add_measurement:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: add_measurement
          type: object
          properties:
            goal:
              type: object
              properties:
                new_measurement:
                  type: string
        goal_default: {}
        handles: {}
      auto-run:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: run
          type: object
          properties:
            goal:
              type: object
              properties:
                qua_program:
                  type: string
        goal_default: {}
        handles: {}
      auto-print_qua_program_to_file:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: print_qua_program_to_file
          type: object
          properties:
            goal:
              type: object
              properties:
