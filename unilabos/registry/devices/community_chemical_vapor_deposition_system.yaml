community_1075:
  class:
    module: community_drivers.1075.driver:DeviceDriver
    type: python
  name: Moorfield MiniLab 060 模块化薄膜沉积系统
  description: Moorfield MiniLab 060是由英国Moorfield Nanotechnology公司设计制造的模块化PVD薄膜沉积系统。采用不锈钢前装箱式真空腔室设计（400×400×400mm），配备铰链式前门便于样品装卸。支持四种核心沉积技术：热蒸发（最多4源）、低温有机蒸发（最多4源）、磁控溅射（支持2"/3"/4"靶材，RF/DC/脉冲DC电源）和电子束蒸发（Telemark多坩埚源，3kW/5kW/10kW可选）。基片台可容纳最大11英寸基片，支持加热、冷却、旋转、偏压和Z轴位移。真空系统采用Edwards/Leybold涡轮分子泵组合，极限真空优于5×10⁻⁷mbar。配备Inficon石英晶体监控系统实现原位膜厚监控。工业级PLC控制系统支持全自动工艺流程和数据记录。可选配负载锁、掠射角沉积（GLAD）和手套箱集成。适用于石墨烯、2D材料、半导体等研究领域的薄膜制备。
  manufacturer: Moorfield Nanotechnology
  tags:
  - 化学气相沉积设备
  category:
  - 化学气相沉积设备
  model:
    name: Moorfield MiniLab 060 模块化薄膜沉积系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    真空腔室尺寸: 400×400×400mm
    最大基片尺寸: 11英寸(280mm)直径
    极限真空度: <5×10⁻⁷mbar
    高真空泵: 水冷涡轮分子泵最高400L/s
    前级泵: 旋片泵或干式涡旋泵最高15m³/h
    沉积技术: 热蒸发/低温蒸发/磁控溅射/电子束蒸发
    控制系统: 工业级PLC+7英寸触摸屏
    电源: 230V/50Hz/13A
    冷却水: 18-20°C 3L/min
    尺寸: 1700×590×1180mm
    品牌: Moorfield Nanotechnology
