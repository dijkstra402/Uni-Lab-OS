    Resolution: 0.001K
    A/D: 24-bit
    Sensors: Si diode, Pt RTD, Cernox, RhFe, thermocouple, GaAlAs, Ge RTD, capacitance
    Control: PID with autotuning, zone control (10 zones/output), ramp rate
    Interface: USB, GPIB, Ethernet
    品牌: Lake Shore Cryotronics
  model:
    name: Model 336 cryogenic temperature controller
    type: device
  scene:
    domain: Chemistry
    scene_name: Synthesis
    step: Stirring
  version: 1.0.0
  resource_type: device
