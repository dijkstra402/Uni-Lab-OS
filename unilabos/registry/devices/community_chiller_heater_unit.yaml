  description: 高性能低温温度控制器，4路传感器输入+4路控制输出，兼容主流低温传感器，PID自整定和区间控制，用于低温物理、材料表征、半导体测试和超导研究。在售。
  manufacturer: Lake Shore Cryotronics
  icon: lakeshore336.webp
