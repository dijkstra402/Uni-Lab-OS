community_1081:
  class:
    module: community_drivers.1081.driver:DeviceDriver
    type: python
  name: AutoBASS 纽扣电池自动组装平台
  description: AutoBASS纽扣电池自动组装平台专门针对CR2032型纽扣电池研发。机械臂A通过软硅胶吸盘依次拾取阳极帽、阳极(15mm)、弹簧（自校正内夹持模具）、垫片、隔膜(16mm)、阴极(14mm)和阴极帽，精确放置到组装柱上。电解液通过步进电机驱动的3D打印旋转阀和PTFE管注入，每电池31.4µL（2次×15.7µL）。机械臂B将组装完成的电池翻转送入压接机封装，磁性吸头取出。放置精度实测：阳极120µm、隔膜190µm、阴极70µm方差。容量变异系数3.4%标准差。系统建议在N₂手套箱中使用（避免Ar，防止机器人过热）。支持FINALES自动化模式集成，硬件STL文件和软件代码完全开源。
  manufacturer: Helge Stein Group
  tags:
  - 纽扣电池组装工站
  category:
  - 纽扣电池组装工站
  model:
    name: AutoBASS 纽扣电池自动组装平台
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    电池规格: CR2032
    阳极: 15mm
    隔膜: 16mm
    阴极: 14mm
    电解液: 每电池31.4µL(2次×15.7µL)
    放置精度: 阳极120µm/隔膜190µm/阴极70µm方差
    失败率: ~10%
    容量CV: 3.4%
    环境: N₂手套箱
    品牌: Helge Stein Group
