  name: BioShake iQ
  description: 适用于微孔板和试管的高端恒温摇床 BioShake iQ 高端恒温摇床设计紧凑、时尚，让您只需最少的调整即可执行所有标准混合运行。 BioShake
    iQ 具有出色的性能，可处理生物技术、制药和学术研究领域的广泛应用。通过将混合操作与孵育阶段相结合，可以减少反应过程时间和操作员工作量，并提高许多程序的效率，从而提高产量。
  manufacturer: Q.Instruments (Analytik Jena)
  icon: bio_shake.webp
  tags:
  - 恒温摇床
  category:
  - 恒温摇床
  device_params:
    类型: 微孔板加热振荡器
    厂商: Q.Instruments(现Analytik Jena)
    温度: 室温至+100°C
    振荡: 200-3000rpm
    兼容: 96/384孔板
    接口: USB
    品牌: Q.Instruments (Analytik Jena)
  model:
    name: BioShake iQ
    type: device
  scene:
    domain: Biology
    scene_name: Sample Preparation
    step: Shaking
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        port:
          default: null
          type: string
        timeout:
          default: null
          type: integer
