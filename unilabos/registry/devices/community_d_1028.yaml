  name: Lambda OMNICOLL可编程馏分收集器
  description: Lambda OMNICOLL是微处理器控制的可编程馏分收集器和自动采样器，支持时间和体积两种收集模式。全金属结构耐化学溶剂，9V低压供电确保安全。可容纳多种试管架和微孔板，支持2至64路并行收集。通过RS-232接口可接入PLC或SCADA系统实现全自动化控制。
