  name: Anton Paar MCR 302 模块化紧凑型流变仪
  description: Anton Paar MCR 302是全球最畅销的研究级模块化流变仪，空气轴承配合EC电机技术提供0.01µNm至230mNm的超宽扭矩范围，可测量从低粘度液体到高粘度浆料的完整流变特性。支持旋转和振荡两种测试模式，可测定粘弹性、屈服应力、触变性、蠕变柔量和应力松弛等流变参数。专利TruGap自动间隙补偿、Toolmaster自动识别测量系统和T-Ready温度就绪功能确保测量的准确性和用户友好性。模块化设计支持丰富的温控装置和专用附件。
  manufacturer: Anton Paar
  tags: &id001
  - 旋转流变仪
  category: *id001
  model:
    name: Anton Paar MCR 302 模块化紧凑型流变仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    扭矩范围: 0.01µNm~230mNm
    剪切速率: 10⁻⁵~10⁴ s⁻¹
    频率范围: 10⁻⁷~100Hz
    轴承: 空气轴承
    电机: EC无刷直流
    Peltier温控: -20~200°C
    CTD1000扩展: -100~1000°C
    品牌: Anton Paar
  cover: Anton Paar MCR 302 模块化紧凑型流变仪.webp
