  name: Shimadzu RF-5301PC 荧光分光光度计
  description: Shimadzu RF-5301PC是研究级荧光分光光度计，激发和发射波长范围均为220-900nm。采用150W氙灯光源和全息闪耀光栅单色器，光谱带宽6档可选(1.5-20nm)。具备高信噪比和多种测量模式（波长扫描、时间扫描、定量分析），适用于荧光材料、环境水质和生物样品的荧光分析。
