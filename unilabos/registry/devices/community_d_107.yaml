  name: Binder VDL 115 安全真空干燥箱
  description: Binder VDL 115是一款符合ATEX防爆指令的安全真空干燥箱，专为易燃溶剂干燥设计，防爆等级EX II 2/3/- G IIB
    T3。115L内容积配合直观触屏控制器，可图形化显示压力和温度曲线。程序控制干燥监测功能在过程结束时自动通风，100mbar以下压力控制装置自动激活加热。内置数据记录器支持USB导出开放格式数据，2块铝制膨胀搁架可自由定位。真空接口DN
    16和测量接入口满足外部设备接入需求。
