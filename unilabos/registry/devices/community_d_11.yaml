  name: Thermo Scientific ThermoFlex 循环冷水机
  description: Thermo Scientific ThermoFlex系列循环冷水机专为严苛应用优化设计，制冷能力覆盖900W至24000W(81948BTU/hr)。配备LCD图形显示控制器，操作直观。支持风冷和水冷两种冷凝方式，可选配流量控制、DI纯水滤芯、自动补水和远程温度传感器。低噪音型号在全工况范围内噪声低于58dBA。RS232/RS485数字通信支持远程操作和数据记录。适用于航空航天、分析、生物、化工、医药和科研等领域。
  manufacturer: Thermo Fisher
  tags: &id001
  - 低温循环装置
  category: *id001
  model:
    name: Thermo Scientific ThermoFlex 循环冷水机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    制冷量范围: 900W-24000W(60Hz)
    温度范围: 5°C-90°C
    温度稳定性: ±0.1°C
    泵流量: 最高4.0gpm@60psig(TF2500)
    冷凝方式: 风冷/水冷可选
    低噪音型号: <58dBA
    通信: RS232/RS485
    认证: CE/CSA/Semi S2
    品牌: Thermo Fisher
  cover: Thermo Scientific ThermoFlex 循环冷水机.webp
