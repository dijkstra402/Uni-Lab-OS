  name: A&D GX-K/GF-K 系列精密工业天平
  description: A&D GX-K/GF-K系列是IP65防尘防水精密工业天平，采用革命性Super Hybrid Sensor(SHS)技术，融合磁力恢复和单点平行梁传感器优势，实现同级别最快1.5秒稳定时间。GX-K系列具备电机驱动内部校准和自动自校准(ASC)功能，GF-K系列采用外部校准。大尺寸VFD显示屏在暗光环境下清晰可读，不锈钢秤盘和压铸铝外壳坚固耐用。
  manufacturer: A&D
