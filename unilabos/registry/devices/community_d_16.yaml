  name: ASI MS-2000 XYZ自动化载物台
  description: ASI MS-2000 XYZ自动化载物台采用交叉滚柱导轨、高精度丝杠和零背隙微型齿轮DC伺服电机，提供平滑精确的运动控制。所有轴均采用闭环DC伺服电机配合高分辨率旋转编码器实现精确位置反馈，防止开环系统中常见的位置丢失问题。支持XY操纵杆手动控制，RS-232和USB计算机通信。可选配线性编码器、扩展顶板和自动聚焦功能。
  manufacturer: ASI
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: ASI MS-2000 XYZ自动化载物台
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    XY行程: 120mm×100mm
    XY分辨率(编码器步长): 22nm
    XY重复性: <700nm(RMS)
    XY最大速度: 7mm/s
    最大负载: 5kg
    最高工作温度: 65°C
    驱动: 闭环DC伺服电机/高分辨率旋转编码器
    通信: RS-232/USB
    品牌: ASI
  cover: ASI MS-2000 XYZ自动化载物台.webp
