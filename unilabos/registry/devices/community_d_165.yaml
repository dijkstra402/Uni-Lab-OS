  name: Tescan MIRA/VEGA 扫描电子显微镜
  description: Tescan MIRA和VEGA是两个不同定位的扫描电子显微镜产品线。MIRA4采用Schottky场发射枪，分辨率可达约1nm，适用于先进材料科学、纳米技术和半导体应用。VEGA采用热电子发射(钨丝或LaB6阴极)，分辨率约3nm，是性价比优异的常规分析SEM，广泛用于学术和工业质控。两者均支持多种探测器和分析附件。
  manufacturer: Tescan
