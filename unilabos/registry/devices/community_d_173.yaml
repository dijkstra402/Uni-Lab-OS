  name: Acton/Princeton Instruments SpectraPro 2150i 光谱仪
  description: Acton/Princeton Instruments SpectraPro 2150i是紧凑型150mm焦距Czerny-Turner光谱仪(现归属Teledyne
    Princeton Instruments)。f/4.0光圈比提供高通量，三光栅转塔支持灵活的波长范围选择。多输入/输出端口和计算机控制的波长扫描使其适用于光谱学、拉曼、荧光和等离子体诊断等多种应用。紧凑设计适合空间有限的实验环境。
  manufacturer: Princeton Instruments
