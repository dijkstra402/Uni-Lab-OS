  name: Acton/Princeton Instruments SpectraPro 2300i 光谱仪
  description: Acton/Princeton Instruments SpectraPro 2300i是300mm焦距研究级Czerny-Turner光谱仪(现归属Teledyne
    Princeton Instruments)。相比2150i(150mm)，300mm焦距在使用相同光栅时可提供约两倍的光谱分辨率。f/3.9光圈比确保高通量，三光栅转塔和多端口设计提供最大灵活性。适用于需要更高光谱分辨率的研发和分析应用。
  manufacturer: Princeton Instruments
  tags: &id001
  - 光栅摄谱仪
  category: *id001
  model:
    name: Acton/Princeton Instruments SpectraPro 2300i 光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    焦距: 300mm
    光圈比: f/3.9
    品牌: Princeton Instruments
