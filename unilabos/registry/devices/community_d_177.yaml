  name: Teledyne SSI ReaXus LD Class低死体积双柱塞HPLC泵
  description: Teledyne SSI ReaXus LD Class是一系列低死体积双头正排量柱塞泵，专为分析级HPLC、快速色谱和小规模制备色谱应用设计。采用专利低死体积脉冲阻尼器和先进凸轮技术，实现近乎无脉动的溶剂输送。提供12mL/min、36mL/min和100mL/min三种流速规格，最高工作压力达6000psi。标配集成排气-冲洗阀、脉冲阻尼器和自动柱塞冲洗功能，支持不锈钢、PEEK和Hastelloy三种流路材质。
