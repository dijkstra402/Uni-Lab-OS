  name: Teledyne SSI Next Generation系列HPLC泵
  description: Teledyne SSI Next Generation系列HPLC泵是面向OEM客户的经济可靠泵送平台，提供高性能和极低脉动特性。该系列分为两个级别：LS-Class适用于标准HPLC应用，工作压力可达6000psi(414bar)；HP-Class适用于UHPLC等高压应用，工作压力可达10000psi(690bar)。采用先进的凸轮技术和精密机械设计，在紧凑体积内实现出色的流速精度和重现性，是仪器制造商集成色谱泵送模块的理想选择。
  manufacturer: SSI
