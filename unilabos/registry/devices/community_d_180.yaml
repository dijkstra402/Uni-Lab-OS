  name: Linkam T96通用系统温度控制器
  description: Linkam T96是Linkam最新一代通用系统温度控制器，支持Linkam全系列温控载台。采用PT100铂电阻传感器，温度分辨率优于0.01°C，加热速率最高200°C/min。分为T96-S(加热台系列)和T96-P(Peltier台系列)两种型号。控制器可搭配LinkPad触屏独立操作，也可通过USB连接PC使用LINK/NEXUS软件进行高级控制。支持温度、真空、湿度等多参数编程，提供Windows和Linux
    SDK便于第三方集成。
