  name: Linkam TMS94温度控制器/程序升温仪
  description: Linkam TMS94是Linkam早期经典温度控制器，专为显微镜热分析载台设计，可精确控制加热和冷却过程。支持-196°C至600°C温度范围（取决于连接的载台），加热速率0.01-150°C/min，温度稳定性±0.1°C。提供多段升降温程序编程、RS-232串口通讯和数字温度显示。可配合LNP液氮泵实现低温实验。该控制器已停产，功能由T95和T96系列控制器继承。
  manufacturer: Linkam Scientific
  tags: &id001
