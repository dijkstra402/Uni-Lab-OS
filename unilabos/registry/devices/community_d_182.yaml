  name: Linkam T95系统温度控制器
  description: Linkam T95是Linkam上一代全功能系统温度控制器，不仅提供精密温度控制，还支持精密步进电机驱动、高分辨率力传感器、湿度传感器和气体传感器数据采集。提供三种型号：带LCD触屏的独立控制器、PC接口控制器和Peltier载台专用控制器。支持USB和RS-232通讯，可使用LINK软件进行高级控制和数据记录。兼容Linkam全系列温控载台，该型号已停产，由T96控制器替代。
