  name: Linkam T96热分析温度控制器
  description: Linkam T96热分析配置是T96通用系统控制器面向热分析应用的方案，支持DSC差示扫描量热、热台显微镜等热分析实验。控制器每秒20次多通道数据采样，可同时记录温度、DSC热流、力(0.001N分辨率)、真空压力和湿度等参数。加热速率最高200°C/min，温度分辨率优于0.01°C。通过LINK软件的TASC模块可实现基于表面特征的热分析，适用于相变研究、热稳定性测试和材料表征。
  manufacturer: Linkam Scientific
