  name: Linkam TMS94热分析温度控制器
  description: Linkam TMS94热分析配置是TMS94温度控制器面向热分析显微镜应用的方案。该控制器可精确执行多段升降温程序，支持线性升温、恒温保持和自然冷却模式，温度稳定性±0.1°C。配合LNP液氮冷却系统可实现-196°C低温实验，广泛应用于相变观察、热稳定性评估和晶体生长研究。通过RS-232接口可连接PC进行数据记录和自动化控制。该产品已停产，由T96控制器替代。
  manufacturer: Linkam Scientific
  tags: &id001
