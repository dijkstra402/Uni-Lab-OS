  name: Keithley 236精密源表
  description: Keithley 236是一款全编程精密源表(SMU)，集电压源、电流源、电压表和电流表四种功能于一体。可输出100µV至110V电压和100fA至100mA电流，同时测量电压和电流响应。电流灵敏度达10fA，具备静电计级测量能力。支持线性、对数和脉冲扫描模式，源稳定时间仅500µs，协调源测量周期可达1ms。广泛应用于半导体器件表征、材料电学特性测试等领域。该仪器已停产。
