  name: Keysight B2900系列精密源表
  description: Keysight B2900系列（原Agilent）是紧凑型台式精密源表，可同时源出和测量电压电流。提供±210V宽电压范围和±3A
    DC/±10.5A脉冲大电流输出能力，6.5位分辨率确保10fA最小电流测量精度。支持4象限操作，可作为电压/电流源、电子负载、精密表计、脉冲发生器和任意波形发生器使用。最新B2900C系列采样率达100kSa/s，配备4.3英寸彩色LCD和Roll-View实时滚动显示功能。
  manufacturer: Keysight
