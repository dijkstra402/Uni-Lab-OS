  name: Zaber X-ADR130 线性电机扫描显微镜台
  description: Zaber X-ADR130是X-ADR-AE系列线性电机扫描显微镜台，XY行程130mm×100mm，配备内置控制器和线性编码器。超静音线性电机提供免维护直驱运动，分辨率达1nm，重复性500nm，最大速度750mm/s。支持USB连接和菊花链拓扑，可与其他Zaber设备串联。配备数字I/O用于触发外部系统，兼容X-JOY3操纵杆独立控制。属于Zaber
    Nucleus显微镜平台模块系统。
