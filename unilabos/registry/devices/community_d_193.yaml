  name: BK Precision 178x系列可编程直流电源
  description: BK Precision 178x系列包含1785B、1786B、1787B和1788四个型号的可编程线性直流电源，覆盖18V/5A至72V/1.5A的不同电压电流组合。提供10mV/10mA设定分辨率，负载调整率优于0.01%+3mV，纹波噪声低于1mV
    RMS。支持16组用户可编程预设输出，具有闭盖校准功能。通过RS-232接口可实现PC远程控制，配套PV1785B-1788软件支持恒压、恒流设定和监控。该系列已停产，后续型号为9201B。
  manufacturer: BK Precision
