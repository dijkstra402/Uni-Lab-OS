  name: HP 4142B模块化直流源/监测器
  description: HP 4142B是惠普公司设计的模块化高速精密DC参数测量仪器，专为半导体器件和工艺表征优化。采用灵活的8插槽模块化架构，可选配HPSMU(高功率)、MPSMU(中功率)、HCU(高电流10A)、HVU(高压1000V)和AFU(模拟反馈)等多种模块。集成电流/电压源、纳伏表和皮安表于一体，支持DC连续和脉冲测量模式。内置2000条命令程序存储，可扩展至2000V/20A范围。该仪器已停产。
  manufacturer: Keysight
  tags: &id001
  - 半导体参数测试仪
  category: *id001
  model:
    name: HP 4142B模块化直流源/监测器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    HPSMU: 40µV-200V/20fA-1A
    MPSMU: 40µV-100V/20fA-100mA
    HCU高电流: 40µV-10V/20µA-10A
    HVU高压: 2mV-1000V/2pA-10mA
    品牌: Keysight
