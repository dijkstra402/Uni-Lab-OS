  name: TDK-Lambda Genesys系列 可编程直流电源
  description: TDK-Lambda Genesys系列是高功率密度可编程直流电源，功率覆盖750W至15kW，输出电压6V至1500V，内置RS-232/RS-485接口支持最多31台菊花链控制，具备有源功率因数校正和宽范围交流输入，支持最多4台并联扩展，适用于工业生产和自动化测试。
  manufacturer: TDK Lambda
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: TDK-Lambda Genesys系列 可编程直流电源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    功率范围: 750W-15kW
    电压范围: 6V-1500V
    电流: 最高1000A
    接口: RS-232/RS-485(内置), 可选LAN/USB/GPIB
    输入: 85-265VAC宽范围
    功率因数: '0.99'
    品牌: TDK Lambda
