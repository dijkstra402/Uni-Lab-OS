  name: Wasatch Photonics WP-785X 拉曼光谱仪
  description: Wasatch Photonics WP-785X是最全面的785nm拉曼光谱仪系列，采用高通量VPH体全息光栅技术。提供f/1.3(最大灵敏度)和f/1.8(更高分辨率)两种光学设计，科学级探测器支持TEC调节(10°C)或TEC制冷(-15°C)。可配置为仅光谱仪(IC)、集成激光(ILC,450mW)或集成激光+采样光学(ILP)三种构型。附赠ENLIGHTEN开源光谱软件和多语言SDK，集成Wiley
    KnowItAll拉曼谱库匹配。
  manufacturer: Wasatch Photonics
  tags: &id001
  - 激光拉曼光谱仪
  category: *id001
  model:
    name: Wasatch Photonics WP-785X 拉曼光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    激发波长: 785nm
    光谱范围: 270-3500cm⁻¹(TEC调节型)/270-3100cm⁻¹(TEC制冷型)
    分辨率: 7-9cm⁻¹(25µm狭缝)
    光学设计: f/1.3(高灵敏度)/f/1.8(高分辨率)
    激光功率: 450mW(集成型)
    探测器: 科学级CCD(10°C/-15°C)
    最小积分时间: 3ms/8ms
    通信: USB2.0
    尺寸: 24.3×17.2×6.0cm
    重量: <2.3kg
    品牌: Wasatch Photonics
  cover: Wasatch Photonics WP-785X 拉曼光谱仪.webp
