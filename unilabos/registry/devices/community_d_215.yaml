  name: Signal Recovery 7280 宽带DSP锁相放大器
  description: Signal Recovery 7280是一款宽带宽DSP锁相放大器，工作频率0.5Hz至2MHz，ADC采样率7.5MHz，支持快速变化信号恢复，具备双参考和双谐波检测功能（可同时测量两个不同频率信号），配备大型电致发光显示面板，支持GPIB/RS-232/以太网/USB多种接口控制。
  manufacturer: Signal Recovery
  tags: &id001
  - 锁相放大器与微弱信号检测
