    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 0.5Hz-2MHz
    ADC采样率: 7.5MHz
    输出滤波器时间常数: 最低1µs
    接口: GPIB, RS-232, 以太网, USB
    品牌: Signal Recovery
