  name: Keysight 81150A 脉冲函数任意噪声发生器
  description: Keysight 81150A是一款多功能脉冲函数任意噪声发生器，2GSa/s采样率，120MHz脉冲发生能力，支持无毛刺参数调节（专利技术），可在连续运行时无中断改变频率和时序参数，提供确定性白高斯噪声输出，适用于数字混合信号器件测试和雷达仿真。
  manufacturer: Keysight
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Keysight 81150A 脉冲函数任意噪声发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    采样率: 2GSa/s
    脉冲频率: 120MHz
    带宽: 240MHz
    通道: 1或2
    输出阻抗: 5Ω/50Ω可选
    波形: 脉冲/正弦/方波/斜坡/噪声/任意波
    调制: AM/FM/FSK/PM/PWM
    接口: GPIB/LAN/USB
    品牌: Keysight
