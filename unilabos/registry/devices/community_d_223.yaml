  name: Stanford Research Systems DG535 数字延迟/脉冲发生器
  description: SRS DG535是一款4通道数字延迟/脉冲发生器，延迟分辨率5ps、抖动<25ps RMS，支持通道间相对延迟设置，提供TTL/NIM/ECL和可调幅度输出，跳变时间<2ns，具备内部/外部/单次/突发等多种触发模式，通过GPIB和RS-232远程控制，适用于精密时序控制应用。
  manufacturer: Stanford Research Systems
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Stanford Research Systems DG535 数字延迟/脉冲发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    延迟范围: 0-999.99s
    延迟分辨率: 5ps
    抖动: <25ps RMS(内触发)
    输出通道: T₀/A/B/C/D/AB/CD
    输出幅度: 最大4V@50Ω
    跳变时间: <2ns
    内触发速率: 0.001Hz-1MHz
    接口: GPIB, RS-232
    品牌: Stanford Research Systems
