  name: Rigol DHO1000系列 高分辨率数字示波器
  description: Rigol DHO1000系列采用自研Centaurus芯片和UltraVision III平台，实现真12位采样分辨率（4096级量化），前端噪声比上代降低5倍，50Mpts存储深度和2GSa/s采样率，UltraAcquire模式波形捕获率达150万次/秒，内置CAN/LIN串行解码，10.1英寸高清触摸屏。
  manufacturer: Rigol
  tags: &id001
  - 示波器与波形分析仪
  category: *id001
  model:
    name: Rigol DHO1000系列 高分辨率数字示波器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    带宽: 70-200MHz
    通道: 2/4
    采样率: 2GSa/s
    存储深度: 50Mpts
    垂直分辨率: 12位
    波形捕获率: 1,500,000wfms/s
    显示: 10.1英寸触摸屏
    解码: I²C/SPI/UART/CAN/LIN
