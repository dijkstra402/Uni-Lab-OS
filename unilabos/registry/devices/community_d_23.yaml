  name: Ocean Optics QE Pro 高灵敏度光谱仪
  description: Ocean Optics QE Pro是一款高灵敏度背照式CCD光谱仪，专为低光照应用设计。Hamamatsu背照式CCD探测器在可见光区域量子效率超过90%，配合TEC制冷至-10°C大幅降低暗噪声。f/4对称交叉Czerny-Turner光学结构焦距101.6mm，信噪比达1000:1。积分时间可达60分钟，支持机载频谱缓冲实现时间分辨测量。适用于荧光、磷光、吸收和拉曼光谱等低光应用。
  manufacturer: Ocean Optics
  tags: &id001
  - 光栅单色仪
  category: *id001
  model:
    name: Ocean Optics QE Pro 高灵敏度光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    探测器: Hamamatsu S7031-1006背照式CCD(1044像素)
    像素尺寸: 24µm×24µm
    波长范围: 200-1100nm
    光学分辨率: 0.14-7.7nm FWHM
    信噪比: '1000:1'
    动态范围: '85000:1'
    积分时间: 8ms-60min
    光学结构: f/4对称交叉Czerny-Turner
    TEC制冷: -10°C
    接口: USB2.0
    尺寸: 182×110×47mm
    重量: 1.1kg
    品牌: Ocean Optics
