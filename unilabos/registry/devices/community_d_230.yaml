  name: Keysight 3458A 8.5位数字万用表
  description: Keysight 3458A是业界最高性能的8.5位数字万用表，拥有30年行业标杆地位。提供低至4ppm的1年直流电压精度和卓越的长期稳定性，最高读取速度100000读数/秒，内置148000读数存储。具备自校准功能和数字化采集能力，标配GPIB接口。广泛应用于国家计量院、校准实验室和高精度自动化测试系统，是精密计量的首选仪器。
