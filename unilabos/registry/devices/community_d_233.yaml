  name: Keithley 2000 6.5位数字万用表
  description: Keithley 2000系列是一款高性能6.5位数字万用表，具备扫描功能。提供0.002%的90天基本直流电压精度和0.008%的电阻精度。在6.5位模式下可通过IEEE-488总线输出50个触发读数/秒，4.5位模式下可达2000读数/秒。支持直流/交流电压和电流、二线和四线电阻、频率及热电偶温度测量。该产品已停产，推荐替代产品为DMM6500。
  manufacturer: Tektronix
