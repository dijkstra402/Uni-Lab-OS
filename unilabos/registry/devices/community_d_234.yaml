  description: Keithley 2700是一款集精密测量、开关和控制于紧凑机箱的多功能数据采集系统，支持机架安装或台式应用。真6.5位(22位)分辨率，可配置12种开关/控制插件模块，最多扩展至200个差分输入通道。支持直流/交流电压电流、二线和四线电阻、热电偶/热敏电阻/RTD温度及频率周期等14种测量功能。2插槽型号已停产，推荐替代产品为DAQ6510。
