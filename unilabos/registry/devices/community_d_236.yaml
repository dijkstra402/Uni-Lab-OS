  name: Keithley 617 可编程静电计
  description: Keithley 617是一款可编程静电计/电压源，专为高阻抗测量设计。电流灵敏度低至0.1fA(10^-16A)，电阻测量范围高达200TΩ(10^14Ω)，电压测量范围0至±200V，输入阻抗超过200TΩ。内置±100V直流电压源，50mV步进输出。配备IEEE-488接口、模拟输出和保护端子。该产品已停产，后续型号为Keithley
    6517B。
