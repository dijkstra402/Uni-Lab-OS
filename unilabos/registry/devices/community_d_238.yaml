  name: Keithley 6487 皮安计/电压源
  description: Keithley 6487是一款集皮安计和电压源于一体的精密仪器，相比6485提供更高精度和更快上升时间。电流分辨率10fA，精度0.3%，内置0至±500V电压源（最大1mA输出），可直接进行I-V特性表征和绝缘电阻测试（10Ω至10^15Ω）。阻尼功能专为容性器件优化，适用于半导体器件特性分析、电容器漏电流测量和高阻抗材料测试。
  manufacturer: Tektronix
  tags: &id001
