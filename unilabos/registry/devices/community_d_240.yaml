  name: Keithley 199 系统数字万用表/扫描器
  description: Keithley 199是一款5.5位真有效值自动量程数字万用表/扫描器。其A/D转换器最大显示±302999计数，高于通常5.5位DMM的±199999计数范围。内置IEEE-488接口实现完全可编程远程控制，除标准万用表功能外还提供最小值/最大值/平均值统计和内置限值测试功能。该产品为停产型号，现作为Tektronix/Keithley遗留产品提供技术文档支持。
  manufacturer: Racal-Dana
