  name: Advantest R6552 数字万用表
  description: Advantest R6552是一款低成本高性能5.5位数字万用表，最大显示319999，采用独特的多斜率积分A/D转换技术确保高速高精度测量。支持DC/AC电压电流、二线和四线电阻、低功率电阻、(AC+DC)测量、频率和二极管测试。除常规FAST/MED/SLOW采样模式外，独有BURST(1000次/秒)和LONG-IT模式。前后面板均有输入端子便于机架安装，配备GPIB和RS232接口。
