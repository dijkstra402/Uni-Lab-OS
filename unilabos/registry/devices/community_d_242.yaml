  name: Fluke 8842A 5.5位数字万用表
  description: Fluke 8842A是8840A系列的顶级型号，采用专有薄膜电阻网络和稳定参考放大器，提供卓越的测量性能和稳定性。5.5位分辨率，基本直流精度0.003%(1年)，增加了20mV、20Ω和200mA直流量程，分辨率分别达到100nV、100μΩ和1μA。支持闭壳校准无需内部调整，可选IEEE-488接口和真有效值AC测量。2年校准周期精度0.005%。
  manufacturer: Fluke
