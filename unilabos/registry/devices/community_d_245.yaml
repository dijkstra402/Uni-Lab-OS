  name: Solartron 7001 数字万用表
  description: Solartron 7001是Solartron Instruments(Schlumberger旗下)生产的数字万用表，属于Solartron7000系列测量仪器产品线。Solartron以生产高精度数字万用表闻名，产品线涵盖7061(6.5位)、7071(7.5位)、7081(8.5位)和7150(5.5/6.5位)等多个型号。由于该具体型号资料极为稀少，详细规格需参考原始技术手册或Solartron1986年产品目录。
  manufacturer: Solartron
