  name: Racal-Dana 9015A 微波频率计
  description: Racal-Dana 9015A是一款精密微波频率计/定时器，型号编号暗示其频率测量范围可达15GHz。支持频率、周期、时间间隔、总计数和比率等多种测量功能。内置高稳定晶振时基，可选OCXO超高稳定度选件。配备可选GPIB接口用于远程控制和数据采集。Racal-Dana是英国知名测试测量设备制造商，后被Fluke/Danaher收购，该产品已停产。
