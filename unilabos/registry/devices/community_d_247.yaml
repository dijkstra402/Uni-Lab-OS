  name: Datron 1061 自动校准数字万用表
  description: Datron 1061是英国Datron Instruments生产的AUTOCAL系列多功能微处理器控制数字万用表，约1978/79年设计。5.5位分辨率达到1μV精度5ppm，采用Motorola
    6800处理器。支持DC/AC电压、电流、电阻、dB和比率测量，具备二线/四线切换和GUARD功能。独特的软件控制校准(Autocal)系统，校准数据由锂电池备份存储。SPEC功能可显示当前读数的精度(ppm或%)。
  manufacturer: Datron
  tags: &id001
