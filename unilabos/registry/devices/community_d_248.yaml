  name: R&S NRT 功率反射计
  description: R&S NRT系列是罗德与施瓦茨的方向性功率反射计，用于测量信号源与负载之间的正向和反向功率。当前型号NRT2配备5英寸触摸屏，支持同时显示正向和反向功率参数及CCDF幅度分布。配合NRT-Zxx系列方向性功率传感器使用，覆盖25MHz至4GHz频率范围，平均功率最大120W，峰值功率最大300W。广泛应用于发射机、天线和RF发生器的安装、维护和监控。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 射频与微波测试设备
  category: *id001
  model:
    name: R&S NRT 功率反射计
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    配套NRT-Z14传感器: 平均功率6mW至120W/峰值功率0.4至300W/频率25MHz至1GHz
    配套NRT-Z44传感器: 平均功率3mW至120W/峰值功率0.4至300W/频率200MHz至4GHz
    品牌: Rohde & Schwarz
