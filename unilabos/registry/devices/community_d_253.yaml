  name: HP 8593E 便携式频谱分析仪
  description: HP 8593E是8590 E系列便携式微波频谱分析仪，频率覆盖9kHz至22GHz，支持可下载测量人格包，适用于有线电视/广播、器件测试、EMC、光波和无线通信等应用。具备一键测量功能、分屏显示、四槽卡笼扩展和内置存储卡读取器。可选窄分辨率带宽(30/100/200/300Hz)、时门频谱分析、AM/FM解调等扩展功能。该产品已停产，推荐替代型号为N9010A
    EXA或N9000A CXA。
  manufacturer: Keysight
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  model:
    name: HP 8593E 便携式频谱分析仪
    type: device
  version: 1.0.0
