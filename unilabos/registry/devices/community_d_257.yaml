  name: Eurotherm 3200 温度/过程控制器
  description: Eurotherm 3200系列提供精密温度和过程变量控制，强调简便易用。QuickStart功能可快速配置输入传感器、测量范围、控制选项和报警，实现真正的开箱即用。支持PC端iTools配置向导，操作模式下提供多语言滚动文本描述。具备加热器故障检测、计时器、设定值编程器和配方功能，专利cutback算法有效防止超调。适用于塑料挤出、热处理、热流道、热成型、烘箱和应力消除等应用场景。
  manufacturer: Eurotherm
  tags: &id001
  - 冷热源
  category: *id001
  model:
    name: Eurotherm 3200 温度/过程控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    输入类型: CT/mA/mV/RTD/TC
    PV精度: <0.25%
    防护等级: IP65/NEMA 12/NEMA 4X
    显示: 主4位+下5-9字符星爆
    控制方式: On/Off/PID/VP
    编程器: 4升温+4保温段
    通讯: Modbus
    供电: 24V DC/AC或85-264V AC
    安全认证: EN14597 TR
    品牌: Eurotherm
