  name: Lauda Ecoline RE300 低温恒温循环槽
  description: Lauda Ecoline RE300系列是专业低温恒温循环槽，采用Pt100温度探头和高分辨率AD转换器实现精确温度测量，温度稳定性达±0.02°C。配备2行背光LCD显示屏，内置带变频驱动的压力泵，支持外部Pt100探头实现级联控制。安全系统采用双通道双微控制器互检机制，符合EN
    61010-2-010标准。不锈钢浴槽设计，适用于实验室外部设备恒温和样品温度控制应用。
  manufacturer: Lauda
  tags: &id001
  - 低温恒温槽
  category: *id001
  model:
    name: Lauda Ecoline RE300 低温恒温循环槽
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温度范围: -40~200°C
    温度稳定性: ±0.02°C
    显示分辨率: 0.05/0.01°C
    泵类型: 变频压力泵(5级)
    最大泵流量: 25L/min
    最大排出压力: 0.4bar
    加热功率: 2.25kW
    供电: 230V/50Hz
    安全标准: EN 61010-2-010
    品牌: Lauda
