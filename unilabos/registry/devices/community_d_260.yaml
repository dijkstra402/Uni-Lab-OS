  name: BelektroniG BTC-LAB 台式温度控制器
  description: BelektroniG BTC-LAB系列是专业台式温度控制器，用于加热或Peltier元件的精确控制。温度测量精度达±0.05°C，最高分辨率0.001°C，采样率10Hz。扩展PID算法支持加热和冷却的独立参数设置，最大控制输出270W。具备传感器故障检测和短路保护等安全功能，可调限制适配多种加热和Peltier元件。提供6种型号配置，配套PC软件BTC
    Soft、USB驱动和LabVIEW VIs。
  manufacturer: BelektroniG
  tags: &id001
  - 冷热源
  category: *id001
  model:
    name: BelektroniG BTC-LAB 台式温度控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    测量范围: -200~+800°C
    分辨率: 0.1/0.01/0.001°C
    采样率: 10Hz
    传感器: PT100/PT1000
    测量精度: ±0.05°C
    控制输出: 最大270W(10A)
    接口: USB
    软件: BTC Soft/LabVIEW VIs
    品牌: BelektroniG
