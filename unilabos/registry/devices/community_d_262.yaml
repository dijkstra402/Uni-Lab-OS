  name: Accretech UF200/UF300 晶圆探针台
  description: Accretech UF200/UF300系列是全自动晶圆探针台，UF200支持5至8英寸晶圆，UF300支持300mm晶圆。采用CCD
    ITV图像处理实现精确对准，标配热卡盘支持室温至150°C测试。具备实时晶圆地图显示、彩色触摸屏、自动针位对准、针痕检查等功能。适用于分立器件、功率器件、逻辑器件和MEMS测试，可选低温至高温测试、翘曲和超薄晶圆专用传送机构、微电流和高压测试环境等扩展配置。
  manufacturer: Accretech
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: Accretech UF200/UF300 晶圆探针台
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    晶圆尺寸: UF200支持5-8英寸(最大Φ200mm)
    定位精度: ±4µm
    X/Y探测区域: ±120mm
    最大速度: 200mm/s
    Z轴行程: 69mm
    θ轴旋转: ±5°
    对准: CCD ITV图像处理
    温度: 室温~+150°C(标配热卡盘)
    品牌: Accretech
