  name: Keysight 8163A 光波万用表系统
  description: Keysight 8163A是一款光波万用表主机系统，提供灵活的模块化配置和简易测试方案控制。具备2个前装载纤薄模块槽，支持816xxx和815xxx系列光功率传感器和可调谐激光源模块。图形显示190x300点，分辨率达0.0001dB/dBm，支持全通道真同步触发。配备GP-IB接口(符合IEEE
    488-1978标准)和并行/串行端口，内置应用程序。该产品已停产，后续型号为8163B(升级彩色显示300x240点)。
  manufacturer: Keysight
  tags: &id001
  - 光传感器
  category: *id001
  model:
    name: Keysight 8163A 光波万用表系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    模块槽: 2个纤薄模块槽
    显示: 图形显示190x300点(单色)
    分辨率: 0.0001dB/dBm/0.01pW-10pW
    触发: 全通道真同步
    模块兼容: 816xxx/815xxx系列
    接口: GP-IB/并口/串口
    状态: 已停产
    品牌: Keysight
  cover: Keysight 8163A 光波万用表系统.webp
