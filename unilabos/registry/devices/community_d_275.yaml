  name: Keysight 81550A 单模可变光衰减器模块
  description: Keysight 81550A是一款单模可变光衰减器模块，适用于8163B/8164B/8166B光波测量平台。该模块覆盖O波段至L波段（1200-1700nm），提供高达60dB的衰减范围和0.001dB的超高分辨率，适用于光通信组件和系统的精密测试。用户可输入工作波长，仪器自动应用校正，并支持参考功率设置。
  manufacturer: Keysight
  tags: &id001
  - 光学组件
  category: *id001
  model:
    name: Keysight 81550A 单模可变光衰减器模块
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1200-1700nm
    衰减范围: 0-60dB
    衰减精度: ±0.3dB
    分辨率: 0.001dB
    插入损耗: ≤1.5dB(斜面接口)/≤2.0dB(直面接口)
    回波损耗: ≥45dB
    光纤类型: 单模
    品牌: Keysight
