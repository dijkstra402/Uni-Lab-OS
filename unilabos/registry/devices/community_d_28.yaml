    机载存储: 50000幅光谱
    热稳定性: ±1.0像素(0-40°C)
    杂散光: '>3AU(HDX-XR)'
    狭缝: 10µm(HDX-XR)
    接口: USB/千兆以太网/WiFi/RS-232
    品牌: Ocean Optics
