  name: Ocean HDX 高清光谱仪
  description: Ocean HDX是Ocean Insight的高性能高清光谱仪，采用背照式CCD阵列和高清光学(HDO)设计，最大化光学分辨率并优化峰对称性。X-Platform电子平台增强通信能力，支持USB、千兆以太网、WiFi和RS-232多种接口。机载可存储50000幅光谱并支持机载平均处理。出色的热稳定性(0-40°C内仅±1.0像素漂移)确保在苛刻环境中的可靠性能。HDX-XR扩展范围版本覆盖200-1100nm。
  manufacturer: Ocean Optics
  tags: &id001
