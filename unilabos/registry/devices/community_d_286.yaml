  name: Inficon SQM-160 薄膜沉积监控仪
  description: Inficon SQM-160采用成熟的石英晶振传感器技术测量薄膜沉积过程中的速率和厚度。标配2路传感器输入，可选扩展至6路，传感器可分配给不同材料、取平均值或配置为双传感器模式。提供标准和高分辨率两种模式，高分辨率下厚度分辨率达±0.037Å。支持速率采样模式以延长高速沉积中的传感器寿命，4路继电器输出可控制挡板和设定点信号。
  manufacturer: Inficon
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: Inficon SQM-160 薄膜沉积监控仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    传感器通道: 2路标准/最多6路
    频率范围: 1.0-6.5MHz
    厚度分辨率: ±0.37Å(标准)/±0.037Å(高分辨率)
    存储膜数: '99'
    速率显示: 0.1或0.01Å/s可选
    通信: RS-232标准/USB/以太网可选
    数字I/O: 4输入/4继电器输出
    尺寸: 3.5英寸半机架
    品牌: Inficon
