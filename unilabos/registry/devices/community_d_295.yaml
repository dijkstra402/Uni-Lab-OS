  name: Kern 572 精密天平
  description: Kern 572系列是实验室和工业通用精密天平（IoT-Line），采用压铸铝外壳坚固耐用。具备配方功能、百分比测定、GLP/ISO记录、计件和防振称量等丰富功能。KERN通用端口(KUP)支持RS-232/USB/蓝牙/WiFi/以太网等多种接口适配器，兼容KERN
    EasyTouch软件和工业4.0应用。可自由编程称量单位（如线密度g/m、克重g/m²），提供悬挂称量底钩。多种子型号覆盖不同量程和精度。
  manufacturer: Kern
  tags: &id001
  - 电子天平
  category: *id001
  model:
    name: Kern 572 精密天平
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    最大量程: 240g(572-30型)
    可读性: 0.001g
    线性度: ±0.003g
    重复性: 0.001g
    稳定时间: 3s
    秤盘直径: 106mm
    外壳: 压铸铝
    接口: KUP(可选RS-232/USB/蓝牙/WiFi/以太网)
    尺寸: 180×310×85mm
    净重: ~2.4kg
    品牌: Kern
