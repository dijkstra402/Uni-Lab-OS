  name: Nanotec SMCI 步进电机控制器
  description: Nanotec SMCI系列是一款紧凑型步进电机控制器，专为控制双极步进电机而设计。支持多种操作模式，包括速度控制和定位控制，具备微步进功能实现精密运动控制。控制器集成了编码器输入接口，可实现闭环运行，内置运动控制器无需额外控制器。通过RS-485或USB接口进行编程和通信，广泛应用于工业自动化领域的精确运动控制场景。
  manufacturer: Nanotec
  tags: &id001
