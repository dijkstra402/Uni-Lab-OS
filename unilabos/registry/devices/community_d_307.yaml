  name: Keysight 34980A 多功能开关/测量单元
  description: Keysight 34980A是一款8卡槽模块化多功能开关/测量主机，内置可选6.5位数字万用表，支持21种插件模块实现开关(至50GHz)、数字I/O、D/A转换和计数器/累加器功能。提供最多560路2线复用通道或2048个矩阵交叉点，扫描速率可达每秒1000通道。内置Web界面便于远程访问，支持LAN(LXI)、USB和GPIB连接，价格远低于同类VXI或PXI模块化方案。
