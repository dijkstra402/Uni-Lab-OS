  name: OmniCure S2000 UV点固化系统
  description: OmniCure S2000是Excelitas Technologies（原Lumen Dynamics）出品的高性能UV点固化系统，具备业界最高水平的过程控制一致性。采用专有实时闭环反馈技术和集成光学UV传感器，自动补偿灯泡老化导致的光功率衰减。配备200W
    UV灯，辐照度可达30W/cm²，校准模式下辐照精度优于±3%。广泛应用于医疗器械组装、电子元件粘接和光学组件胶合等精密UV固化场景。
