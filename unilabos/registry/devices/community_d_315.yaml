  name: Acton FA-448 电动滤光片轮
  description: Acton FA-448是由Acton Research Corporation（现归属Teledyne Princeton Instruments）制造的电动滤光片轮，专为光谱学和光学成像系统设计。通常提供6或8个滤光片位置，兼容标准1英寸（25mm）圆形光学滤光片。通过串行接口实现计算机控制的自动滤光片切换，常与Acton单色仪和光谱仪配合使用，适用于级次排序滤光和光谱选择等应用。
  manufacturer: Princeton Instruments
