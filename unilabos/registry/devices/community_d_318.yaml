  name: DPS 3005 可编程降压直流电源模块
  description: DPS 3005是一款紧凑型数字可编程降压直流电源模块，集模拟集成和数字控制功能于一体。输入电压6-40V DC，输出0-32V/0-5A可调，最大功率160W。配备彩色LCD显示屏实时显示输入/输出电压电流和功率，支持10组预设值掉电存储、OVP/OCP/OPP保护和旋转编码器调节。需配合外部直流电源使用，适用于DIY电子、实验室台式电源和教育实验等场景。
  manufacturer: RD/Ruideng
