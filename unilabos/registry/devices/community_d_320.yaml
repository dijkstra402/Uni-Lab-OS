  name: Pico Technology TC-08 热电偶温度记录仪
  description: Pico Technology TC-08是一款8通道USB热电偶温度数据记录仪，具备20位分辨率和-270°C至1820°C的宽测量范围。兼容所有常见热电偶类型(B/E/J/K/N/R/S/T)，每秒可采集10个温度测量值。USB供电无需外接电源，即插即用。配套PicoLog
    6软件支持可视化设置、数据记录和分析，可同时连接最多20台设备实现160通道数据采集，支持云端数据存储和报警功能。
