  name: Voltcraft K204 四通道热电偶温度记录仪
  description: Voltcraft K204是Conrad Electronic品牌旗下的四通道K型热电偶温度数据记录仪。测量范围-200°C至+1370°C，分辨率0.1°C，精度±(0.1%读数+0.7°C)。LCD显示屏可同时显示多通道读数，内置数据存储可记录数千个数据点。支持USB或SD卡数据传输至PC进行分析，具备MIN/MAX/AVG记录、保持功能、高低温报警和时间日期戳等功能。广泛用于工业温度监测、HVAC系统和实验室应用。
