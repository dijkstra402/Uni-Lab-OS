  name: Keithley 2100 6.5位USB数字万用表
  description: Keithley 2100是一款6.5位USB数字万用表，以5.5位仪器的价格提供高精度测量能力。基本直流电压精度达0.0038%，支持11种测量功能和8种数学函数。配备USB
    2.0 TMC接口，支持SCPI命令远程控制。附带PC软件工具，可将数据导出至Microsoft Word和Excel。适用于生产测试、研发和教育实验室环境。
