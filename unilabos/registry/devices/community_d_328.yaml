  name: Keithley 2701 以太网万用表/数据采集系统
  description: Keithley 2701是业界首款完全集成仪器级分辨率和灵敏度与以太网远距离组网能力的多点测量和控制系统。基于6.5位22位积分A/D转换器，支持电压、电流、电阻、温度、频率等14种测量功能。以太网端口提供高达100Mbps的数据传输速率，支持TCP/IP协议。配备2个模块插槽，最多可扩展至80个差分输入通道。
  manufacturer: Tektronix
  tags: &id001
  - 数据采集与记录仪
  category: *id001
  model:
    name: Keithley 2701 以太网万用表/数据采集系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    分辨率: 6.5位(22位积分ADC)
    通道数: 最高80差分输入
    扫描速率: 最高500通道/秒(单通道3500读数/秒)
    插槽: '2'
    存储: 450000读数
    接口: 以太网(10/100Base-T), RS-232
    尺寸: 2U半机架
    品牌: Tektronix
