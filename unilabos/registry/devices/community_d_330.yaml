  name: Andor Shamrock 500i 成像光谱仪
  description: Andor Shamrock 500i是一款基于Czerny-Turner光学设计的成像光谱仪，焦距500mm，提供卓越的多轨光谱性能。采用优化的复曲面光学元件进行像散校正，实现高密度多轨光谱能力。预对准、预校准的设计确保即插即用。配备电动索引三光栅转台和双探测器输出，支持UV-VIS
    CCD和InGaAs相机的扩展波长覆盖。适用于拉曼光谱、荧光光谱、吸收和发射光谱等应用。
  manufacturer: Andor
