  name: Amplitude Satsuma 工业飞秒激光器
  description: Amplitude Satsuma是一款紧凑型工业超快激光器，全球畅销产品，已安装超过1500台。提供Satsuma、Satsuma
    HP和Satsuma HP²三个功率等级，平均功率从5W到20W，脉冲能量从10μJ到40μJ。采用风冷设计，支持FemtoTrig脉冲按需功能和FemtoBurst多脉冲模式。适用于微加工、眼科手术、显示器修复和科学研究等领域。
  manufacturer: Amplitude Systems
  tags: &id001
  - 固体激光器
  category: *id001
  model:
    name: Amplitude Satsuma 工业飞秒激光器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    平均功率: '>5W/10W/20W'
    脉冲能量: '>10/20/40μJ'
    脉冲宽度: <350fs
    重复频率: 单脉冲~40MHz
    中心波长: 1030±5nm
    冷却: 风冷(至20W IR)
    可选输出: 绿光/UV/深紫外
    品牌: Amplitude Systems
  cover: Amplitude Satsuma 工业飞秒激光器.webp
