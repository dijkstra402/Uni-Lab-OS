  name: ASI Cheetah3 混合像素探测器
  description: ASI Cheetah3是一款基于CERN Medipix合作组织开发的Timepix3读出芯片技术的高性能混合像素2D探测器。每个像素可同时记录到达时间(ToA,精度1.56ns)和能量信息(ToT)。支持数据驱动的零死时间连续无触发操作和帧模式读出。具有单粒子灵敏度，可探测单个光子、电子和离子。传感器材料可选Si、CdTe或GaAs。广泛应用于电子显微镜(4D-STEM)、X射线衍射和同步辐射实验。
  manufacturer: Amsterdam Scientific Instruments
  tags: &id001
  - 工业与科学相机
  category: *id001
  model:
    name: ASI Cheetah3 混合像素探测器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    传感器技术: Timepix3混合像素
    像素尺寸: 55×55μm
    像素矩阵: 512×512(四芯片)
    时间分辨率: ~1.56ns(ToA)
    读出模式: 数据驱动(事件模式)+帧模式
    命中率: 最高80Mhits/s/芯片
    接口: 10GbE
    品牌: Amsterdam Scientific Instruments
