  model:
    name: Teledyne LeCroy WaveRunner 9104 数字示波器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    带宽: 1GHz
    通道: 4模拟通道
    采样率: 最高20GS/s(2通道)/10GS/s(4通道)
    存储深度: 最高32Mpts/通道
    垂直分辨率: 8位(增强可达11位)
    显示: 12.1英寸WXGA触摸屏
    输入阻抗: 50Ω/1MΩ
    品牌: Teledyne LeCroy
  cover: Teledyne LeCroy WaveRunner 9104 数字示波器.webp
