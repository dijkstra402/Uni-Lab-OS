  name: Teledyne LeCroy WaveRunner 9104 数字示波器
  description: Teledyne LeCroy WaveRunner 9104是WaveRunner 9000系列高性能数字示波器，带宽1GHz，4个模拟通道，最高采样率20GS/s。配备12.1英寸WXGA触摸屏和MAUI(最先进用户界面)，支持直观的触摸操作。深存储和快速波形处理能力适合长时间采集分析。支持序列模式、高级数学和测量功能、可选串行协议解码(I2C/SPI/UART/CAN等)。适用于嵌入式系统调试、电源分析和信号完整性应用。
  manufacturer: Teledyne LeCroy
  tags: &id001
  - 示波器与波形分析仪
