  category: *id001
  model:
    name: Newport ESP100 通用运动控制器/驱动器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: 单轴
    电机类型: DC伺服和步进电机
    接口: RS-232, GPIB
    ESP兼容: 支持即插即用
    控制: PID伺服回路
    命令集: ASCII助记符命令
    品牌: Newport
