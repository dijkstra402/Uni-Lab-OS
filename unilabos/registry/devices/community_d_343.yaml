  name: Newport ESP100 通用运动控制器/驱动器
  description: Newport ESP100是一款已停产的单轴通用运动控制器/驱动器，支持DC伺服电机和步进电机。采用Newport ESP(增强系统性能)技术，通过EEPROM自动识别和配置ESP兼容平台，实现即插即用。支持RS-232和GPIB接口进行计算机控制。后续替代产品为SMC100(单轴)和ESP301/ESP302(多轴)系列。ESP100手册编号P/N
    29754-01。
  manufacturer: Newport
  tags: &id001
