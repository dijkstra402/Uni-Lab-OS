  name: Newport SMC100 单轴运动控制器
  description: Newport SMC100是一款紧凑型单轴运动控制器，提供DC伺服(SMC100CC)和步进电机(SMC100PP)两种型号。采用浮点数字PID控制回路，带速度和摩擦前馈补偿，伺服频率2kHz。支持ESP兼容平台即插即用自动配置。通过RS-485端口可菊花链连接最多31台控制器实现多轴控制。提供40多条双字符ASCII命令和LabVIEW驱动库。适配Newport
    GTS/ILS线性台、URS旋转台和LTA促动器。
  manufacturer: Newport
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Newport SMC100 单轴运动控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: 1(可菊花链31台)
    电机类型: DC伺服(SMC100CC)或步进(SMC100PP)
    DC驱动: 48VDC@1.5A RMS
    步进驱动: 48VDC@1.1A RMS/相
    伺服频率: 2kHz
    接口: RS-232-C, USB(需SMC-USB适配器)
    尺寸: 33×161×140mm
    I/O: 4TTL输出+4TTL输入+1模拟输入
    品牌: Newport
  cover: Newport SMC100 单轴运动控制器.webp
