  name: JEOL JSM-7800F 肖特基场发射扫描电子显微镜
  description: JSM-7800F采用JEOL新开发的超级混合物镜(SHL),结合电磁场与静电场叠加设计,实现亚纳米级分辨率同时不对样品施加磁场影响。Schottky电子枪提供稳定的大探针电流,Gentle
    Beam模式可在极低着陆能量下实现高分辨成像。支持EDS元素分析和EBSD晶体学分析,已停产并由JSM-7900F替代。
