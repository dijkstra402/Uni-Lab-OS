  name: DSP7265双相DSP锁相放大器
  description: DSP7265是Signal Recovery(AMETEK)公司的双相数字信号处理锁相放大器。频率范围1mHz至250kHz，全量程灵敏度2nV至1V(电压模式)，电流输入灵敏度2fA至1µA。输入噪声低至5nV/√Hz，动态储备大于100dB。采用24位模数转换，支持单端和差分输入模式。具备双参考/双谐波模式，可同时测量两个谐波信号。内置信号源，支持高达65535次谐波检测。提供RS-232和GPIB(IEEE-488)接口，多种滤波器斜率选项(6/12/18/24dB/倍频程)。广泛应用于光谱学、材料科学和低信号测量领域。该产品现为传统产品，已被7270等新型号替代。
  manufacturer: Signal Recovery
  tags: &id001
  - 锁相放大器与微弱信号检测
