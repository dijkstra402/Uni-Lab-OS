  name: TDC001 T-Cube直流伺服电机控制器
  description: TDC001是Thorlabs公司的T-Cube单通道直流伺服电机控制器，外形尺寸60mm×60mm×47mm。设计用于提供高效的手动和自动控制直流伺服电机，兼容多种带编码器反馈的直流有刷电机。通用软件设置和闭环调谐可轻松适应任何电机/执行器组合。具备限位开关处理、速度曲线设置、闭环PID参数控制，允许用户即时更改电机速度和方向。高级设置允许用户自定义丝杠螺距和齿轮箱比率，实现与各种设置的兼容性。TDC001可使用1/4英寸(M6)间隙槽直接安装到光学平台。USB连接提供即插即用PC控制操作。USB集线器标准或T-Cube控制器集线器可将多个单元连接到一台PC，特别适合多轴运动控制应用。通过控制器集线器，最多12个独立T-Cube控制器可使用单台PC控制。APT软件允许用户设置复杂的移动序列，Kinesis软件具有.NET控件。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: TDC001 T-Cube直流伺服电机控制器
    type: device
  version: 1.0.0
  resource_type: device
