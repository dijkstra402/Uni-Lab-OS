  name: Thorlabs CCS100 紧凑型CCD光谱仪
  description: Thorlabs CCS100是一款采用Czerny-Turner光路设计的紧凑型CCD光谱仪，光谱范围350-700nm，3648像素CCD阵列，16位AD转换，无运动部件设计坚固可靠，自动暗电流补偿，出厂校准并附校准报告，配备OSA软件和多种编程驱动（C/LabVIEW/Python），便携尺寸适合现场应用。
  manufacturer: Thorlabs
  tags: &id001
  - 紫外-可见分光光度仪
  category: *id001
  model:
    name: Thorlabs CCS100 紧凑型CCD光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    光谱范围: 350-700nm
    光谱精度: <0.5nm FWHM@633nm
    探测器: 3648像素线阵CCD
    积分时间: 10µs-60s
    信噪比: ≤2000:1
    AD转换: 16位
    光纤接口: SMA905
    接口: USB 2.0
    品牌: Thorlabs
