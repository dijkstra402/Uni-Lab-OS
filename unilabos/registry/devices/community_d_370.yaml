  name: Thorlabs CCS175 紧凑型CCD光谱仪
  description: Thorlabs CCS175是一款近红外波段紧凑型CCD光谱仪，光谱范围500-1000nm，采用830线/mm光栅和3648像素CCD阵列，分辨率6px/nm，支持外部TTL触发（最高100Hz），出厂校准含光纤跳线，配备完整软件和驱动套件，便携尺寸仅122×79×29.5mm。已停产。
  manufacturer: Thorlabs
  tags: &id001
  - 近红外光谱仪
  category: *id001
  model:
    name: Thorlabs CCS175 紧凑型CCD光谱仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    光谱范围: 500-1000nm
    光谱精度: <0.6nm FWHM@633nm
    探测器: 3648像素CCD
    光栅: 830线/mm/800nm闪耀
    狭缝: 20µm×2mm
    积分时间: 10µs-60s
    信噪比: ≤2000:1
    扫描速率: 最大200次/秒
    品牌: Thorlabs
