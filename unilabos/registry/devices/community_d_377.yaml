  name: Alcatel ACM 1000 真空计控制器
  description: Alcatel ACM 1000是一款多规真空计控制器（现属Pfeiffer Vacuum），支持皮拉尼规、潘宁冷阴极规和电容膜片规等多种真空传感器，测量范围可覆盖约10⁻⁸mbar至大气压，具备可编程设定点继电器用于过程控制，RS-232串口通信。
