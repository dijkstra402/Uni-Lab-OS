  name: QSI 600系列科学级CCD相机
  description: QSI 600系列是科学级CCD相机，专为天文摄影和科学成像设计。采用Kodak KAF系列CCD传感器，内置热电制冷可降温40-45°C，配备内置滤镜轮，支持ASCOM协议，兼容MaxIm
    DL等主流天文成像软件。
  manufacturer: QSI
  tags: &id001
  - 工业与科学相机
  category: *id001
  model:
    name: QSI 600系列科学级CCD相机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    传感器: Kodak KAF系列
    分辨率: 3326x2504 (683型)
    像素尺寸: 5.4-9µm
    制冷: TEC制冷低于环境温度40-45°C
    滤镜轮: 内置5/8位
    接口: USB 2.0
    位深: 16-bit
    品牌: QSI
