  name: Attocube ANC150压电步进运动控制器
  description: Attocube ANC150是三轴压电步进运动控制器，采用惯性滑移驱动原理，通过USB接口控制。兼容ANP系列定位器，可在超高真空、低温和强磁场等极端环境中工作，提供亚纳米级步进精度，适用于扫描探针显微镜和光学对准应用。
  manufacturer: Attocube
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Attocube ANC150压电步进运动控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制轴数: 3轴
    驱动原理: 惯性滑移(slip-stick)
    驱动电压: 最高~70V
    步进精度: 亚纳米至微米级
    接口: USB
    兼容环境: 超高真空/低温/强磁场
    兼容: ANP系列定位器
    品牌: Attocube
