  name: Comet cito Plus 1310 射频发生器
  description: Comet cito Plus 1310是一款工业级射频发生器，工作频率为13.56 MHz，输出功率1000W。该系列以卓越的脉冲质量、稳定性和功率测量精度著称，适用于等离子体沉积和刻蚀应用以及非半导体应用。具有高正常运行时间，专注于提高产量和降低运营成本。支持Profibus通讯，配备主动前面板显示和AGS匹配网络接口。Comet
    PCT在射频功率输送领域拥有60年的创新历史。
