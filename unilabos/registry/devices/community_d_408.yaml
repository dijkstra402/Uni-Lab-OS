  name: Holzworth HS9000系列多通道射频合成器
  description: Holzworth HS9000系列是一款高性能多通道射频合成器平台，采用专有非PLL合成架构，提供超低相位噪声和快速切换能力。支持1至8通道配置，每个通道可独立指定频率范围和性能选项。无风扇传导冷却机箱经过热优化设计，保持通道间最低温度梯度。集中式参考分配子系统确保所有通道间真正的相位相干关系。应用范围从粒子加速器定时时钟到卫星位置跟踪。
  manufacturer: Holzworth
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Holzworth HS9000系列多通道射频合成器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 最高1/2/3/4/6/12/18 GHz可配
    通道数: 1-8通道(16通道窄带可选)
    架构: 非PLL专有合成
    功耗: 平均7W/通道
    冷却: 无风扇传导散热
    特性: 超低相位噪声/快速切换/相位相干
    品牌: Holzworth
  cover: Holzworth HS9000系列多通道射频合成器.webp
