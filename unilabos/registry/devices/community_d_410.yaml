  name: Keithley 2182A 双通道纳伏表
  description: Keithley 2182A是一款双通道7½位高性能数字纳伏表，专为稳定、低噪声电压测量和低电阻材料表征而优化。提供比替代方案更高的测量速度和显著更好的噪声性能。简化的Delta模式可配合6220/6221可逆电流源进行电阻测量，最低可达10nΩ。内置热电偶线性化和冷端补偿功能，支持电压、温度和电阻比测量。适用于纳米技术等低功耗器件测量应用。
