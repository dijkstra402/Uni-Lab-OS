  name: Ondax SureLock LM系列波长稳定激光模块
  description: Ondax SureLock LM系列（现归属Coherent）是一款紧凑型波长稳定激光模块，采用PowerLocker体积全息光栅（VHG）滤波器技术。VHG滤波器创建外腔锁定激光二极管波长，将光谱带宽缩窄一个数量级。极短的外腔配置比Littrow或Littman腔设计具有更好的模式选择和更小的封装尺寸。集成精密温控和电流控制，实现优于1%的功率稳定性和不到1分钟的预热时间。适用于拉曼光谱和计量应用。
  manufacturer: Coherent
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Ondax SureLock LM系列波长稳定激光模块
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 405-830nm
    功率范围: 12-150mW
    线宽: <25-300MHz
    空间模式: 单模
    RMS噪声: 0.25-0.5%(0-20MHz)
    功率稳定性: <1%
    预热时间: <1分钟
    技术: PowerLocker VHG滤波器
    品牌: Coherent
  cover: Ondax SureLock LM系列波长稳定激光模块.webp
