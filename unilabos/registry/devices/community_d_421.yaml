  name: Tektronix AWG2000系列任意波形发生器
  description: Tektronix AWG2000系列是一组任意波形发生器产品线，包括AWG2005(20MS/s,12bit,64K)、AWG2020(250MS/s,12bit,256K)和AWG2040(1GS/s,8bit,1M)等型号。AWG2005适用于需要中等点定义和长记录的信号仿真；AWG2020集成函数发生器与控制器和图形用户界面；AWG2040提供差分输出和最高1GHz时钟频率。所有型号支持实时序列、公式输入波形生成，可通过GPIB和RS-232接口进行完整编程。该系列为已停产的遗留产品。
  manufacturer: Tektronix
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Tektronix AWG2000系列任意波形发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    型号: AWG2005/2020/2040
    采样率: 20MS/s-1GS/s
    垂直分辨率: 8-12bit
    波形存储: 64K-1M点
    输出通道: 1-4
    波形类型: 正弦/方波/三角/锯齿/噪声/任意/DC
    接口: GPIB/RS-232
    品牌: Tektronix
