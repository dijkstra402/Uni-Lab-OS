  name: Ekspla NT340系列高能量宽调谐纳秒激光器
  description: NT340系列是Ekspla生产的高能量宽调谐纳秒激光器，将纳秒光学参量振荡器(OPO)与调Q Nd:YAG激光器集成于紧凑的单一外壳中。实现从紫外到红外192-4400nm的无间隙自动调谐，密封腔体保护晶体免受灰尘和湿气影响。适用于激光诱导荧光、闪光光解、时间分辨光谱、腔衰荡光谱和气体光谱等应用。
