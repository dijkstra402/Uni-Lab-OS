  name: Spectra-Physics Millennia eV连续波DPSS绿色激光器
  description: Millennia eV是Spectra-Physics生产的高功率连续波二极管泵浦固体(DPSS)绿色激光器，采用专利It's in
    the Box集成设计，将激光腔体、泵浦二极管和控制电子元件整合于单一紧凑机箱中。提供5W至25W输出功率可选，具备超低光学噪声和同级最佳功率稳定性。广泛用于泵浦钛宝石激光器、超快光谱和光伏制造等领域。
