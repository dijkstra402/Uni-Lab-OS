  name: Thorlabs BSC203三通道台式步进电机控制器
  description: BSC203是Thorlabs BSC200系列三通道台式步进电机控制器，可同时驱动三台高功率双相双极步进电机。采用高速DSP与低噪声模拟电子技术相结合，提供409600微步分辨率和过流/过温保护。支持USB多台级联和双轴/三轴手柄操控，后面板配备电机驱动和控制I/O连接器用于外部触发同步。兼容Kinesis和APT软件。
