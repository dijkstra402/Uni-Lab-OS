  name: VICI Valco两位多通阀
  description: VICI Valco两位阀是业界标准的色谱进样和切换阀，提供3至14端口多种配置。工作在两个位置之间(加载/进样)，适用于样品注入、反吹和柱切换。支持手动、气动和电动执行，电动型支持RS-232远程控制，是气相和液相色谱系统的核心组件。
