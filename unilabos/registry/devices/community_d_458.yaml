  name: eDAQ IsoPod隔离式传感器数据记录仪
  description: eDAQ IsoPod是微型电隔离传感器数据记录仪，每通道隔离度超过250Vrms，有效消除信号噪声和串扰。支持pH、电导率、温度、溶解氧等多种传感器，USB直连电脑。配套Pod-Vu软件记录数据，兼容LabVIEW，适用于化学和生物实验连续监测。
  manufacturer: eDAQ
  tags: &id001
  - 数据采集与记录仪
  category: *id001
  model:
    name: eDAQ IsoPod隔离式传感器数据记录仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    隔离度: '>250Vrms'
    传感器类型: pH/电导率/温度/溶解氧/生物传感器
    接口: USB(虚拟COM端口)
    软件: Pod-Vu
    兼容: LabVIEW
    pH输入范围: ±2000mV
    电导率范围: 0.002-200mS
    品牌: eDAQ
