  name: Ohaus Explorer EX225D/AD 半微量天平
  description: Ohaus Explorer EX225D/AD是双量程半微量天平,在120g范围内提供0.01mg可读性,220g范围内0.1mg可读性。搭载AutoCal双砝码线性自动校准系统,配备5.7寸VGA触摸屏和QWERTY键盘,内置离子风机消除静电。模块化设计允许显示屏与底座分离,四个触摸传感器自动开启防风门并激活离子风机,产品已停产。
