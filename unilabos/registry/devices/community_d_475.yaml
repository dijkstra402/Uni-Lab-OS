  name: AMI Model 430 超导磁铁电源程控器
  description: AMI Model 430是American Magnetics公司生产的超导磁铁电源程控器，专为控制和管理超导磁铁电源设计。该仪器具备数字化精密电流/磁场斫率控制能力，支持持续模式开关加热器管理、失超检测保护，以及多段电流扫描编程功能。广泛应用于NMR/MRI系统、高磁场物理实验和低温超导研究等领域。支持GPIB、RS-232和以太网远程通信。
