  name: Model 4G 双极性超导磁铁电源
  description: Cryomagnetics Model 4G是一款真双极性超导磁铁电源，支持平滑通过零点的电流扫描。提供100A、150A和200A多种型号选择，电流可设定精度达0.1mA，稳定性优于±0.005%。配备全彩TFT
    LCD显示屏，支持USB、以太网和IEEE-488.2通信接口。内置持续开关加热器电源和失超检测保护功能，提供五个可定制的扫描速率范围，广泛应用于超导磁铁系统的精密电流控制。
