  name: 83650A 合成扫频信号发生器
  description: HP 83650A是Hewlett-Packard 8360系列的高性能合成扫频信号发生器，频率覆盖10MHz至50GHz，频率分辨率1Hz。该仪器以高频谱纯度和低相位噪声著称，支持步进、列表和模拟斜坡扫频模式。内置脉冲调制，支持AM、FM和相位调制。广泛应用于雷达测试、电子战、通信系统测试和天线测量等领域。该产品已停产，Keysight推荐E8257D
    PSG模拟信号发生器作为替代。
