  name: Harvard Apparatus PHD 2000 注射泵
  description: Harvard Apparatus PHD 2000是经典可编程注射泵系列,包括注射型、注射/抽取型和可编程型三款。微处理器控制步进电机驱动,内置主要厂商注射器尺寸查找表和光学运动检测器。可编程型支持存储4组9步程序序列,可配2/4/6/10支注射器架。RS-232和TTL接口支持远程控制,已由PHD
    ULTRA触屏系列替代。
