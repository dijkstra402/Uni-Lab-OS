  name: DMM6500 6.5位触摸屏数字万用表
  description: Keithley DMM6500是一款6.5位台式/系统数字万用表，配备交互式5英寸触摸屏显示器。提供15种内置测量功能，包括数字化、电容和温度测量。支持波形捕获并可通过触摸屏捏合缩放查看数据。具有100nV电压灵敏度和10pA电流灵敏度，内置直方图、趋势图等图形分析功能。可通过选配扫描卡扩展至10个测量通道。支持SCPI和TSP编程，兼容KickStart软件和IoT云端监控。
