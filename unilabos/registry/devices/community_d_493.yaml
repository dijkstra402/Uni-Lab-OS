  name: DMM7510 7.5位图形采样万用表
  description: Keithley DMM7510是一款集高精度DMM、触摸屏显示器和高速数字化仪于一体的7.5位图形采样万用表。提供pA级电流灵敏度和1MS/s采样率，可跨五个数量级动态范围捕获电流波形（18位分辨率）。配备5英寸电容触摸屏，支持数据趋势、直方图和波形可视化。内置自动校准和带时间戳读数存储功能。支持TSP脚本和Python驱动，适用于半导体测试和精密校准实验室。
