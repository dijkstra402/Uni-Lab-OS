  name: Keysight N5230C PNA-L微波网络分析仪
  description: Keysight N5230C是PNA-L系列微波网络分析仪，专为通用网络分析需求设计，具有出色的性价比。提供多种频率配置选项，覆盖从300
    kHz到50 GHz的宽频段范围。配备8.4英寸触摸屏，采用直观的下拉菜单界面。具有110 dB系统动态范围和122 dB接收机动态范围，支持32001个测量点和32个通道。该产品已于2013年11月停产，替代产品为N523xA/B系列PNA-L网络分析仪。
  manufacturer: Keysight
