  name: Keysight N5232B PNA-L微波矢量网络分析仪
  description: Keysight N5232B是PNA-L系列微波矢量网络分析仪，工作频率覆盖300 kHz至20 GHz。配备2端口或4端口选项，内置单信号源，适用于无源元件和简单有源器件的基础分析测试。在成本敏感应用中提供出色的S参数测量精度。覆盖移动通信、无线LAN组件生产和航空航天国防等多个行业。多点触控显示屏和直观界面设计加速元件特性分析，还可配置用于信号完整性测量和材料特性表征。
  manufacturer: Keysight
