  name: Keysight N5245A PNA-X微波矢量网络分析仪
  description: Keysight N5245A是PNA-X系列50 GHz微波矢量网络分析仪，被誉为世界上最集成和灵活的单连接微波测试引擎。该产品可替代多台设备的组合，简化测试站配置。提供广泛的单连接测量应用，包括S参数、噪声系数、压缩、互调失真等，能够更准确地测试线性和非线性器件特性。该产品现已停产，替代型号为N5245B，用户可通过升级至B型号恢复完整支持服务。
  manufacturer: Keysight
