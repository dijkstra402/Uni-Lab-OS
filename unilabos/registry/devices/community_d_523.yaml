  name: Keysight N6705B模块化直流电源分析仪
  description: Keysight N6705B是一款模块化直流电源分析仪，集成电源、数字万用表、示波器、任意波形发生器和数据记录仪五种功能于一体。可容纳最多4个直流电源模块，提供高达600W总输出功率，超过30种模块可选。具备18位高精度电压电流测量能力，支持前面板直接操作或通过14585A软件控制。4
    GB非易失性存储支持长时间数据记录。该产品已停产，替代型号为N6705C。
  manufacturer: Keysight
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: Keysight N6705B模块化直流电源分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    槽位数: '4'
    总功率: 600 W
    电压表精度: 0.025%+50 uV(18位)
    电流表精度: 0.025%+8 nA(18位)
    ARB带宽: 100 kHz
    示波器采样率: 200 kHz/512 kpts
    数据记录间隔: 20 us至60 s
    存储: 4 GB
    接口: GPIB/USB/LAN(LXI)
    状态: 已停产(替代型号N6705C)
    品牌: Keysight
  cover: Keysight N6705B模块化直流电源分析仪.webp
