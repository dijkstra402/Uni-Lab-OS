  name: Quantum Design DynaCool 物性测量系统
  description: Quantum Design PPMS DynaCool是一套无液氦制冷的自动化材料特性表征系统，采用单级双级脉冲管制冷器同时冷却超导磁体和温控系统，提供低振动测量环境。温度范围1.8
    K至400 K，可选9 T、12 T或14 T超导磁体。支持多种测量选件，包括振动样品磁强计(VSM)、比热、交直流电输运、热输运、交流磁化率等。可通过稀释制冷机扩展至50
    mK超低温测量，广泛应用于材料电学、热学、磁学特性研究。
  manufacturer: Quantum Design
  tags: &id001
  - 热分析相关仪器
