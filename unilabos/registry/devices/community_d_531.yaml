  model:
    name: Quantum Design DynaCool 物性测量系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温度范围: 1.8 K - 400 K
    磁体选项: 9 T / 12 T / 14 T超导磁体
    冷却方式: 无液氦脉冲管制冷
    真空度: <10⁻⁴ Torr
    电子架构: CAN总线
