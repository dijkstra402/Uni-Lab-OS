  name: Rigol DG1062Z 函数/任意波形发生器
  description: Rigol DG1062Z是一款双通道60 MHz函数/任意波形发生器，采用RIGOL创新SiFi(信号保真)技术实现逐点波形生成，有效降低传统DDS信号源的抖动至200
    ps。具备14位垂直分辨率和200 MSa/s采样率，内置160余种标准波形。支持AM/FM/PM/ASK/FSK/PSK/PWM调制，具有扫频、脉冲串、谐波发生(8次)和7位频率计数器等功能，适用于教育、研发和生产测试等多种环境。
  manufacturer: Rigol
