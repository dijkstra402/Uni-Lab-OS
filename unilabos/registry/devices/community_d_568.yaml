  name: Copper Mountain S5048 矢量网络分析仪
  description: Copper Mountain S5048是紧凑型便携式矢量网络分析仪,频率覆盖20 kHz至4.8 GHz,仅重1.3 kg,可电池供电。由RF测量模块和S2软件组成,通过USB连接Windows或Linux
    PC运行。动态范围达140 dB,提供时域门控、嵌入/去嵌入、频偏模式等完整分析功能。支持Python、MATLAB、LabVIEW等自动化接口。该产品已于2020年6月30日停售。
