  name: Huber CC-505 冷热循环器
  description: Huber CC-505是紧凑型冷热循环器,温度范围覆盖-40°C至+200°C,采用环保制冷剂和自优化级联控制算法实现快速精确的温度调节。配备Pilot
    ONE直觉式彩色触摸屏控制器,支持RS232/USB和可选Ethernet远程通信。内置过温和液位保护,适用于反应器、旋转蒸发仪和分析仪器等外部闭环循环温控应用。
