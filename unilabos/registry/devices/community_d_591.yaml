  name: Oxford Instruments ILM200 智能低温液位计
  description: Oxford Instruments ILM200是智能低温液位计，用于测量液氦和液氮的液位，支持脉冲和连续测量模式，具备自动填充功能和ISOBUS通信接口，可与其他Oxford仪器并联管理，广泛用于低温物理实验系统。
