  name: Santec TSL-580 高性能可调谐激光器
  description: Santec TSL-580是第8代高性能高速波长可调谐激光光源，采用全新设计的激光谐振腔和控制电路，实现了超过+15dBm的峰值CW光输出功率，具有窄线宽和高线性度，适用于下一代光子学研究和高插入损耗光学器件评估。
