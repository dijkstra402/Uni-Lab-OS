  name: Stanford Research Systems SR844 射频锁相放大器
  description: SRS SR844是一款宽带射频锁相放大器，频率覆盖25kHz至200MHz，提供最高80dB无漂移动态储备。具备50Ω和1MΩ双输入模式，支持最高60dB射频衰减或20dB增益选择，内置16000点双通道数据缓冲，适用于射频信号恢复、NMR/ESR光谱和光学外差检测等应用。
  manufacturer: Stanford Research Systems
  tags: &id001
  - 锁相放大器与微弱信号检测
  category: *id001
  model:
    name: Stanford Research Systems SR844 射频锁相放大器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 25kHz-200MHz
    灵敏度: 100nV-1V(RMS)
    动态储备: 最高80dB
    时间常数: 100µs-30s
    输入阻抗: 50Ω/1MΩ可选
    输出: X/Y/R/θ(±10V满刻度)
    接口: GPIB(IEEE-488)/RS-232
    数据缓冲: 16000点×2通道
    品牌: Stanford Research Systems
