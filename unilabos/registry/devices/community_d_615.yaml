  name: Tektronix AWG520 任意波形发生器
  description: Tektronix AWG520是一款高性能双通道任意波形发生器，具有10位垂直分辨率和最高1GHz采样率。支持连续、触发、门控和增强四种工作模式，配备实时序列功能可链接多个波形文件生成近乎无限长度的波形，内置10GB硬盘用于海量数据存储。
  manufacturer: Tektronix
  tags: &id001
  - 信号源与发生器
  category: *id001
  model:
    name: Tektronix AWG520 任意波形发生器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: 2模拟通道
    DAC分辨率: 10位
    采样频率: 50kHz-1GHz
    波形长度: 256-4194048点
    上升/下降时间: ≤1.5ns
    带宽: 300MHz(-3dB)
    输出阻抗: 50Ω
    数字输出: 10位(选件03)
    功耗: 600W
    重量: 17kg
    品牌: Tektronix
