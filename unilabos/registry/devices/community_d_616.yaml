  name: Tektronix FCA3100系列频率计数器/定时器/分析仪
  description: Tektronix FCA3100是一款多功能频率计数器/定时器/分析仪，提供12位/秒频率分辨率和50ps单次时间分辨率。支持13种自动测量功能和TrendPlot、Allan偏差等分析模式，具备零死时间连续时间戳功能，内置大容量存储器，适用于高精度频率和时间测量。
  manufacturer: Tektronix
  tags: &id001
  - 数据采集与记录仪
  category: *id001
  model:
    name: Tektronix FCA3100系列频率计数器/定时器/分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    最大频率: 300MHz(2通道)
    时间分辨率: 50ps(单次)
    频率分辨率: 12位/s
    电压分辨率: 1mV
    自动测量: 13种(含频率/周期/时间间隔等)
    分析模式: TrendPlot/统计/Allan偏差/直方图
    接口: USB/GPIB
    数据吞吐: 250k样本/s
    品牌: Tektronix
