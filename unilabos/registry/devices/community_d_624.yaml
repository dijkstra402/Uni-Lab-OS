  name: Rohde & Schwarz ZNLE4 矢量网络分析仪
  description: R&S ZNLE4是ZNLE系列矢量网络分析仪的4.5GHz版本，提供全双端口S参数测量能力。具有极低的迹线噪声和高灵敏度，支持时域分析和故障定位选件，10.1英寸触摸屏操作便捷，紧凑轻量设计适合实验室和生产测试环境。
  manufacturer: Rohde & Schwarz
