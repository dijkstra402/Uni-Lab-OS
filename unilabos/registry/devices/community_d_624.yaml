    name: Rohde & Schwarz ZNLE4 矢量网络分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 1MHz-4.5GHz(可扩展至100kHz)
    端口数: '2'
    迹线噪声: 典型0.001dB(@10kHz带宽)
    IF带宽: 1Hz-500kHz
    灵敏度: 120dBm
