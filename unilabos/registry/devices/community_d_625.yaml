  name: Rohde & Schwarz ZNLE6 矢量网络分析仪
  description: R&S ZNLE6是ZNLE系列中频率最高的6GHz版本矢量网络分析仪，适用于更宽频段的无源器件测试。具备全部ZNLE系列特性，包括低迹线噪声、自动校准单元支持和嵌入/去嵌入功能，是教育科研和生产测试的经济高效选择。
  manufacturer: Rohde & Schwarz
  tags: &id001
  - 频谱与网络分析仪
  category: *id001
  model:
    name: Rohde & Schwarz ZNLE6 矢量网络分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    频率范围: 1MHz-6GHz(可扩展至100kHz)
    端口数: '2'
    迹线噪声: 典型0.001dB(@10kHz带宽)
    IF带宽: 1Hz-500kHz
    灵敏度: 120dBm
    测试端口连接器: N(f)
    显示: 10.1英寸触摸屏
    系统: Windows 10
    接口: USB/LAN/GPIB(可选)
    重量: 约6kg
    品牌: Rohde & Schwarz
