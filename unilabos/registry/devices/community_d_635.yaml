  name: Thorlabs BPC001 单通道台式压电控制器
  description: Thorlabs BPC001是一款单通道150V高功率台式压电控制器，提供开环和闭环纳米级位置控制。设计用于驱动全系列开环和闭环压电纳米定位执行器和平台，内置波形发生和触发输出功能适合扫描应用。前面板数字调节电位器可手动调整压电位置。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs BPC001 单通道台式压电控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '1'
    输出电压: 75-150V可选
    最大输出电流: 0.5A
    控制模式: 开环/闭环
    显示: 电压或位置(微米)
    波形发生: 内置
    触发输出: 支持
    接口: USB
    软件: APT/Kinesis
    品牌: Thorlabs
