  name: Thermo NESLAB RTE-740/RTE-111 制冷加热循环浴
  description: Thermo NESLAB RTE系列是经典的制冷加热循环浴，RTE-740温度范围-40°C至200°C，RTE-111温度范围-25°C至150°C，均具有±0.01°C的出色温度稳定性。采用无CFC风冷制冷系统，配备微处理器PID控制器和数字显示。组合式压力-吸力泵可同时为开放容器和封闭回路系统提供循环。适用于激光、冷凝器、旋转蒸发仪、反应器和分析仪器等多种温控应用。
  manufacturer: Thermo Scientific
  tags: &id001
  - 高低温循环装置
  category: *id001
  model:
    name: Thermo NESLAB RTE-740/RTE-111 制冷加热循环浴
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    RTE-740温度范围: -40~200°C
    RTE-111温度范围: -25~150°C
    温度稳定性: ±0.01°C
    制冷量(20°C): 800W
    加热功率: 800W
    浴槽容积: 7.0L
    泵流量: 15LPM
    最大泵扬程: 4.9m
    制冷剂: R404a
    接口: RS-232/RS-485
    重量: 39kg
    品牌: Thermo Scientific
