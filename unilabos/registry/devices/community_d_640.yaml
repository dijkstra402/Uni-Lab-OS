  name: Thorlabs BMS001 单通道台式步进电机控制器
  description: Thorlabs BMS001是一款单通道台式步进电机控制器，适用于驱动高功率双相双极步进电机。支持编码器反馈进行闭环位置控制，提供梯形和S形速度曲线选择。USB即插即用连接，可通过APT/Kinesis软件实现复杂运动序列编程，支持多轴控制通过USB集线器。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs BMS001 单通道台式步进电机控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '1'
    电机类型: 双相双极步进电机
    微步分辨率: 2048微步/全步
    电机驱动: 15针D型输出
    编码器: 差分正交编码器
    速度曲线: 梯形/S形
    接口: USB
    软件: APT/Kinesis
    品牌: Thorlabs
