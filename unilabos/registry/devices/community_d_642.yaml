  name: Thorlabs BDC101 单通道台式直流伺服电机控制器
  description: Thorlabs BDC101是一款单通道台式直流伺服电机控制器，采用编码器闭环位置控制。支持可编程速度曲线和点动/归位功能，前面板配备LCD显示屏和调速轮便于手动操作。USB连接PC实现远程控制，兼容Kinesis/APT软件，适用于Z8系列等DC伺服执行器。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs BDC101 单通道台式直流伺服电机控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '1'
    电机类型: 直流伺服电机
    反馈: 编码器闭环
    速度曲线: 可编程
    前面板: LCD显示/调速轮/点动按钮
    接口: USB 2.0
    供电: 15VDC
