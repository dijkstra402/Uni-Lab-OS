  name: Thorlabs TPA101 T-Cube光束位置对准器
  description: Thorlabs TPA101是一款T-Cube光束位置对准器，配合PDP和PDQ系列四象限探测器使用。输出X/Y差分信号和总和信号，支持监测、开环和闭环三种工作模式。闭环模式下通过PID控制环路驱动压电定位元件自动将光束对准探测器中心，适用于光束稳定和自动对准应用。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs TPA101 T-Cube光束位置对准器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    兼容探测器: PDQ80A(Si,400-1050nm)/PDQ30C(InGaAs,1000-1700nm)/PDP90A
    输出: XDIFF/YDIFF(-10至>10V)/SUM(0至>10V)
    控制模式: 监测/开环/闭环
    连接器: SMA/HIROSE
    尺寸: 60×60×47mm
    供电: ±15V/5V
    品牌: Thorlabs
