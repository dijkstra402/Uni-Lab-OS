  name: Thorlabs TQD001 T-Cube PSD自动对准四象限探测器控制器
  description: Thorlabs TQD001是一款T-Cube PSD自动对准控制器，设计用于配合PDP和PDQ系列四象限探测器。内置DSP处理器运行两个独立的PID反馈环路分别控制X和Y轴，可驱动压电转向镜自动将光束居中于四象限探测器。支持与TPZ001等压电控制器配合使用。
  manufacturer: Thorlabs
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Thorlabs TQD001 T-Cube PSD自动对准四象限探测器控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    X/Y差分输出: SMA(-10至>10V)
    总和输出: SMA(0至>10V)
    X/Y位置需求输出: SMA(0至>10V)
    兼容探测器: PDQ80A(Si)/PDQ30C(InGaAs)/PDP90A
    控制模式: 监测/开环/闭环
    尺寸: 60×60×47mm
    接口: USB
    品牌: Thorlabs
  cover: Thorlabs TQD001 T-Cube PSD自动对准四象限探测器控制器.webp
