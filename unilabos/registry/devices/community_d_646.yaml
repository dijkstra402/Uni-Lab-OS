  name: Thorlabs KLS101 K-Cube LED/光源驱动器
  description: Thorlabs KLS101是一款紧凑型K-Cube LED/光源驱动器，提供最大1000mA恒流输出驱动Thorlabs各类安装LED和光源。前面板配有数字显示屏和控制按钮，支持软件可调电流限值保护LED。USB连接兼容Kinesis/APT软件，支持内部和外部调制功能。
  manufacturer: Thorlabs
  tags: &id001
  - 仪用光源
  category: *id001
  model:
    name: Thorlabs KLS101 K-Cube LED/光源驱动器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    电流范围: 0-1000mA
    电压顺从: ~5V
    控制模式: 恒流驱动
    调制: 内部/外部
    接口: USB
    尺寸: ~60×60×49.5mm
    显示: 前面板数字显示
    软件: APT/Kinesis
    品牌: Thorlabs
