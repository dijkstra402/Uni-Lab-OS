  name: Gilson Minipuls 3 蠕动泵
  description: Gilson Minipuls 3是一款精密多通道蠕动泵，转速低至0.01RPM，流量可精确控制至亚微升级别。多通道设计(最多8通道)可同时输送多路液体，适合ICP/AAS样品引入和流动注射分析。采用GSIOC通信协议，可与其他Gilson仪器无缝集成组建自动化系统。卡盒式泵头设计便于快速安装和更换管路，低脉动特性确保分析精度。广泛应用于分析化学、环境监测和制药领域。
  manufacturer: Gilson
  tags: &id001
  - 蠕动泵
  category: *id001
  model:
    name: Gilson Minipuls 3 蠕动泵
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    流量范围: 0.0001~40mL/min
    转速范围: 0.01~48RPM
    通道数: 2/4/6/8通道可选
    管径: 0.13~3.18mm
    通信: RS-232(GSIOC协议)
    品牌: Gilson
  quality_review:
    grade: B
    status: needs_sdk
    note: 'Gilson Minipuls 3: 1177 行 PumpControlUI 自研控制 + GUI; 含完整串口逻辑'
    reviewed_at: '2026-04-26'
