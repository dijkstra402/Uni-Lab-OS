  name: Lake Shore 235低温温度控制器
  description: Lake Shore 235是一款单通道低温温度控制器，专为低温环境设计，支持硅二极管、铂RTD和Cernox等多种传感器，内置完整PID温度控制和可配置加热器输出，提供RS-232或USB数字接口实现远程操控，适用于低温恒温器和材料表征。
  manufacturer: Lake Shore
  tags: &id001
  - 低温温度控制器
  category: *id001
  model:
    name: Lake Shore 235低温温度控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道数: '1'
    温度范围: 1.4K-1000K
    传感器: 硅二极管/铂RTD/Cernox/热电偶
    控制: PID
    接口: RS-232/USB
    加热器输出: 可配置
    品牌: Lake Shore
