  name: Sirah Matisse连续波单频可调谐环形激光器
  description: Sirah Matisse是一款连续波单频可调谐环形激光器系列，提供Ti:Sapphire和染料激光器两种配置，线宽可低至1kHz以下，通过腔内标准具和双折射滤波器实现单模运行，支持外部参考腔锁定实现超窄线宽输出，适用于高分辨率光谱学研究。
  manufacturer: Sirah
  tags: &id001
  - 液体激光器
  category: *id001
  model:
    name: Sirah Matisse连续波单频可调谐环形激光器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    类型: CW单频环形激光器
    Ti: 'Sapphire版调谐范围: 670-1050nm'
    染料版调谐范围: 380-900nm
    线宽: <20kHz (主动稳定后<1kHz)
    无跳模调谐: '>30-50GHz'
    功率: 数百mW至>1W
    品牌: Sirah
