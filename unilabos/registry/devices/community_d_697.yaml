  name: Trinamic TMCM-1110 StepRocker单轴步进电机控制器/驱动器
  description: Trinamic TMCM-1110 StepRocker是低成本单轴两相双极步进电机控制器/驱动模块，基于TMC429控制器和TMC262驱动器芯片组合，配备ARM
    Cortex-M4处理器，支持StallGuard2失步检测和CoolStep节能技术，256微步细分，可扩展为三轴系统。
  manufacturer: Trinamic
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Trinamic TMCM-1110 StepRocker单轴步进电机控制器/驱动器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: '1'
    电流: 最高4A (带散热)
    电压: 10-30V
    接口: RS485/USB/S-D/编码器
    微步: 256 (MicroPlyer)
    芯片: TMC429+TMC262
    处理器: ARM Cortex-M4
    通信: TMCL协议
    品牌: Trinamic
