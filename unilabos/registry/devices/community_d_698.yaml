  name: Trinamic TMCM-3110三轴步进电机控制器/驱动器模块
  description: Trinamic TMCM-3110是高集成度三轴步进电机控制器/驱动模块，每轴支持2.8A RMS电流和52V供电，配备StallGuard2无传感器负载检测、CoolStep节能和SpreadCycle斩波技术，支持RS485/CAN/USB三种通信接口，TMCL编程实现独立运行。
  manufacturer: Trinamic
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Trinamic TMCM-3110三轴步进电机控制器/驱动器模块
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: '3'
    电流: 2.8A RMS (4A峰值带散热)
    电压: 9-52V
    接口: RS485/CAN/USB
    IO: 8输入+8输出
    编码器: 每轴增量编码器
    尺寸: 130×100mm
    通信: TMCL协议
    品牌: Trinamic
