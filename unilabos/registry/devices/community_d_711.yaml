  name: EPC-04 Electronic Polarization Controller
  description: OZOptics EPC-04电子偏振控制器使用电驱动元件调整光纤中光的偏振态，广泛应用于偏振模色散补偿、相干通信系统、光纤传感、实验室偏振态控制和偏振扰频。
  manufacturer: OZOptics
  tags: &id001
  - 光学组件
  category: *id001
  model:
    name: EPC-04 Electronic Polarization Controller
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    工作波长范围: '1260-1650nm (覆盖O/S/C/L波段), 插入损耗: <1dB, 回波损耗: >50dB, 控制类型: 电子(电压驱动), 偏振覆盖:
      全庞加莱球覆盖, 响应速度: 毫秒到微秒级, 光纤类型: 单模光纤(SMF-28兼容), 连接器: FC/PC, FC/APC, SC等可选, 接口:
      USB/RS-232或其他数字控制接口'
    品牌: OZOptics
