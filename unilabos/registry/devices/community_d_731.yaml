  name: Coherent OBIS智能激光模块系列
  description: Coherent OBIS是一系列即插即用智能激光模块，波长覆盖375nm至785nm紫外到近红外，集成控制电子器件实现免调试操作，内置模拟和数字调制功能，USB和RS-232双接口控制，各波长统一紧凑外形和光束指向，广泛用于流式细胞术和共聚焦显微镜。
