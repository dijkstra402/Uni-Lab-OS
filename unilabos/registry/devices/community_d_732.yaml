  name: Coherent Sapphire光泵半导体激光器
  description: Coherent Sapphire是单频连续波光泵半导体激光器系列，提供460nm至561nm多种可见光波长，TEM00近衍射极限光束质量（M²<1.1），超低噪声和优异指向稳定性，紧凑设计集成控制器，预热仅5分钟，适用于流式细胞术、拉曼光谱和共聚焦显微镜。
  manufacturer: Coherent
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Coherent Sapphire光泵半导体激光器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长: 460/473/488/514/532/561nm等
    功率: 20mW-1W+
    光束质量: TEM00 M²<1.1
    噪声: <0.25% RMS
    偏振: '>100:1线偏振'
    预热: ~5分钟
    寿命: '>10000小时'
    品牌: Coherent
