  name: Prior ProScanIII 显微镜自动化控制器
  description: Prior ProScanIII是可编程显微镜载物台和聚焦控制器，支持电动XY载物台和Z轴聚焦驱动，具备亚微米定位精度，集成手柄控制，兼容MetaMorph、µManager等主流成像软件。
  manufacturer: Prior Scientific
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Prior ProScanIII 显微镜自动化控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制轴数: 最多3轴(X/Y/Z)
    通信接口: RS-232串口/USB
    分辨率: 亚微米级(0.01µm)
    外设支持: 滤光片轮/快门
    触发: TTL输入输出
    协议: ASCII命令集
    品牌: Prior Scientific
