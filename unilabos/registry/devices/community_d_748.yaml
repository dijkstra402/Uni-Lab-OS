  name: Omicron LuxX 高性能半导体激光器
  description: Omicron LuxX是超紧凑高性能连续波半导体激光器系列，覆盖375-830nm共20种波长，集成智能电子器件支持RS-232和USB控制，具备>150kHz快速开关能力和自动老化补偿功能，尺寸仅40×40×100mm。
