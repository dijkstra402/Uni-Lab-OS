  name: Omicron PhoxX Diode Laser
  description: PhoxX是Omicron-Laserage (现Coherent旗下) 生产的紧凑型半导体激光模块，专为荧光显微镜、共聚焦显微镜、流式细胞术、光谱学等生物光子学应用设计。以小巧外形、优异光束质量和精确波长选项著称。
  manufacturer: Omicron
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Omicron PhoxX Diode Laser
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    类型: 紧凑型半导体激光模块
    波长范围: '375-785nm (多种波长可选: 375nm, 405nm, 445nm, 488nm, 510nm, 638nm, 660nm, 785nm)'
    输出功率: 数十至数百毫瓦 (取决于波长)
    调制: 直接模拟和数字(TTL)调制，调制速度高达150MHz
    光束质量: 圆形TEM00光束
    指向稳定性: 优异
    功率稳定性: 优异
    品牌: Omicron
  cover: Omicron PhoxX Diode Laser.webp
