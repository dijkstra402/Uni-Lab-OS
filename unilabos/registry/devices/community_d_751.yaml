  name: Omicron BrixX Diode Laser
  description: BrixX是Omicron-Laserage (现Coherent旗下) 的高性能半导体激光器系列，广泛应用于荧光显微镜、流式细胞术、拉曼光谱、光遗传学、共聚焦显微镜和超分辨率成像。
  manufacturer: Omicron
  tags: &id001
  - 半导体激光器
  category: *id001
  model:
    name: Omicron BrixX Diode Laser
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    激光类型: 单模半导体激光器
    波长范围: 375-785nm (405nm, 445nm, 488nm, 520nm, 638nm, 660nm, 785nm)
    输出功率: 50mW至500mW+ (取决于波长)
    光束质量: 高光束质量TEM00模式
    调制: 直接模拟和数字调制，快速切换
    功率稳定性: <0.5%噪声
    调制带宽: MHz范围
    接口: USB/RS-232
    品牌: Omicron
  cover: Omicron BrixX Diode Laser.webp
