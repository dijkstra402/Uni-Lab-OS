  name: Princeton Instruments SpectraPro SP-2150i Spectrograph
  description: SpectraPro SP-2150i是Princeton Instruments的紧凑型成像光谱仪，采用150mm焦距和f/4.0高通量设计，适用于拉曼光谱、荧光光谱、等离子体诊断和通用光谱分析。
  manufacturer: Princeton Instruments
  tags: &id001
  - 光栅摄谱仪
  category: *id001
  model:
    name: Princeton Instruments SpectraPro SP-2150i Spectrograph
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    焦距: 150mm
    光圈比: f/4.0
    光学设计: Czerny-Turner成像光谱仪
    光栅转塔: 三光栅
    波长范围: UV至近红外(取决于光栅)
    分辨率: 亚纳米级(取决于光栅)
    波长精度: +-0.2nm
    波长重复性: +-0.05nm
    兼容: PIXIS/PI-MAX/PyLoN相机
    软件: LightField
    品牌: Princeton Instruments
