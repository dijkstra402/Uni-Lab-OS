  name: Trinamic TMCM-1211 STEPROCKER Stepper Motor Controller/Driver Module
  description: TMCM-1211 STEPROCKER是Trinamic (现属Analog Devices) 的单轴步进电机控制器/驱动模块，支持10-30V、5.7A
    RMS电流。内置SixPoint斜坡控制器，支持StealthChop静音操作。适用于实验室自动化、制造和机器人。
  manufacturer: Trinamic
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: Trinamic TMCM-1211 STEPROCKER Stepper Motor Controller/Driver Module
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: 1 (2相双极步进电机)
    电源电压: 10-30V DC
    电机电流: 最高5.7A RMS
    微步: 最高256
    接口: USB, S/D, RS485
    品牌: Trinamic
