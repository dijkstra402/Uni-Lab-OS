  name: PiezoMotor PMD401 Piezo LEGS压电电机控制器
  description: PiezoMotor PMD401是全功能微型单轴Piezo LEGS压电电机控制器，支持8192微步实现亚纳米定位分辨率，可通过RS485菊花链组成多轴系统，支持开环、闭环和伺服三种运行模式，适合OEM集成应用。
  manufacturer: PiezoMotor
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: PiezoMotor PMD401 Piezo LEGS压电电机控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: 1(RS485可链接多轴)
    分辨率: 8192微步(亚纳米)
    最大步频: 1500Hz
    编码器支持: 正交/SSI/BiSS
    通信: RS485
    模式: 开环/闭环/伺服
    尺寸: 微型PCB
    品牌: PiezoMotor
