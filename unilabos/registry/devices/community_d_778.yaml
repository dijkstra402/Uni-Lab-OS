  name: PiezoMotor PMD301 Piezo LEGS压电电机控制器
  description: PiezoMotor PMD301是独立封装的多功能Piezo LEGS压电电机控制器，支持40N以上电机和高速运行，8192微步亚纳米分辨率，具备RS485和USB双通信接口，支持正交/SSI/BiSS/模拟多种编码器和外部伺服控制。
  manufacturer: PiezoMotor
  tags: &id001
  - 运动控制系统
  category: *id001
  model:
    name: PiezoMotor PMD301 Piezo LEGS压电电机控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    轴数: 1(RS485/USB可链接多轴)
    分辨率: 8192微步(亚纳米)
    最大步频: 2500Hz
    编码器: 正交/SSI/BiSS/模拟
    通信: RS485/USB虚拟串口
    接口: 15针D-Sub
    伺服: SPI/模拟
    品牌: PiezoMotor
