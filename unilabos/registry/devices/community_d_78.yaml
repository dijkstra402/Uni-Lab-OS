  name: Universal Robots UR10 协作机器人
  description: Universal Robots UR10是UR经典系列中的大型协作机器人，10kg有效载荷和1300mm工作半径适合较重物品的搬运和较大范围的操作任务。±0.05mm重复精度满足包装码垛、机床上下料和大型工件装配需求。虽为最大型号但仍保持协作安全特性，内置力/扭矩感应实现碰撞检测。PolyScope编程界面保持一致的用户体验，支持任意方向安装，是替代传统工业机器人的高性价比方案。
