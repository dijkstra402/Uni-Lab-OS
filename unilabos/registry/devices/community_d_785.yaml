  name: NI PCIe-6361 X系列多功能数据采集卡
  description: NI PCIe-6361是X系列高性能多功能数据采集卡，提供16路16位模拟输入(2MS/s)、2路模拟输出(2.86MS/s)、24路数字I/O和4个32位计数器，采用NI-STC3时序同步技术，支持独立模拟和数字定时引擎。
  manufacturer: National Instruments
  tags: &id001
  - 数据采集与记录仪
  category: *id001
  model:
    name: NI PCIe-6361 X系列多功能数据采集卡
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    模拟输入: 16路SE/8路差分(16bit/2MS/s)
    模拟输出: 2路(16bit/2.86MS/s)
    数字I/O: 24路(10MHz)
    计数器: 4个32bit(100MHz)
    总线: PCIe
    触发: 模拟边沿/窗口
    品牌: National Instruments
