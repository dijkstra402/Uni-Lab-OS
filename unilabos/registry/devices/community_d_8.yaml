  name: Sartorius EA/EB/GD/GE/TE系列电子天平
  description: Sartorius EA/EB/GD/GE/TE系列涵盖从半微量到精密称量的多种电子天平。EA系列为入门级分析天平，EB系列为基础精密天平，GD系列为高精度半微量/分析天平(配备isoCAL内部校准)，GE系列为扩展精密天平，TE系列为顶装式精密天平。这些系列多为已停产的遗留产品，现已被Quintix/Secura/Cubis
    II等新系列取代。通过RS-232串口通信，支持MT-SICS兼容协议。
  manufacturer: Sartorius
  tags: &id001
  - 电子天平
  category: *id001
  model:
    name: Sartorius EA/EB/GD/GE/TE系列电子天平
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    系列覆盖: 分析天平/精密天平/半微量天平
    可读性: 0.001mg-0.1g(按系列)
    称量范围: 60g-14000g(按型号)
    通信协议: SBI/RS-232串口
    显示: LCD
    品牌: Sartorius
