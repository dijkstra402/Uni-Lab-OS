  name: Anritsu MS9710C 光谱分析仪
  description: Anritsu MS9710C是衍射光栅型光谱分析仪，波长覆盖600至1750 nm，具备出色的波长精度和宽动态范围，可测量最多300个DWDM通道的波长、功率和信噪比，支持LD/LED光谱测量和光纤放大器NF/增益测量，L波段性能经过优化增强。
  manufacturer: Anritsu
  tags: &id001
  - 近红外光谱仪
  category: *id001
  model:
    name: Anritsu MS9710C 光谱分析仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 600~1750 nm
    波长精度: ±20 pm(1530~1570 nm)
    波长分辨率: 50 pm
    动态范围: 42~70 dB
    DWDM通道: 最多300个
    接口: GPIB
    品牌: Anritsu
