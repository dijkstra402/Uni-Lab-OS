  name: INFICON SQM-160 薄膜沉积速率/厚度监控仪
  description: INFICON SQM-160采用石英晶体传感器技术测量薄膜沉积过程中的速率和厚度，标准2路传感器输入可扩展至6路，厚度分辨率高达0.037埃（高分辨率版本），可存储99种薄膜参数，支持4路继电器输出控制快门，配备Windows软件进行远程设置和数据保存。
  manufacturer: Inficon
  tags: &id001
  - 蒸镀仪
  category: *id001
  model:
    name: INFICON SQM-160 薄膜沉积速率/厚度监控仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    标准传感器输入: 2个(可扩展至6个)
    频率范围: 1.0~6.5 MHz
    厚度分辨率: ±0.37 Å(标准)/±0.037 Å(高分辨率)
    存储薄膜: 99种
    继电器输出: 4个
    模拟输出: 2个
    通信: RS-232/USB/以太网可选
    品牌: Inficon
