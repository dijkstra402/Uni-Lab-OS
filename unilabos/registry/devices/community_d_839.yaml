  name: IPG Photonics YAR 掺镱连续光纤放大器
  description: IPG Photonics YAR系列是掺镱连续光纤放大器，波长覆盖1030至1070 nm，LP-SF型提供线偏振单频输出功率最高100W，SM型可达4
    kW，光束质量M²<1.1，风冷设计免维护，19英寸机架安装，配备GPIB和RS-232接口，适用于光谱合束、传感探测和光学计量等应用。
