  name: Keithley 2510 TEC源表
  description: Keithley 2510是专用热电冷却器（TEC）控制源表，提供±5A双极性电流输出用于加热和制冷，支持多种温度传感器，PID闭环控制可实现毫开尔文级温度稳定性，广泛应用于激光二极管和光学元件测试。
  manufacturer: Tektronix
  tags: &id001
  - 电源与源表
  category: *id001
  model:
    name: Keithley 2510 TEC源表
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    TEC电流: ±5A
    顺从电压: ±10V
    电流分辨率: 50µA
    温度传感器: 热敏电阻/RTD/LM335
    控制模式: PID闭环
    温度稳定性: ±0.001°C
    接口: GPIB,RS-232
    品牌: Tektronix
