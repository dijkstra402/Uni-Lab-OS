  name: AQ6373可见光波长光谱分析仪
  description: 可见光波长光谱分析仪，覆盖可见光（350nm）至近红外（1200nm）范围，具有0.02nm高波长分辨率和高动态范围，适用于LED测试、激光二极管表征、显示和照明光源测量、生物医学光学研究和量子光学实验，支持单模和多模光纤，可选自由空间输入端口
