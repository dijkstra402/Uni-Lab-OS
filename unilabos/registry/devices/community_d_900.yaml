  name: Yokogawa AQ6375 Long Wavelength Optical Spectrum Analyzer
  description: AQ6375是横河公司推出的长波长光谱分析仪，专为近红外至中红外波段(1200-2400 nm)的光谱测量设计。该仪器采用高性能InGaAs探测器和衍射光栅技术，提供0.05
    nm的高波长分辨率和-70 dBm的高灵敏度。主要应用于光纤激光器表征、掺铥光纤放大器(TDFA)测试、气体传感、医疗激光测试和环境监测组件测试等领域。仪器配备彩色LCD显示屏和内置分析功能，支持GPIB、以太网和USB接口进行远程控制。
  manufacturer: Yokogawa
  tags: &id001
  - 光栅单色仪
  category: *id001
  model:
    name: Yokogawa AQ6375 Long Wavelength Optical Spectrum Analyzer
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1200-2400 nm
    波长分辨率: 0.05 nm
    波长精度: ±0.05 nm
    动态范围: 55 dB或更高(典型值)
    灵敏度: -70 dBm(典型值)
    电平精度: ±0.3 dB
    电平范围: -70 dBm至+20 dBm
    输入光纤类型: 单模光纤(SMF)
    测量技术: 基于衍射光栅的单色仪
    品牌: Yokogawa
