  name: Yokogawa AQ6375B Long Wavelength Optical Spectrum Analyzer
  description: AQ6375B是AQ6375的升级版本，是横河公司的长波长光谱分析仪，覆盖1200-2400 nm的扩展波长范围。相比前代产品，AQ6375B在动态范围(提升至70
    dB)、测量速度、近端分辨率和软件界面等方面均有改进。该仪器特别适用于光纤激光器表征、短波红外(SWIR)组件测试、掺铥光纤放大器测量、气体传感应用以及2微米波段的研究。仪器配备高性能衍射光栅单色仪和InGaAs探测器，内置SMSR、谱宽等分析功能，支持远程控制和自动化测试。
  manufacturer: Yokogawa
  tags: &id001
  - 光栅单色仪
  category: *id001
  model:
    name: Yokogawa AQ6375B Long Wavelength Optical Spectrum Analyzer
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1200-2400 nm
    波长分辨率: 0.05 nm(最佳分辨率)
    波长精度: ±0.05 nm
    动态范围: 高达70 dB(典型值)
    灵敏度: -70 dBm(典型值)
    电平精度: ±0.3 dB
    输入连接器: FC/PC或SC适配器
    显示器: 内置彩色LCD
    接口: GPIB、以太网、USB
    杂散光抑制: 高
    品牌: Yokogawa
