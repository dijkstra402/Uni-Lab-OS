  name: N9010A EXA Signal Analyzer, 10 Hz to 44 GHz
  description: 介于 CXA 和 PXA 之间的 X 系列中档信号分析仪。触摸屏前面板，多种测量应用（LTE、W-CDMA、WLAN、蓝牙），兼容 89600
    VSA 软件。 NFE 选项可将 DANL 提高约 8-10 dB。可选前置放大器和电子衰减器。 SCPI 远程编程。 [过时的]
  manufacturer: Keysight Technologies
  icon: agilent_n9010_a_wrapper.webp
  tags:
  - 介电常数测定仪
  category:
  - 介电常数测定仪
  device_params:
    Frequency Range: '10 Hz to 44 GHz (options: 503/507/513/526/544)'
    DANL: -172 dBm (with preamp, best)
    DANL @ 1 GHz: -154 dBm (preamp) / -148 to -150 dBm (no preamp)
    Phase Noise: -128 dBc/Hz @ 10 kHz offset (1 GHz)
    RBW: 1 Hz to 8 MHz
    Analysis BW: up to 25 MHz (expandable 40 MHz)
    Amplitude Accuracy: ±0.23 dB
    TOI: +17 to +23 dBm
    Attenuator: 0-70 dB (2 dB steps)
    Display: 8.4-inch XGA touchscreen (1024×768)
    Dimensions: 177 × 426 × 518 mm
    Weight: ~25 kg
    Interfaces: USB, LAN, GPIB
    品牌: Keysight Technologies
  model:
    name: N9010A EXA Signal Analyzer, 10 Hz to 44 GHz
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: Dielectric Measurement
  version: 1.0.0
  resource_type: device
