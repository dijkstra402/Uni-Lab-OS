  name: E8357A PNA Network Analyzer, 300 kHz to 6 GHz [Obsolete]
  description: PNA 系列网络分析仪用于高性能射频元件表征。全 2 端口 S 参数测量 (S11/S21/S12/S22)。 CW/步进/模拟扫描模式。选项：014/UNL（可配置测试装置）、080（频偏模式）、010（时域）。属于
    E835xA 系列的一部分。已停产，由 PNA-L/PNA-X 取代。 [过时的]
  manufacturer: Agilent Technologies
  icon: agilent_e8357_a.webp
  tags:
  - 介电常数测定仪
  category:
  - 介电常数测定仪
  device_params:
    Frequency Range: 300 kHz to 6 GHz
    Ports: 2-port (integrated S-param test set)
    Dynamic Range: '>123 dB (10 Hz IF BW)'
    Trace Noise: < 0.004 dB rms (1 kHz IF BW)
    Output Power: -90 dBm to +3 dBm
    IF Bandwidth: 1 Hz to 40 kHz
    Max Points: '16001'
    Sweep Speed: 26 µs/point
    Directivity: '>42 dB raw / >50 dB calibrated'
    Test Port Connector: 3.5 mm (male) / SMA compatible
    Impedance: 50Ω
    Display: 10.4-inch color
    Weight: 22 kg
    Dimensions: 432 × 221 × 556 mm
    OS: Windows
    Interfaces: GPIB, LAN, USB
    品牌: Agilent Technologies
  model:
    name: E8357A PNA Network Analyzer, 300 kHz to 6 GHz [Obsolete]
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: Dielectric Measurement
  version: 1.0.0
  resource_type: device
