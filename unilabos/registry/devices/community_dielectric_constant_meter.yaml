  name: E4406A VSA Transmitter Tester, 7 MHz to 4 GHz [Obsolete]
  description: VSA 系列发射机测试仪，用于无线发射机的制造测试。一键式测量 ACP/ACLR、EVM、频谱平坦度、占用带宽、SEM、通道功率。数字中频可实现高精度/可重复性。多种选项：BAC
    (CDMA)、BAE (GSM/EDGE)、BAF (W-CDMA)、B7C (80 MHz IF BW)、B7D（数字解调器）。原来是安捷伦，现在是德科技。
    [过时的]
  manufacturer: Agilent Technologies
  icon: agilent_e4406_a.webp
  tags:
  - 介电常数测定仪
  category:
  - 介电常数测定仪
  device_params:
    Frequency Range: 7 MHz to 4 GHz
    IF Bandwidth: up to 10 MHz (standard) / 80 MHz (Opt B7C)
    RBW: 1 Hz to 5 MHz
    Amplitude Range: -50 dBm to +30 dBm
    Dynamic Range: '>70 dB'
    DANL: ~-151 to -152 dBm/Hz
    TOI: ~+17 dBm
    Phase Noise: -113 dBc/Hz @ 10 kHz offset (1 GHz)
    Amplitude Accuracy: ±0.4 dB (absolute)
    EVM Residual: ~0.4%-1%
    Input: N-type 50Ω
    Freq Ref: 10 MHz OCXO
    Modulations: GSM/EDGE/cdmaOne/cdma2000/W-CDMA/1xEV-DO/802.11a/b/g/Bluetooth
    Interfaces: GPIB, RS-232, LAN
    品牌: Agilent Technologies
  model:
    name: E4406A VSA Transmitter Tester, 7 MHz to 4 GHz [Obsolete]
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: Dielectric Measurement
  version: 1.0.0
  resource_type: device
