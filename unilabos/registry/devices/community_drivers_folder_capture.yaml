  description: Capture class for reading images from a folder as a video stream
  category:
  - file_source
  init_param_schema:
    config:
      type: object
      properties:
        source:
          type: string
          default: null
        sort_by:
          type: string
          default: name
        width:
          type: string
          default: null
        height:
          type: string
          default: null
        fps:
          type: number
          default: 30.0
        real_time:
          type: boolean
          default: true
        loop:
          type: boolean
          default: false
        watch_folder:
          type: boolean
          default: true
  name: Folder Capture
  manufacturer: Open Source
  cover: ascii_stl__writer.webp
  icon: ascii_stl__writer.webp
