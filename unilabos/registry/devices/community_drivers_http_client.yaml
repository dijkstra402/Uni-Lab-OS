http_client:
  class:
    module: unilabos.devices.robotic_arm.robotic_arm_driver:HttpClient
    type: python
    status_types:
      robot_public_key: String
    action_value_mappings:
      auto-make_request:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: make_request
          type: object
          properties:
            goal:
              type: object
              properties:
                url:
                  type: string
                method:
                  type: string
                body:
                  type: string
                headers:
                  type: string
        goal_default:
          method: POST
        handles: {}
      auto-send_encrypted_sdp:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: send_encrypted_sdp
          type: object
          properties:
            goal:
              type: object
              properties:
                robot_ip:
                  type: string
                path_ending:
                  type: string
                encrypted_data:
                  type: object
        goal_default: {}
        handles: {}
      auto-close:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: close
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: HTTP client for WebRTC signaling communication
  category:
  - robotic_arm
  init_param_schema:
    config:
      type: object
      properties:
        timeout:
          type: number
          default: 10.0
  name: Http Client
  manufacturer: Open Standard
  cover: aio_serial.webp
  icon: aio_serial.webp
