temper_device:
  class:
    module: unilabos.devices.sensors.temperature.temper_device:TemperDevice
    type: python
    status_types:
      sensor_count: String
      product: String
      ports: String
      bus: String
      data: String
      temperature: String
      temperatures: String
      humidity: String
    action_value_mappings:
      auto-set_calibration_data:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_calibration_data
          type: object
          properties:
            goal:
              type: object
              properties:
                scale:
                  type: string
                offset:
                  type: string
        goal_default: {}
        handles: {}
      auto-lookup_offset:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: lookup_offset
          type: object
          properties:
            goal:
              type: object
              properties:
                sensor:
                  type: string
        goal_default: {}
        handles: {}
      auto-lookup_humidity_offset:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: lookup_humidity_offset
          type: object
          properties:
            goal:
              type: object
              properties:
                sensor:
                  type: string
        goal_default: {}
        handles: {}
      auto-lookup_sensor_count:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: lookup_sensor_count
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-set_sensor_count:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_sensor_count
          type: object
          properties:
            goal:
              type: object
              properties:
                count:
                  type: string
        goal_default: {}
        handles: {}
      auto-close:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: close
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: A TEMPer USB thermometer
  category:
  - sensors
  - temperature
  init_param_schema:
    config:
      type: object
      properties:
        device:
          type: string
          default: null
        sensor_count:
          type: string
          default: 1
  name: Temper Device
  manufacturer: TEMPer (PCsensor)
  cover: cpu_temperature.webp
  icon: cpu_temperature.webp
