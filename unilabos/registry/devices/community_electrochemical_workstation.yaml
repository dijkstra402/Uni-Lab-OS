    source: https://github.com/bicarlsen/easy-biologic
  name: VSP-300 Potentiostat
  description: VSP-300 电化学工作站非常适合团队工作，可以连接到 LAN 并由多个用户独立控制
  manufacturer: Bio-Logic
  icon: biologic-couleurs.png
  tags:
  - 电化学工作站
  category:
  - 电化学工作站
  device_params:
    Slots available: Up to 6
    Electrodes connections: 2, 3, 4, 5
    Compliance: ± 12 V
    Acquisition time: '1 µs with ARG option, 20 µs with EC-Lab developer package,
      200 µs with EC-Lab. Live processed data : 200 µs, independent of sampling rate
      (Q charge, Q discharge, Energy, Power...)'
    Software: EC-Lab, EC-Lab developper package
    Add-ons compatibility: 'Yes'
    Dimension (W x D x H): 254 x 517 x 337 mm
    Weight: 20 kg
    Power requirement: 650 W
    Interfaces: Ethernet (Direct, LAN, Wifi), USB 2.0
    品牌: Bio-Logic
  model:
    name: VSP-300 Potentiostat
    type: device
  scene:
    domain: Chemistry
    scene_name: Electrochemistry
    step: Measurement
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        address:
          default: null
          type: string
        timeout:
          default: null
          type: string
        populate_info:
          default: null
          type: string
