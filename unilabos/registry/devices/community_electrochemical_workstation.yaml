  description: Basel Precision Instruments SP983是瑞士巴塞尔大学衍生公司研发的超低噪声电流-电压转换器（跨阻放大器）。该仪器专为量子物理和低温实验设计，能够将极微小电流（低至皮安培至飞安培级别）转换为可测量的电压信号。SP983以其卓越的低噪声性能和高稳定性著称，广泛应用于扫描隧道显微镜、量子输运测量和纳米电子学研究等领域。
