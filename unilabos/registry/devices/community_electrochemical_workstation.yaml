  name: UHFQA 600 MHz Quantum Analyzer
  description: Zurich Instruments UHFQA是专为超导量子比特多路复用读出设计的量子分析仪，支持600MHz带宽，10个并行加权积分单元实现实时量子态判别。通过ZSync接口与HDAWG实现实时反馈。
  manufacturer: Zurich Instruments
  icon: uhfqa_core.webp
  tags:
  - 电化学工作站
  category:
  - 电化学工作站
  device_params:
    频率范围: DC-600MHz
    输入阻抗: 50Ω/1MΩ
    ADC: 12位 1.8GSa/s
    DAC: 14位 1.8GSa/s(2通道)
    输出范围: ±150mV/±1.5V
    波形内存: 128MSa/通道(主)+32kSa(缓存)
    积分单元: 10个并行加权积分
    滤波器内存: 4096Sa/通道
    实时矩阵: deskew(2×2)+10×rotation+10×10串扰抑制
    数据记录: 1MSa, 最大2^17平均
    品牌: Zurich Instruments
  model:
    name: UHFQA 600 MHz Quantum Analyzer
    type: device
  scene:
    domain: Biology
    scene_name: Sample Preparation
    step: Mixing
  version: 1.0.0
  resource_type: device
