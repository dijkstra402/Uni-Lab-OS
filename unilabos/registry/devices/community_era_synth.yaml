  name: Exception
  description: ERASynth Micro是ERA Instruments（土耳其伊斯坦布尔）推出的开源射频信号发生器，基于Arduino Micro平台，双PLL架构，USB供电，适合创客、学生、业余无线电和SDR用户。
  manufacturer: ERA Instruments
  icon: era_synth.webp
  tags: &id001
  - 信号源与发生器
  category: *id001
  device_params:
    频率范围: 12.5MHz-6.4GHz
    幅度范围: -50至+15dBm
    相位噪声: -115dBc/Hz(1GHz, 10kHz偏移)
    架构: 双PLL
    调制: AM/FM/脉冲(内部/外部)
    内部信号: 正弦/三角/锯齿/方波
    参考: 内部10MHz TCXO, 可外部10MHz
    MCU: ATmega32U4
    供电: USB
    显示: LCD
    开源: 原理图/固件/GUI全部开源
    品牌: ERA Instruments
  model:
    name: Exception
    type: device
  scene:
    domain: Biology
    scene_name: Sample Preparation
    step: Mixing
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        name:
          default: null
          type: string
        address:
          default: null
          type: string
        baudrate:
          default: null
          type: integer
        serial_timeout:
          default: null
          type: string
