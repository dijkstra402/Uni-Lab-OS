    module: community_drivers.54.driver:DeviceDriver
    type: python
  name: Inficon IC/5 薄膜沉积控制器
  description: Inficon IC/5是基于石英晶体微天平的薄膜沉积控制器,用于真空镀膜工艺的速率和厚度精密测控。支持多源共蒸镀和多层膜堆叠工艺,内置PID控制器实现闭环速率控制。预载常用材料的声学阻抗比(Z-ratio)和密度值,配备仿真模式用于工艺开发。已被后继型号IC6替代,IC6支持ModeLock频率测量技术和最多6源同步控制。
