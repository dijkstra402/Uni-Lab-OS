  name: Inficon STM-2XM 双通道速率/厚度监控仪
  description: Inficon STM-2XM是一款双通道速率/厚度监控仪，具备8个可编程数字输入/输出和4路模拟输出，提供通常仅在高端设备上才有的集成能力。支持简单模式、备份模式、合金模式和独立模式等多种工作模式。时间平均功能可实现更精确的速率测量，晶振失效时自动使用最近稳定速率继续完成镀膜。频率分辨率±0.03Hz，厚度分辨率±0.037Å。
