    type: python
  name: Inficon SQC-310C 薄膜沉积控制器
  description: Inficon SQC-310C是一款单通道石英晶振薄膜沉积控制器，基于QCM技术实时监测沉积速率和膜厚。提供亚埃级厚度分辨率，具备PID闭环控制功能用于蒸发源功率调节。支持多膜参数程序存储、RS-232远程控制和数据记录。适用于热蒸发、电子束蒸发和溅射等PVD工艺，是实验室和工业真空镀膜的常用设备。
