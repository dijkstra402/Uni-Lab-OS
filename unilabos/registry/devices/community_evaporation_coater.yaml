community_55:
  class:
    module: community_drivers.55.driver:DeviceDriver
    type: python
  name: Inficon STM-2 薄膜速率/厚度监控仪
  description: Inficon STM-2是USB连接的薄膜速率与厚度监控仪,将USB连接的简便性与精密测量引擎的准确性相结合。采用石英晶体微天平技术实时监测蒸镀速率和膜厚,配备数字显示、工装因子调节和晶片寿命监测功能。支持多种材料密度和Z-ratio预设,适用于热蒸发、电子束蒸发和溅射等PVD工艺的基础膜厚监控。
