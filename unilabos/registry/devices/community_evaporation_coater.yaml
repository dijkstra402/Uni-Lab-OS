  version: 1.0.0
  resource_type: device
  device_params:
    传感器通道: 2路标准/最多6路
    频率范围: 1.0-6.5MHz
    厚度分辨率: ±0.37Å(标准)/±0.037Å(高分辨率)
    存储膜数: '99'
    速率显示: 0.1或0.01Å/s可选
    通信: RS-232标准/USB/以太网可选
