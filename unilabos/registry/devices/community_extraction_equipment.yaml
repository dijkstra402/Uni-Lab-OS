community_1077:
  class:
    module: community_drivers.1077.driver:DeviceDriver
    type: python
  name: Biotage Selekt 快速色谱纯化系统
  description: Biotage Selekt是Biotage公司推出的高性能自动化快速色谱（Flash Chromatography）纯化系统。采用双通道设计，可在正相和反相色谱模式间自动切换。流速覆盖1-300mL/min（1mL/min增量），最高工作压力30bar，兼容Biotage
    Sfär 5g至340g预装柱及最大1.85kg色谱柱。提供UV（200-400nm）和UV-VIS（198-810nm）两种检测器选项，可加装ELSD蒸发光散射检测器。标配QR柱码扫描、RFID识别和智能馏分架管理。单托盘最多收集144个馏分，双托盘扩展至288个，支持13×100mm至480mL多种规格收集管。15英寸触摸屏基于UNIX系统，内置梯度优化、3D可视化和远程监控功能。提供多种配置型号（SEL-2EV/2EW/2SV/2SW）及精简版Selekt
    Enkel。
  manufacturer: Biotage
  tags:
  - 抽提萃取设备
  category:
  - 抽提萃取设备
  model:
    name: Biotage Selekt 快速色谱纯化系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    流速范围: 1-300mL/min
    最大压力: 30bar
    UV检测器: 200-400nm
    UV-VIS检测器: 198-810nm
    溶剂线: 4条(二元梯度+改性剂)
    柱容量: 5g-1.85kg
    最大馏分数: 288(双托盘)
    显示屏: 15英寸TFT触摸屏
    功率: 300VA
    重量: 23-25kg
    认证: CE/FCC/CB/NRTL
    品牌: Biotage
