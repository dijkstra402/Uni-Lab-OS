fire_sting:
  class:
    module: unilabos.devices.community.fire_sting.driver:FireSting
    type: python
    status_types:
      settings: String
      led_intensity: String
      measure_time: String
      amplification: String
      frequency: String
      temperature: String
      salinity: String
      pressure: String
    action_value_mappings:
      auto-measure:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: measure
          type: object
          properties:
            goal:
              type: object
              properties:
                measure_temperature:
                  type: boolean
                measure_pressure:
                  type: boolean
                measure_humidity:
                  type: boolean
                decode_status:
                  type: boolean
        goal_default:
          measure_temperature: true
          measure_pressure: true
          measure_humidity: true
          decode_status: false
        handles: {}
      auto-led_intensity:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: led_intensity
          type: object
          properties:
            goal:
              type: object
              properties:
                intensity:
                  type: string
        goal_default: {}
        handles: {}
      auto-measure_time:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: measure_time
          type: object
          properties:
            goal:
              type: object
              properties:
                meas_time:
                  type: string
        goal_default: {}
        handles: {}
      auto-amplification:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: amplification
          type: object
          properties:
            goal:
              type: object
              properties:
                amp:
                  type: string
        goal_default: {}
        handles: {}
      auto-frequency:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: frequency
          type: object
          properties:
            goal:
              type: object
              properties:
                freq:
                  type: string
        goal_default: {}
        handles: {}
      auto-blink:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: blink
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-disconnect:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: disconnect
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: FireSting3
  category:
  - custom
  init_param_schema:
    config:
      type: object
      properties:
        port:
          type: string
          default: null
        baud:
          type: string
          default: null
