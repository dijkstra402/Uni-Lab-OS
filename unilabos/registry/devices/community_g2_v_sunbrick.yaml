g2_v_sunbrick:
  class:
    module: unilabos.devices.community.g2_v_sunbrick.driver:G2VSunbrick
    type: python
    status_types:
      brick_id: String
      channel_count: String
      channel_list: String
      node_count: String
      node_list: String
      firmware_version: String
      address: String
      avg_temperature: String
      all_temperatures: String
      channel_value: String
      intensity_factor: String
      spectrum: String
    action_value_mappings:
      auto-set_channel_value:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_channel_value
          type: object
          properties:
            goal:
              type: object
              properties:
                channel:
                  type: string
                value:
                  type: string
                node:
                  type: string
        goal_default:
          node: 0
        handles: {}
      auto-set_intensity_factor:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_intensity_factor
          type: object
          properties:
            goal:
              type: object
              properties:
                value:
                  type: string
                node:
                  type: string
        goal_default:
          node: 0
        handles: {}
      auto-turn_off:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: turn_off
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-set_spectrum:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_spectrum
          type: object
          properties:
            goal:
              type: object
              properties:
                spectrum_file:
                  type: string
        goal_default: {}
        handles: {}
      auto-setup_network_arbitration:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: setup_network_arbitration
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: G 2VSunbrick
  category:
  - generic
  init_param_schema:
    config:
      type: object
      properties:
        serial_obj:
          type: string
          default: null
        slave_address:
          type: string
          default: 1
