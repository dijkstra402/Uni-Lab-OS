community_439:
  class:
    module: community_drivers.439.driver:DeviceDriver
    type: python
  name: MKS MultiGas 2030 FTIR气体分析仪
  description: MKS MultiGas 2030是一款基于FTIR技术的多组分气体分析仪，能够以ppb级灵敏度同时检测30余种气体组分，可在含水量高达40%的气体流中工作。配备2102过程FTIR光谱仪、专利高光通量采样池和仪器无关定量光谱库。多点校准曲线提供9个数量级的动态范围，广泛应用于排放监测、过程控制和环境空气监测。
  manufacturer: MKS Instruments
  tags:
  - 气相色谱质谱联用仪
  category:
  - 气相色谱质谱联用仪
  model:
    name: MKS MultiGas 2030 FTIR气体分析仪
    type: device
  version: 1.0.0
  resource_type: device
community_1059:
  class:
    module: community_drivers.1059.driver:DeviceDriver
    type: python
  name: Shimadzu GCMS-QP2020 NX 单四极杆气质联用仪
  description: Shimadzu GCMS-QP2020 NX是高灵敏度单四极杆气质联用系统，搭载UFsweeper碰撞池技术有效降低噪声。扫描速度达20000u/sec，支持Scan和MRM同时采集。配备ClickTek设计实现工具免拆卸维护，具有Eco模式降低载气和电力消耗，适用于环境、食品和法医分析。
  manufacturer: Shimadzu
  tags:
  - 气相色谱质谱联用仪
