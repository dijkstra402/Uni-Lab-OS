  name: Keithley 6430
  description: Keithley 6430亚飞安远端源表，最小电流灵敏度0.4fA，分辨率低至10aA。独特远端前置放大器设计可紧贴被测器件放置，最大程度降低电缆噪声和泄漏电流。电压源范围±200V，四象限源/吸操作，6.5位分辨率。配备保护端子和GPIB/RS-232接口，用于半导体器件表征、纳米材料研究及光电探测器测试。
