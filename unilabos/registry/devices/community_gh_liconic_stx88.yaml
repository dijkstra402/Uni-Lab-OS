    source: https://github.com/AD-SDL/liconic_module
  name: The Storex STX Line
  description: 主要特点 STX44 培养箱可与放置在桌面上的仪器集成（台式 - BT）或与立在地板上的仪器集成（独立 - SA）。独立配置与台式配置的组合允许这些单元堆叠。
    STX44子系列的IT型号适用于结晶应用。特殊版本可将整个电子设备放置在远离设备主体的单独盒子中，以适应空间受限的情况。侧门配置中的 STX44 专为在用户门面向前方时无缝集成在其他设备侧面而设计。
  manufacturer: LiCONiC
  icon: gh_liconic_stx88.webp
  tags: &id001
  - 自动化耗材堆栈
  category: *id001
  device_params:
    Type: Automated -20°C storage
    Capacity: 88 microplates
    Temperature: -20°C
    Interface: SiLA/REST API
    Barcode reader: integrated
    Compatible: lab automation
    品牌: LiCONiC
  model:
    name: The Storex STX Line
    type: device
  scene:
    domain: Automation
    scene_name: Lab Automation
    step: Material Handling
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        host:
          default: null
          type: string
        port:
          default: null
          type: integer
