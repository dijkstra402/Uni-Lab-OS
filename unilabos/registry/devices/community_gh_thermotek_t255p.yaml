  name: Thermotek
  description: ThermoTek T255P固态热电循环冷水机，采用珀尔帖半导体制冷，体积比同等制冷量压缩机机组小50%。制冷量210W，温控范围-5°C至+45°C，稳定性±0.1°C。配备智能数字控制器和断电记忆功能，1/4"
    NPT液路接口，RS-232接口，100-240V通用供电，用于激光器冷却和实验室精密温控。
