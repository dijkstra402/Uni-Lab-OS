  name: Yokogawa GS200 DC Voltage/Current Source
  description: Yokogawa GS200高精度直流电压/电流源，电压范围±10mV至±30V（分辨率100nV），电流范围±1mA至±200mA（分辨率10nA），精度0.02%。超低噪声设计，5.5英寸TFT彩色LCD。内置阶梯扫描和程序存储（10000步），支持USB/GPIB/RS-232C接口，适用于半导体、传感器和超导体精密测试。
