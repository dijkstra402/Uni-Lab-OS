  description: Harvester是由Open Source (GenICam)生产的实验执行&合成设备，主要功能包括停止、加载、启动、复位、成像、读取数据。支持Signal,
    Slot, add等操作。
  category:
  - 实验执行&合成设备
  device_params:
    支持操作数: '68'
    读取操作: get、timeout_on_client_fetch_call、timeout_period_on_client_fetch_call、thread_image_acquisition、try_fetch
      等7个
    控制操作: start、stop、stop、start_image_acquisition、start_acquisition 等10个
    运动操作: remove、remove_callback、remove_callbacks
    设备属性: parameters、token、module、node_map、parent、port 等60个
    控制能力: 多通道
    通信接口: DLL/SDK
  manufacturer: Open Source (GenICam)
  model:
