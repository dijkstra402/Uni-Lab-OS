    Heating Rate: ~4.6K/min
    Cooling Rate: ~4.1K/min
    Power: 2.6kW
    Interface: RS-422
    Controller: MB1 (25 programs/100 segments)
    品牌: BINDER GmbH
  model:
    name: BINDER MK 53 Dynamic Climate Chamber
    type: device
  scene:
    domain: Chemistry
    scene_name: Temperature Control
    step: Heating/Cooling
