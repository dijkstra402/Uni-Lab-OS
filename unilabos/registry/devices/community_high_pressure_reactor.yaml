community_108:
  class:
    module: community_drivers.108.driver:DeviceDriver
    type: python
  name: Parr 4848 反应器控制器
  description: Parr 4848是Parr公司的通用型反应器控制器，模块化设计支持最多3个扩展模块(压力显示、搅拌控制、高温切断、外部温限、电磁阀等7种可选)。主温控模块采用全PID控制并具备自整定能力，支持49段升温-保温程序。所有模块均配备RS-485双向数字通信，可通过PC远程设定参数和记录数据。压力显示模块支持psi/bar/mPa切换，搅拌电机控制模块提供真正闭环速度反馈控制，特别适用于粘度变化的反应过程监控。
  manufacturer: Parr Instruments
  tags:
  - 高压反应器
  category:
  - 高压反应器
  model:
    name: Parr 4848 反应器控制器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    温控: PID自整定+49段程序升温
    模块: 最多3个扩展模块
    温度输入: 热电偶/RTD
    压力显示: 1psi分辨率/1%FS精度
    搅拌控制: 开环/闭环
    通信: RS-485+USB
    尺寸: 282×246×287mm
    品牌: Parr Instruments
community_109:
  class:
    module: community_drivers.109.driver:DeviceDriver
    type: python
  name: Büchi miniclave steel 小型高压反应器
  description: Büchi miniclave steel是一款紧凑的台式高压反应器，容积从25mL至500mL可选，最高工作压力达200bar，温度可达250°C。不锈钢316Ti标准材质耐腐蚀，Hastelloy
    C可选用于苛刻化学条件。磁力耦合驱动实现无轴封搅拌，彻底消除泄漏风险。快速卡箍密封设计便于拆装和清洁，模块化结构可根据应用需求定制配置。可配合Büchi bpc过程控制系统实现温度、压力和搅拌的自动化控制，适用于催化加氢、高压合成和反应筛选。
  manufacturer: Büchi
  tags:
  - 高压反应器
  category:
  - 高压反应器
  model:
    name: Büchi miniclave steel 小型高压反应器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    容积: 25~500mL可选
    最高压力: 最高200bar
    最高温度: 最高250°C
    材质: AISI 316Ti/Hastelloy可选
    搅拌: 磁力耦合驱动(无轴封)
    品牌: Büchi
