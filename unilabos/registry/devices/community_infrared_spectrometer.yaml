community_175:
  class:
    module: community_drivers.175.driver:DeviceDriver
    type: python
  name: Thermo Fisher Nicolet FTIR OMNIC 红外光谱分析软件套件
  description: Thermo Fisher OMNIC是专为Nicolet系列FTIR红外光谱仪开发的专业光谱分析软件套件。该软件提供从光谱数据采集、基线校正、峰面积分析到高级多组分搜索和污染物分析等全面功能。最新版OMNIC
    Paradigm采用现代化界面，支持拖放式工作流创建和云端数据协作，可实现远程操作。软件兼容所有Nicolet FTIR型号，是红外光谱分析领域的行业标准平台。
  manufacturer: Thermo Fisher Scientific
  tags:
  - 红外光谱仪
