  version: 1.0.0
  resource_type: device
community_179:
  class:
    module: community_drivers.179.driver:DeviceDriver
    type: python
  name: Mettler Toledo FlowIR在线连续流红外光谱检测器
  description: Mettler Toledo FlowIR是一款专为连续流化学反应设计的在线FTIR红外光谱检测系统，可实时监测流动反应流中的化学组成变化。该仪器采用ATR衰减全反射技术，具有亚毫摩尔级灵敏度，支持可互换的DiComp金刚石和SiComp硅传感器。高压传感器可承受50bar压力和120°C温度，无需液氮冷却即可维持高性能。该产品目前已停产，功能由ReactIR
    702L流动化学版本继承。
  manufacturer: Mettler Toledo
  tags:
  - 红外光谱仪
  category:
  - 红外光谱仪
  model:
    name: Mettler Toledo FlowIR在线连续流红外光谱检测器
    type: device
  version: 1.0.0
  resource_type: device
