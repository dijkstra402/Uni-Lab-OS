  description: Singer ROTOR+（型号RT2-001）是Singer Instruments公司的精密高通量微生物接种机器人。支持96至6144密度阵列，极端条件下单板可达24576个菌落。琼脂间转移25秒/板，每小时处理近百万菌落。电机精度50µm，酿酒酵母转移效率99.68%，大肠杆菌99.94%，交叉污染率<0.03%。配备智能琼脂感应针头、智能偏移接种和3D液体混合功能，默认接种压力<7g/mm²防止飞溅。使用一次性伽马射线灭菌RePads复制垫，配合PlusPlates专用培养板。紫外消毒灯和防污染屏保障实验环境。兼容酵母、细菌、真菌、藻类。广泛应用于SGA分析、化学基因组学、酵母双杂交、文库构建等。相比96孔板手动操作，成本降低60倍以上。
