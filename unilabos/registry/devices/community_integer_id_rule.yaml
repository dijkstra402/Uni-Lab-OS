integer_id_rule:
  class:
    module: unilabos.devices.community.integer_id_rule.driver:IntegerIDRule
    type: python
    status_types:
      advert: String
      expired: String
      finished: String
    action_value_mappings:
      auto-mark_release_complete:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: mark_release_complete
          type: object
          properties:
            goal:
              type: object
              properties:
                n_tasks:
                  type: string
        goal_default: {}
        handles: {}
      auto-make_range_available:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: make_range_available
          type: object
          properties:
            goal:
              type: object
              properties:
                start:
                  type: string
                end:
                  type: string
        goal_default: {}
        handles: {}
      auto-bid:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: bid
          type: object
          properties:
            goal:
              type: object
              properties:
                bid:
                  type: string
        goal_default: {}
        handles: {}
      auto-mark_complete:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: mark_complete
          type: object
          properties:
            goal:
              type: object
              properties:
                info:
                  type: string
        goal_default: {}
        handles: {}
      auto-inactivate:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: inactivate
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-info:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: info
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-poll_timeouts:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: poll_timeouts
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
  description: A rule which generates tasks based on a template
  category:
  - generic
  init_param_schema:
    config:
      type: object
      properties:
        ruleID:
          type: string
          default: null
        task_template:
          type: string
          default: null
        inputs_by_task:
          type: string
          default: null
        max_task_ID:
          type: string
          default: 100000
        task_timeout:
          type: string
          default: 600
        rule_timeout:
          type: string
          default: 3600
        on_completion:
          type: string
          default: null
