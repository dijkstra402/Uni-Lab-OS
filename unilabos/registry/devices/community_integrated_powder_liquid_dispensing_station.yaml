  name: Chemspeed FLEX 自动化合成与配液工作站
  description: Chemspeed FLEX是Chemspeed Technologies（现Bruker旗下，瑞士）开发的模块化高通量自动化合成与配粉配液一体化工作站。紧凑设计（0.9×0.9m占地），集成专利顶置式重力计量分配技术。三种核心分配单元：SWILE亚毫克级精准取放（分辨率0.01mg），GDU-P
    Fine Dispensing覆盖0.1mg-10g，GDU-P处理1mg-100g（典型速度1g/20sec）。四通道独立注射泵处理粘度1至500,000mPa·s的液体。温度范围-40°C至250°C（AUTOPLANT），相邻反应器温差可达130°C。搅拌系统含锚式搅拌器（粘度80Pa·s/300rpm）和高剪切均质（11,000-30,000rpm）。通量最多672个样品瓶（7×96孔板）。超过50种可自动交换机器人工具。FLEXSHUTTLE可串联多台为一体化流水线。AutoSuite软件支持DOE/AI/LIMS/ELN集成。应用于制药、催化、电池材料等高通量研究。
  manufacturer: Chemspeed (Bruker旗下)
  tags:
  - 一体化配粉配液站
  category:
  - 一体化配粉配液站
  model:
    name: Chemspeed FLEX 自动化合成与配液工作站
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    平台尺寸: 900×900×2150mm
    SWILE精度: 分辨率0.01mg
    GDU-P精度: 1mg-100g(200mL容器)
    液体处理: 4通道注射泵(1/10/25mL)
    粘度范围: 1-500000mPa·s
    温度: -40°C至250°C(精度0.1°C)
    压力: 最高100bar
    通量: 最多672个样品瓶
    机器人工具: 50+种
    软件: AutoSuite(DOE/AI)
    品牌: Chemspeed (Bruker旗下)
