  name: 'wd5gnr/mhs5200a: Shell script and awk program (and spreadsheet) to allow
    custom wave settings for MHS-5200A signal generator'
  description: MHS-5200A双通道DDS数字合成任意波形发生器，低成本通用信号源，适合电子实验教学和业余爱好者使用。
