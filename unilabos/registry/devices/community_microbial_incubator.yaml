community_142:
  class:
    module: community_drivers.142.driver:DeviceDriver
    type: python
  name: Liconic STX44-ICBT 自动化培养箱
  description: Liconic STX44-ICBT是一款高通量自动化微孔板培养箱，由瑞士Liconic AG制造。可容纳44块标准微孔板，具备精密温度、CO2和湿度控制功能。专为机器人自动化系统集成设计，支持与液体处理平台和自动化工作站的无缝对接。盒式存储系统实现有序的板片管理，广泛应用于药物发现、细胞检测和高通量筛选。
  manufacturer: Liconic
  tags:
  - 微生物培养箱
  category:
  - 微生物培养箱
  model:
    name: Liconic STX44-ICBT 自动化培养箱
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    微孔板容量: 44块
    温度: 环境+5°C至50°C
    CO2控制: 0-20%
    湿度控制: 最高95%RH
    品牌: Liconic
community_1073:
  class:
    module: community_drivers.1073.driver:DeviceDriver
    type: python
  name: Tecan Spark 20M 多功能微孔板读板器
  description: Tecan Spark 20M是多模式微孔板检测器，集成荧光、化学发光、吸光度等多种检测模式。采用Fusion Optics技术兼具单色器灵活性和滤光片灵敏度。支持6至1536孔板格式，可选配细胞成像、气体控制和Te-Cool冷却模块，适用于药物发现、基因组学和细胞生物学研究。
  manufacturer: Tecan
  tags:
  - 微生物培养箱
  category:
  - 微生物培养箱
  model:
    name: Tecan Spark 20M 多功能微孔板读板器
    type: device
  version: 1.0.0
  resource_type: device
