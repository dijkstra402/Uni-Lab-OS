  name: The Storex STX Line
  description: 主要特点 STX44 培养箱可与放置在桌面上的仪器集成（台式 - BT）或与立在地板上的仪器集成（独立 - SA）。独立配置与台式配置的组合允许这些单元堆叠。
    STX44子系列的IT型号适用于结晶应用。特殊版本可将整个电子设备放置在远离设备主体的单独盒子中，以适应空间受限的情况。侧门配置中的 STX44 专为在用户门面向前方时无缝集成在其他设备侧面而设计。
  manufacturer: LiCONiC
  icon: gh_liconic_storex_stx88.webp
  tags:
  - 微生物培养箱
  category:
  - 微生物培养箱
  device_params:
    Type: Automated -20°C storage
    Capacity: up to 88 microplates
    Temperature: -20°C
    Interface: SiLA/REST API
    Barcode: integrated reader
    Compatible: robotic integration
    品牌: LiCONiC
  model:
    name: The Storex STX Line
    type: device
  scene:
    domain: Biology
    scene_name: Cell Culture
    step: Incubation
  version: 1.0.0
  resource_type: device
