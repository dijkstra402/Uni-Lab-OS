    检测器: 96个光电二极管
    波长: 400-1000nm可选(FWHM 10nm)
    光度范围: 0.0-4.0 OD
    再现性: ≤0.5%+0.005OD(0-2.0OD)
    分辨率: 0.001 OD
    读取时间: 最快3秒(单波长)
    尺寸: 9.6×15.4×5.5cm
    重量: 900g
    功耗: 2.5W
    接口: USB 2.0
    软件: Windows/macOS
    品牌: Byonoy GmbH
  model:
    name: Specifications
    type: device
  scene:
    domain: Biology
    scene_name: Analysis
    step: Plate Reading
  version: 1.0.0
  resource_type: device
