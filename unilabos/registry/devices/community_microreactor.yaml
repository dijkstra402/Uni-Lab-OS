  name: Accessories
  description: 采用压电技术的4通道微流控流量控制器，精度比传统控制器高20倍，速度快10倍，支持UART/ESI/SDK控制
  manufacturer: Elveflow
  icon: ob1elve.webp
  tags:
  - 微通道反应器
  category:
  - 微通道反应器
  device_params:
    通道: 最多4通道(可扩展至64通道)
    压力范围: -900mbar至8bar
    压力稳定性: 0.005%
    传感器分辨率: 0.006%
    响应时间: 9ms
    稳定时间: 40ms
    品牌: Elveflow
  model:
    name: Accessories
    type: device
  scene:
    domain: Chemistry
    scene_name: Synthesis
    step: Microfluidic Reaction
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        elveflowDLL:
          default: null
          type: string
        elveflowSDK:
          default: null
          type: string
        deviceName:
          default: null
          type: string
        deviceRegulators:
          default: null
          type: string
        deviceID:
          default: null
          type: integer
