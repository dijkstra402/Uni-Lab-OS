  description: Modbus Client是由Modbus (Open Standard)生产的实验执行&合成设备，主要功能包括关闭、写入数据、打开、读取数据。支持Signal,
    Slot, custom request等操作。
  category:
  - 实验执行&合成设备
  device_params:
    支持操作数: '20'
    读取操作: read_coils、read_discrete_inputs、read_holding_registers、read_input_registers、read_device_identification
      等6个
    控制操作: write_single_coil、write_single_register、write_multiple_coils、write_multiple_registers、write_read_multiple_registers
    设备属性: vendor_name、product_code、major_minor_revision、vendor_url、product_name、model_name
      等20个
    通信接口: Modbus、TCP/IP
  manufacturer: Modbus (Open Standard)
