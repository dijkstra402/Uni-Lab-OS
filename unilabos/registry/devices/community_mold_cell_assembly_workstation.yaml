community_1080:
  class:
    module: community_drivers.1080.driver:DeviceDriver
    type: python
  name: AutoBASS 2.0 自动电池组装系统
  description: AutoBASS 2.0（Automated Battery Assembly System）是Helge Stein研究组开发的全自动CR2032纽扣电池组装机器人系统，论文发表于Digital
    Discovery (2022, DOI:10.1039/D2DD00046F)。系统由3台Mecademic Meca500 Rev.3六轴机械臂（重复定位精度±0.005mm，有效载荷500g）、Jenny
    Science线性导轨和MTI MSK-160E液压压接机组成。组装单元通过软硅胶吸盘精确取放阳极(15mm)、隔膜(16mm)、阴极(14mm)等零件。电解液单元配备Sartorius
    rLINE移液器（精度1nL），支持16种电解液无交叉污染分配。2.0版新增双摄像头主动成像校正、多线程并行操作和友好UI。单批最多64个电池，容量变异系数3.4%。获欧盟Horizon
    2020资助，MIT开源许可。
  manufacturer: Helge Stein Group
  tags:
  - 模具电池组装工站
  category:
  - 模具电池组装工站
  model:
    name: AutoBASS 2.0 自动电池组装系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    机械臂: 3×Mecademic Meca500 Rev.3(重复精度±0.005mm)
    线性导轨: Jenny Science Linax LXS 1800
    压接机: MTI MSK-160E(800kg)
    分液: Sartorius rLINE 200µL(精度1nL)
    电解液通道: 最多16种
    批次: 最多64个CR2032
    放置精度: 0.2mm
    成像: 双摄像头
    软件: Python 3.7+
    品牌: Helge Stein Group
