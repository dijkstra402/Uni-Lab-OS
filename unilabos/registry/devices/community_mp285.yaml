  name: MP-285 Motorized Micromanipulator
  description: Sutter MP-285三轴电动微操纵器，步进分辨率达40nm，长期漂移低于1μm/4h，支持可编程自动化控制，广泛用于电生理膜片钳和显微注射。
  manufacturer: Sutter Instrument
  icon: mp285.webp
  tags: &id001
  - 运动控制系统
  category: *id001
  device_params:
    行程: 25mm(三轴X/Y/Z)
    分辨率: 0.04μm(高)/0.2μm(低)
    最大速度: 2.9mm/sec
    稳定性: <1.0μm/4小时
    驱动: 精密蜗轮绞盘
    虚拟第四轴: 自定义对角进针角度
    程序: 10个(各50个位置)
    串口: RS-232/9600baud
    尺寸: 11×15×16cm
    重量: 1.7kg
    品牌: Sutter Instrument
  model:
    name: MP-285 Motorized Micromanipulator
    type: device
  scene:
    domain: Automation
    scene_name: Robotics
    step: Material Handling
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        com_port:
          default: null
          type: string
        baud_rate:
          default: null
          type: integer
        timeout:
          default: null
          type: string
