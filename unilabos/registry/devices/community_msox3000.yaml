  name: Keysight InfiniiVision MSOX3000 X-Series Mixed Signal Oscilloscope
  description: 3000 X-Series MSO，4模拟+16数字通道，7合1仪器集成，百万级刷新，嵌入式混合信号调试全能平台。在售。
  manufacturer: Keysight
  icon: msox3000.webp
  tags: &id001
  - 示波器与波形分析仪
  category: *id001
  device_params:
    BW: 100MHz~1GHz
    Channels: 2/4 analog + 16 digital
    Sample Rate: 4/5GSa/s(half)
    Memory: up to 4Mpts
    Update Rate: 1M wfms/s
    Display: 8.5" WVGA
    7-in-1: scope/FRA/logic/protocol/WaveGen/DVM/counter
    品牌: Keysight
  model:
    name: Keysight InfiniiVision MSOX3000 X-Series Mixed Signal Oscilloscope
    type: device
  scene:
    domain: Biology
    scene_name: Sample Preparation
    step: Mixing
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        resource:
          default: null
          type: string
        wait:
          default: null
          type: string
  cover: Keysight InfiniiVision MSOX3000 X-Series Mixed Signal Oscilloscope.webp
