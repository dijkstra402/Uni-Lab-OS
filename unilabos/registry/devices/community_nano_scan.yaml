  name: NanoScan™ 2s Si/3.5/1.8 Silicon Scanning 1.8 µm Slit Beam Profiler
  description: Ophir NanoScan 2s是基于扫描狭缝技术的激光光束分析仪，提供硅/锗/热释电三种检测器选项，覆盖UV到远红外。适用于激光光束的宽度、位置和质量实时测量。
  manufacturer: Ophir
  icon: nano_scan.webp
  tags: &id001
  - 光传感器
  category: *id001
  device_params:
    光谱范围: 'UV至IR(Si: 190-1100nm, Ge: 700-1800nm, 热释电: 1-100+µm)'
    光束尺寸: ~1µm至~10mm
    扫描速率: 最高20Hz
    测量参数: 光束宽度/位置/椭圆度/高斯拟合/M²
    接口: USB 2.0
    技术: 扫描狭缝法
    品牌: Ophir
  model:
    name: NanoScan™ 2s Si/3.5/1.8 Silicon Scanning 1.8 µm Slit Beam Profiler
    type: device
  scene:
    domain: Chemistry
    scene_name: Analysis
    step: Spectroscopy
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        port:
          default: null
          type: string
        debug:
          default: null
          type: string
