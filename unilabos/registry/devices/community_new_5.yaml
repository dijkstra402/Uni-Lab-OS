  name: IKA RET control-visc 加热磁力搅拌器
  description: IKA RET control-visc是IKA公司高端加热磁力搅拌器，集成加热搅拌、精密称重、粘度趋势监测和pH测量四大功能。采用ARM微控制器核心，不锈钢加热板（Ø135mm）最高340°C，配合PT100传感器实现0.1K精度温控。搅拌50-1700rpm，最大搅拌量20升。独特粘度趋势检测通过搅拌阻力变化实时反映粘度趋势。内置10-5000g称重功能。安全系统包括50-380°C可调安全回路、磁子脱落检测、余温显示和IP42密封。USB和RS232接口支持PC控制和数据记录，BNC接口连接pH探头。支持定时器、程序运行及间歇搅拌模式。标配PT100传感器、磁力搅拌子、防护罩及USB线。
