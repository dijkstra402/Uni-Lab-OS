  name: Knauer AZURA GPC/SEC 凝胶渗透色谱系统
  description: Knauer AZURA GPC/SEC系统是德国Knauer公司制造的模块化凝胶渗透色谱/体积排阻色谱系统。提供四种配置：Compact经济型、Lab高性能分析型、Semi-prep半制备型和GPC
    Cleanup样品前处理型。核心组件AZURA P 6.1L双柱塞等度泵，具备主动压力和脉动补偿，Lab型流速精密度达≤0.04%RSD。AZURA RID
    2.1L示差折光检测器采用长寿命LED光源和温控光学单元，噪声±2.5nRIU，漂移仅0.2µRIU/h，针对THF等有机溶剂优化。Lab型配备高通量自动进样器（768位微孔板或108×2mL瓶）。兼容ClarityChrom/OpenLAB/Chromeleon软件，GPC扩展模块计算Mn/Mw/Mz和PDI。适用于高分子、食品、生化、制药等领域。
  manufacturer: Knauer
  tags: &id001
  - 凝胶渗透色谱仪
  category: *id001
  model:
    name: Knauer AZURA GPC/SEC 凝胶渗透色谱系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    泵型号: AZURA P 6.1L
    流速: 0.001-10mL/min
    最大压力: 862bar(Lab型)/400bar(Compact型)
    流速精密度: ≤0.04%RSD(Lab)/≤0.5%RSD(Compact)
    RID检测器: 噪声±2.5nRIU/漂移0.2µRIU/h/流通池15µL
    折射率范围: 1.00-1.75RIU
    自动进样: 768位微孔板
    柱温: <60°C
    接口: LAN/RS-232
    品牌: Knauer
