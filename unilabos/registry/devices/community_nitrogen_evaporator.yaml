community_110:
  class:
    module: community_drivers.110.driver:DeviceDriver
    type: python
  name: Biotage TurboVap 氮吹浓缩仪
  description: Biotage TurboVap是实验室多样品快速浓缩的行业标准氮吹仪，采用专利涡旋蒸发技术，氮气以旋涡方式吹入样品表面增大蒸发面积，显著加速溶剂蒸发。可水浴加热至约80°C，一次处理多达50个样品管。TurboVap
    LV适合大体积样品，TurboVap II增加了自动终点检测功能。兼容多种管径和管架配置，适用于环境检测、食品安全、临床毒理和制药分析的样品前处理，比传统旋转蒸发仪在多样品处理上效率更高。
  manufacturer: Biotage
  tags:
  - 氮吹仪
  category:
  - 氮吹仪
  model:
    name: Biotage TurboVap 氮吹浓缩仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    样品容量: 最多50管
    管径: 12/15/16mm等
    样品体积: 1~450mL
    蒸发方式: 氮气涡旋吹扫
    温控: 水浴加热至~80°C
    气源: 氮气或惰性气体
    品牌: Biotage
