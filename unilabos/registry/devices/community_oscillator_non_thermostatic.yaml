  name: Keysight InfiniiVision DSOX2024A Digital Storage Oscilloscope
  description: InfiniiVision 2000 X 系列 DSO 采用 MegaZoom IV 深度内存技术。 22 种以上自动测量、数学（加/减/乘/FFT）。可选
    MSO 升级（8 个数字通道）、内置 WaveGen 函数发生器 (20 MHz)、串行解码和触发（I²C、SPI、UART、CAN、LIN）、分段内存采集。可通过软件许可证升级带宽和内存深度。
  manufacturer: Keysight Technologies
  icon: keysight_dsox2024_a_wrapper.webp
  tags:
  - 振荡器（非恒温）
  category:
  - 振荡器（非恒温）
  device_params:
    Bandwidth: 200 MHz
    Analog Channels: '4'
    Max Sample Rate: 2 GSa/s (single ch) / 1 GSa/s (2+ ch)
    Memory Depth: 100 Kpts (standard, upgradable to 1 Mpts)
    Display: 8.5-inch WVGA
    Waveform Update Rate: Up to 200,000 wfms/s
    Vertical Resolution: 8 bits
    Vertical Scale: 1 mV/div to 5 V/div
    Input Impedance: 1 MΩ ± 1% ∥ ~13 pF
    Input Coupling: AC/DC
    Max Input Voltage: 300 Vrms CAT I
    Time Base: 2 ns/div to 50 s/div
    Rise Time: ≤1.75 ns
    Trigger: Edge/Pulse Width/Pattern/Video
    品牌: Keysight Technologies
  model:
    name: Keysight InfiniiVision DSOX2024A Digital Storage Oscilloscope
    type: device
  scene:
    domain: Biology
    scene_name: Sample Preparation
    step: Mixing
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        guid:
          default: null
          type: string
        name:
          default: null
          type: string
