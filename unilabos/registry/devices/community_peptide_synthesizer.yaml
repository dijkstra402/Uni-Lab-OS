community_1076:
  class:
    module: community_drivers.1076.driver:DeviceDriver
    type: python
  name: PepSy 开源自动化多肽合成仪
  description: 'PepSy是由美国俄克拉荷马大学健康科学中心Dr. Hariprasad Gali开发的开源自动化多肽合成仪，相关论文发表于SLAS
    Technology期刊。系统基于Arduino硬件平台，通过Standard Firmata固件和Python pyFirmata库实现PC端控制。支持全自动和手动两种运行模式：全自动模式(PepSy.py)可完成固相多肽合成的脱保护、偶联、清洗等完整流程；手动模式(PepSy-manual.py)用于管线清洗等维护操作。用户通过config.txt定义设备配置，sequence文件定义合成序列，输出日志自动保存到output文件夹。项目完全开源（GitHub:
    harigali/PepSy），适合教育和小规模研究用途。'
  manufacturer: PepSy (Open Source)
  tags:
  - 多肽合成仪
  category:
  - 多肽合成仪
  model:
    name: PepSy 开源自动化多肽合成仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    控制器: Arduino开发板
    固件: Standard Firmata
    编程语言: Python 3.5+
    依赖库: pyFirmata/pySerial
    运行模式: 全自动(PepSy.py)/手动(PepSy-manual.py)
    配置: config.txt+sequence文件
    品牌: PepSy (Open Source)
