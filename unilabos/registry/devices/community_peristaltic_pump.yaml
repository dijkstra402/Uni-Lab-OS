    source: https://github.com/numat/ismatec
  name: Ismatec Reglo ICC
  description: 使用 Reglo ICC 蠕动泵独立控制多达四个独立通道的方向和速度，每个通道都有自己的程序：启动、停止、分配、反向、抽吸和校准。独立的通道校准通过最小化管与管之间的差异来确保高精度和再现性。通过
    USB 使用键盘或 PC，您可以创建复杂的泵送或精密分配序列，同时在每通道 0.0001 至 43 mL/min 的流量范围内工作。通过以菊花链方式连接 RS-232
    连接器，可同时控制多达八个泵。
  manufacturer: Ismatec
  icon: cole-parmer-antylia.png
  tags:
  - 蠕动泵
  category:
  - 蠕动泵
  device_params:
    Compatible tubing: Ismatec three-stop tubing
    Dimensions: 218 x 125 x 170
    Motor type: Stepper motor (1 per channel)
    Power: 100 to 240 VAC, 50/60 Hz
    Speed range: 0.1 to 100 rpm, 0.01 rpm resolution
    Flow rate: 0.0001 - 43 mL/min (per channel)
    Accuracy: +/- 1%
    Channels: 2, 3 or 4
    Rollers: 6, 8 or 12
    Interfaces: USB 2.0, Mini-B, RS-232
    Protection rating: IP30
    Weight: 2.7 kg
    Power consumption: 30 W
    Differential pressure: 1.0 bar (14.5 psi)
    品牌: Ismatec
  model:
    name: Ismatec Reglo ICC
    type: device
  scene:
    domain: Chemistry
    scene_name: Fluid Control
    step: Pumping
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        address:
          default: null
          type: string
        debug:
          default: null
          type: string
community_65:
  class:
    module: community_drivers.65.driver:DeviceDriver
    type: python
  name: Masterflex L/S 蠕动泵系统
  description: Masterflex L/S系列是全球广泛使用的蠕动泵平台，采用模块化设计，驱动器和泵头可自由组合。流量范围从微升级0.006mL/min到3400mL/min，覆盖实验室到工业级应用。无刷直流电机提供安静长寿命运行，流体仅接触管路确保无污染输送。支持数字、经济和精密多种驱动型号，可选Easy-Load、标准和多通道泵头。适用于化学计量、生物处理和环境采样等应用。
  manufacturer: Masterflex
  tags:
  - 蠕动泵
  category:
  - 蠕动泵
  model:
    name: Masterflex L/S 蠕动泵系统
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    流量范围: 0.006~3400mL/min
    转速范围: 6~600RPM
    管路尺寸: L/S 13/14/16/25/36
    驱动类型: 无刷直流电机
    电源: 100-240V
    品牌: Masterflex
community_66:
  class:
    module: community_drivers.66.driver:DeviceDriver
    type: python
  name: Watson-Marlow 323 蠕动泵
  description: Watson-Marlow 323是经典的翻盖式台式蠕动泵，采用先进的无刷直流电机技术实现精确速度调节和安静运行。流量范围达3000mL/min，可扩展至6通道。标配可编程剂量/分配功能，剂量体积1mL至1L，精度1.0%，具有防滴和防溅功能。液体仅接触管路，换管仅需3秒，几乎免维护。适用于腐蚀性、磨蚀性和粘性液体的精确泵送、计量和输送。
  manufacturer: Watson-Marlow
  tags:
  - 蠕动泵
  category:
  - 蠕动泵
  model:
    name: Watson-Marlow 323 蠕动泵
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    流量范围: 0.002~3000mL/min
    转速范围: 1~400RPM
    通道数: 单通道至五通道
    管径: 0.13~8.0mm
