    module: community_drivers.332.driver:DeviceDriver
    type: python
  name: Amplitude Satsuma 工业飞秒激光器
  description: Amplitude Satsuma是一款紧凑型工业超快激光器，全球畅销产品，已安装超过1500台。提供Satsuma、Satsuma
