community_273:
  class:
    module: community_drivers.273.driver:DeviceDriver
    type: python
  name: Keysight N7778C 可调谐激光源
  description: Keysight N7778C是N777-C系列XP4级可调谐激光源的价值线型号，波长覆盖1240nm至1650nm，峰值输出功率超过+12dBm，信号与SSE比≥75dB/nm。支持双向扫描速度达200nm/s，波长重复性±1.5pm，0.1pm调谐分辨率。电机与压电执行器自动协调实现平滑无超调波长调谐。Option
    013针对硅光子/集成光子技术优化，在1290-1340nm提供超过+16dBm输出功率。可搭配N774xC功率计和N7786C偏振合成器进行插损、PDL和色散的扫描波长测量。
  manufacturer: Keysight
  tags:
  - 光化学反应器
  category:
  - 光化学反应器
  model:
    name: Keysight N7778C 可调谐激光源
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 1240-1650nm(无间隙,型号相关)
    最大功率: '>12dBm(标准)/>18dBm(Option 013)'
    SSE比: ≥75dB/nm
    波长精度: ±4pm(静态)/±10pm(扫描)
    重复性: ±1.5pm
    扫描速度: 最高200nm/s双向
    调谐分辨率: 0.1pm
    品牌: Keysight
community_274:
  class:
    module: community_drivers.274.driver:DeviceDriver
    type: python
  name: Keysight N7770系列 可调谐激光源
  description: Keysight N7770系列是新一代可调谐激光源产品家族，覆盖1240nm至1650nm全波长范围无间隙。包含三款型号：N7776C顶级线(亚皮米重复性和最低SSE)、N7778C价值线(高性价比制造测试)和N7779C基础线(快速步进调谐)。所有型号基于共同腔体和激光模块设计，具备窄线宽、优异长期稳定性和低自发辐射。软件兼容前代8160xA和81600B激光器，支持Web浏览器远程界面(LAN/USB)。可选5英寸电容触摸屏，适用于CWDM、DWDM和PON器件测试。
  manufacturer: Keysight
  tags:
  - 光化学反应器
  category:
