community_415:
  class:
    module: community_drivers.415.driver:DeviceDriver
    type: python
  name: Ondax SureLock LM系列波长稳定激光模块
  description: Ondax SureLock LM系列（现归属Coherent）是一款紧凑型波长稳定激光模块，采用PowerLocker体积全息光栅（VHG）滤波器技术。VHG滤波器创建外腔锁定激光二极管波长，将光谱带宽缩窄一个数量级。极短的外腔配置比Littrow或Littman腔设计具有更好的模式选择和更小的封装尺寸。集成精密温控和电流控制，实现优于1%的功率稳定性和不到1分钟的预热时间。适用于拉曼光谱和计量应用。
  manufacturer: Ondax (Coherent)
  tags:
  - 光化学反应器
  category:
  - 光化学反应器
  model:
    name: Ondax SureLock LM系列波长稳定激光模块
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长范围: 405-830nm
    功率范围: 12-150mW
    线宽: <25-300MHz
    空间模式: 单模
    RMS噪声: 0.25-0.5%(0-20MHz)
    功率稳定性: <1%
    预热时间: <1分钟
    技术: PowerLocker VHG滤波器
    品牌: Ondax (Coherent)
community_424:
  class:
    module: community_drivers.424.driver:DeviceDriver
    type: python
  name: TOPTICA TopMode 单频窄线宽二极管激光器
  description: TOPTICA TopMode是一款单频窄线宽二极管激光器，具有类似HeNe的简便操作但在405nm波长下提供更高功率（最高100mW）。采用专有CHARM（CoHerence-Advanced
    Regulation Method）技术主动监控激光并持续维持单频运行，确保24/7可靠运行无跳模。紧凑型被动风冷激光头设计便于OEM集成，支持ASCII命令编程控制。SmartDock光纤耦合效率超过50%。广泛应用于拉曼光谱、全息术、干涉测量和直写光刻等领域。
  manufacturer: TOPTICA Photonics
  tags:
  - 光化学反应器
  category:
  - 光化学反应器
  model:
    name: TOPTICA TopMode 单频窄线宽二极管激光器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    波长: 405nm(标准)可定制375-515nm
    功率: 最高100mW@405nm
    线宽: 窄线宽单频
    稳频技术: CHARM主动相干控制
    冷却: 被动空气冷却
    功耗: <70W(典型)/150W(最大)
    接口: USB/以太网
    光纤耦合: SmartDock(>50%效率)
    品牌: TOPTICA Photonics
