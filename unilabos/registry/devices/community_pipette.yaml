community_139:
  class:
    module: community_drivers.139.driver:DeviceDriver
    type: python
  name: Sartorius Picus 2 电动移液器
  description: Sartorius Picus 2是新一代电动移液器，配备蓝牙连接功能，可与Sartorius Pipetting移动应用集成。重量仅100克，具有完全电动化体验包括电动退吸头，大幅减轻肌肉疲劳。支持移液、多次分液、反向移液、稀释、滴定等8种移液模式。内置平板追踪器提高微孔板分液可靠性，1-3点校准调节功能确保准确性。
  manufacturer: Sartorius
  tags:
  - 移液器
  category:
  - 移液器
  model:
    name: Sartorius Picus 2 电动移液器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    量程: 0.2µL-10,000µL(单通道)
    通道: 单通道/8通道/12通道
    重量: 100g(单通道1000µL)
    品牌: Sartorius
community_140:
  class:
    module: community_drivers.140.driver:DeviceDriver
    type: python
  name: Integra VOYAGER II 电动移液器
  description: Integra VOYAGER II是全球唯一具备电动可调枪头间距功能的多通道电动移液器。按下按钮即可在4.5mm至33mm间自由调节枪头间距，实现不同规格耗材间的平行样品转移。相比单通道移液器，工作效率提升最高12倍。触控轮界面直观操作，135°可旋转机身确保舒适握持。GripTips专用枪头确保牢固连接和完美对齐。
  manufacturer: Integra Biosciences
  tags:
  - 移液器
  category:
  - 移液器
  model:
    name: Integra VOYAGER II 电动移液器
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    通道: 4/6/8/12通道
    电动可调枪头间距: 4.5mm-33mm
    量程: 0.5-12.5µL/5-125µL/10-300µL等多种
    品牌: Integra Biosciences
