  name: Hamilton Microlab STAR 全自动移液工作站
  description: Hamilton Microlab STAR是全球最广泛使用的自动化液体处理工作站之一。采用专利CO-RE II（压缩O型环膨胀）技术实现吸头无应力锁键式连接，XYZ三轴定位精度±0.1mm。支持最多16个独立1000µL通道和8个5mL通道，可选96/384通道多探头模块。核心监控技术包括TADM全程吸液分液监控（实时追踪压力检测气泡和体积异常）、ADC防滴液控制（补偿挥发性溶剂压力波动）和双模式液面检测（电容式cLLD+压力式pLLD，最小检测体积10µL）。三种台面配置：STARlet(30轨)/STAR(54轨)/STARplus(71轨)。Venus软件提供拖放式方法编辑、LIMS集成和第三方外设对接。广泛应用于基因组学、药物筛选、临床诊断和生物样本库。
  manufacturer: Hamilton
  tags:
  - 移液管
  category:
  - 移液管
  model:
    name: Hamilton Microlab STAR 全自动移液工作站
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    移液通道: 最多16×1000µL+8×5mL独立通道
    可选: 96通道(1-1000µL)/384通道(0.1-50µL)
    定位精度: ±0.1mm(XYZ)
    液面检测: 电容式+压力式双模
    台面: STARlet 30轨/STAR 54轨/STARplus 71轨
    尺寸(STAR): 1664×795×903mm
    软件: Venus
    品牌: Hamilton
