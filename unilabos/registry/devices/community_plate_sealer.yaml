community_90:
  class:
    module: community_drivers.90.driver:DeviceDriver
    type: python
  name: Agilent PlateLoc热封膜仪
  description: Agilent PlateLoc是热封微孔板封膜仪,通过可控热量和压力将热封箔或膜应用于微孔板,可集成到Agilent BenchCel等自动化平台,适用于化合物存储、PCR/qPCR板封膜、样品归档、高通量筛选等应用
  manufacturer: Agilent
  tags:
  - 封膜仪
  category:
  - 封膜仪
  model:
    name: Agilent PlateLoc热封膜仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    功能: 热封微孔板
    板型兼容: 96孔/384孔/1536孔SBS标准板
    封膜温度: 室温至约200°C可调
    封膜时间: 1-4秒/板
    封膜类型: 可剥离铝封膜/永久箔封膜/PCR兼容封膜/DMSO耐受封膜
    品牌: Agilent
community_1019:
  class:
    module: community_drivers.1019.driver:DeviceDriver
    type: python
  name: Agilent PlateLoc热封微孔板封膜仪
  description: Agilent PlateLoc是自动化热封微孔板封膜仪，可快速一致地对微孔板进行热封处理。支持96至1536孔板格式，兼容可剥离、可穿刺和永久型封膜。适用于PCR、化合物管理和基因组学工作流程，可独立使用或集成到自动化系统中。
  manufacturer: Agilent
  tags:
  - 封膜仪
  category:
  - 封膜仪
  model:
    name: Agilent PlateLoc热封微孔板封膜仪
    type: device
  version: 1.0.0
  resource_type: device
