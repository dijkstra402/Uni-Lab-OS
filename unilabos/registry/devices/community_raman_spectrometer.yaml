community_gh_horiba_labram_hr_evolution:
  class:
    module: community_drivers.gh_horiba_labram_hr_evolution.driver:RamanSpectrum
    type: python
    status_types:
      snr: float
    action_value_mappings:
      auto-from_openraman_csvfiles:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: from_openraman_csvfiles
          type: object
          properties:
            goal:
              type: object
              properties:
                csv_filepath:
                  type: string
                csv_filepath_excitation_calibration:
                  type: string
                csv_filepath_emission_calibration:
                  type: string
                excitation_wavelength_nm:
                  type: number
                kernel_size:
                  type: integer
                rough_calibration_residuals_threshold:
                  type: number
                fine_calibration_residuals_threshold:
                  type: number
        goal_default:
          csv_filepath: null
          csv_filepath_excitation_calibration: null
          csv_filepath_emission_calibration: null
          excitation_wavelength_nm: null
          kernel_size: null
          rough_calibration_residuals_threshold: null
          fine_calibration_residuals_threshold: null
        handles: {}
      auto-from_horiba_txtfile:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: from_horiba_txtfile
          type: object
          properties:
            goal:
              type: object
              properties:
                txt_filepath:
                  type: string
                num_skip_rows:
                  type: integer
                  default: 32
        goal_default:
          txt_filepath: null
          num_skip_rows: 32
        handles: {}
      auto-from_renishaw_txtfile:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: from_renishaw_txtfile
          type: object
          properties:
            goal:
              type: object
              properties:
                csv_filepath:
                  type: string
        goal_default:
          csv_filepath: null
        handles: {}
      auto-from_wasatch_csvfile:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: from_wasatch_csvfile
          type: object
          properties:
            goal:
              type: object
              properties:
                csv_filepath:
                  type: string
        goal_default:
          csv_filepath: null
        handles: {}
      auto-from_generic_csvfile:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: from_generic_csvfile
          type: object
          properties:
            goal:
              type: object
              properties:
                csv_filepath:
                  type: string
                wavenumber_cm1_index:
                  type: integer
                  default: 0
                intensity_index:
                  type: integer
                  default: 1
        goal_default:
          csv_filepath: null
          wavenumber_cm1_index: 0
          intensity_index: 1
        handles: {}
      auto-between:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: between
          type: object
          properties:
            goal:
              type: object
              properties:
                min_wavenumber_cm1:
                  type: number
                max_wavenumber_cm1:
                  type: number
        goal_default:
          min_wavenumber_cm1: null
          max_wavenumber_cm1: null
        handles: {}
      auto-interpolate:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: interpolate
          type: object
          properties:
            goal:
              type: object
              properties:
                float_indices:
                  type: string
        goal_default:
          float_indices: null
        handles: {}
      auto-normalize:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: normalize
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-standardize:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: standardize
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-smooth:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: smooth
          type: object
          properties:
            goal:
              type: object
              properties:
                kernel_size:
                  type: integer
                  default: 5
        goal_default:
          kernel_size: 5
        handles: {}
      auto-find_n_most_prominent_wavenumbers:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: find_n_most_prominent_wavenumbers
          type: object
          properties:
            goal:
              type: object
              properties:
                num_peaks:
                  type: integer
                prominence_increment:
                  type: number
                  default: 0.005
                max_iterations:
                  type: integer
                  default: 500
        goal_default:
          num_peaks: null
          prominence_increment: 0.005
          max_iterations: 500
        handles: {}
      auto-find_prominent_wavenumbers:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: find_prominent_wavenumbers
          type: object
          properties:
            goal:
              type: object
              properties:
                prominence:
                  type: number
                  default: 0.01
        goal_default:
          prominence: 0.01
        handles: {}
