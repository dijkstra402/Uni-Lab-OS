community_1062:
  class:
    module: community_drivers.1062.driver:DeviceDriver
    type: python
  name: Roche LightCycler 480 II 实时荧光定量PCR仪
  description: Roche LightCycler 480 II是高通量微孔板式实时荧光定量PCR系统，支持96孔和384孔板格式。采用氙灯宽光谱光源和CCD相机检测，最多6个检测通道支持多重荧光标记。动态范围跨10个数量级，内置高分辨率熔解(HRM)分析功能，适用于基因定量、基因分型和病原体检测。
  manufacturer: Roche
  tags:
  - 实时定量PCR仪
  category:
  - 实时定量PCR仪
  model:
    name: Roche LightCycler 480 II 实时荧光定量PCR仪
    type: device
  version: 1.0.0
  resource_type: device
