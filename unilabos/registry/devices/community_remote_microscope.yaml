  description: Remote Microscope Controller 光学显微镜是一款普通光学显微镜，主要功能包括成像、打开、状态查询、电压读取、聚焦、采集。支持Signal,
    Slot, get beam blanked等操作。
  category:
  - 普通光学显微镜
  init_param_schema:
    config:
      type: object
      properties:
        address:
          type: string
          default: null
        transport:
          type: string
          default: null
        timeout:
          type: string
          default: null
  device_params:
