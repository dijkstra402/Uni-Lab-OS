  name: Newport 8742 四轴开环Picomotor运动控制器
  description: Newport 8742是一款4轴开环智能Picomotor运动控制器/驱动器，为驱动New Focus开环Picomotor产品提供紧凑、低成本的单机解决方案。集控制器与驱动器于一体，支持USB和以太网通讯，使用Newport运动控制语言（NMCL）命令集。内置HTTP服务器生成动态网页实现即时响应。可通过RS-485接口菊花链连接最多31台控制器，组建最多124个Picomotor执行器的网络。支持Windows
    DLL和LabVIEW VI编程。
  manufacturer: Newport
  tags:
  - 机械臂
