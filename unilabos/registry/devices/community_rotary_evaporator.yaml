community_75:
  class:
    module: community_drivers.75.driver:DeviceDriver
    type: python
  name: IKA RV 10 旋转蒸发仪
  description: IKA RV 10是一款功能全面的旋转蒸发仪，转速20~280RPM，加热浴温度可达180°C。配备140mm行程电动升降系统，断电时安全自动提升蒸发瓶脱离加热浴。1500cm²冷凝面积确保高效冷凝回收，推脱机构便于拆卸紧固的蒸发瓶。支持左右间歇旋转模式用于干燥工艺，定时器实现定时控制。RS-232接口配合labworldsoft软件可实现远程操控和数据采集，是实验室蒸馏浓缩的理想选择。
  manufacturer: IKA
  tags:
  - 旋转蒸发器
  category:
  - 旋转蒸发器
  model:
    name: IKA RV 10 旋转蒸发仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    转速范围: 20~280RPM
    浴温范围: 室温~180°C
    加热功率: 1300W
    蒸发瓶: 最大3L
    冷凝面积: 1500cm²
    电动升降行程: 140mm
    电机: 50W无刷直流
    电源: 100-240V 75W
    接口: RS-232
    防护等级: IP20
    品牌: IKA
