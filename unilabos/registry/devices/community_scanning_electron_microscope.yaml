  name: Electron microscopy
  description: FIB-SEM(聚焦离子束-扫描电子显微镜)是集纳米级成像和加工于一体的双束系统，通过聚焦镓离子束进行纳米切割和沉积，结合扫描电子显微镜实现高分辨率成像，广泛用于材料科学、半导体和生命科学。
  manufacturer: Thermo Fisher Scientific / ZEISS / TESCAN
  icon: fibsem.webp
  tags:
  - 扫描电子显微镜
  category:
  - 扫描电子显微镜
  device_params:
    类型: 聚焦离子束-扫描电子显微镜(FIB-SEM)
    代表型号: Thermo Fisher Helios 5/Scios 2/ZEISS Crossbeam/TESCAN SOLARIS
    电子束分辨率: <1nm
    离子束: Ga液态金属离子源(LMIS)
    应用: 纳米加工/TEM样品制备/3D切片成像/电路编辑
    品牌: Thermo Fisher Scientific / ZEISS / TESCAN
  model:
    name: Electron microscopy
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: SEM Imaging
  version: 1.0.0
  resource_type: device
