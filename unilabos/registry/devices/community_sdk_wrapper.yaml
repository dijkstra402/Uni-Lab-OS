sdk_wrapper:
  class:
    module: unilabos.devices.community.sdk_wrapper.driver:SDKWrapper
    type: python
    status_types:
      sdk: String
      sdk_bin_name: String
      sdk_license_path: String
      sdk_log_path: String
      sdk_root_path: String
      version: String
    action_value_mappings:
      auto-open:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: open
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-close:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: close
          type: object
          properties:
            goal:
              type: object
              properties: {}
        goal_default: {}
        handles: {}
      auto-process_message:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: process_message
          type: object
          properties:
            goal:
              type: object
              properties:
                message:
                  type: string
                comm_handle:
                  type: string
        goal_default: {}
        handles: {}
      auto-process_message_str:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: process_message_str
          type: object
          properties:
            goal:
              type: object
              properties:
                message:
                  type: string
                buffer_length:
                  type: integer
                comm_handle:
                  type: string
        goal_default: {}
        handles: {}
      auto-set_logging_level:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: set_logging_level
          type: object
          properties:
            goal:
              type: object
              properties:
                level:
                  type: string
        goal_default: {}
        handles: {}
      auto-connect_serial:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: connect_serial
          type: object
          properties:
            goal:
              type: object
              properties:
                port:
                  type: string
        goal_default: {}
        handles: {}
      auto-connect_usb:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: connect_usb
          type: object
          properties:
            goal:
              type: object
              properties:
                serial_number:
                  type: string
        goal_default: {}
        handles: {}
      auto-connect:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: connect
          type: object
          properties:
            goal:
              type: object
              properties:
                use_serial:
                  type: boolean
        goal_default:
          use_serial: false
        handles: {}
  description: Wrapper for Linkam SDK
  category:
  - generic
  init_param_schema:
    config:
      type: object
      properties:
        sdk_root_path:
          type: string
          default: null
        sdk_bin_name:
          type: string
          default: null
        sdk_log_path:
          type: string
          default: null
        sdk_license_path:
          type: string
          default: null
