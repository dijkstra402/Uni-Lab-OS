  name: Lock In Amplifier - SR830
  description: DSP双相锁相放大器，结合模拟前端与数字信号处理技术，>100dB动态储备，2nV灵敏度，广泛用于微弱信号检测。已停产，被SR860(500kHz)替代。
  manufacturer: Stanford Research Systems
  icon: sr830.jpg
  tags: &id001
  - 锁相放大器与微弱信号检测
  category: *id001
  device_params:
    Freq Range: 1mHz~102.4kHz
    Phase Resolution: 0.01°
    Sensitivity: 2nV~1V (voltage), 2fA~1µA (current)
    Input Noise: 6nV/√Hz @1kHz
    Input Impedance: 10MΩ+25pF
    Dynamic Reserve: '>100dB'
    Time Constant: 10µs~30000s
    Filter Slope: 6/12/18/24 dB/oct
    Outputs: X,Y,R,θ
    Analog Out: 2CH ±10.5V, 4 AUX DAC ±10.5V
    Interface: GPIB, RS-232
    品牌: Stanford Research Systems
  model:
    name: Lock In Amplifier - SR830
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: Dielectric Measurement
  version: 1.0.0
  resource_type: device
  cover: Lock In Amplifier - SR830.webp
