  tags:
  - 注射泵
  category:
  - 注射泵
  device_params:
    Stroke Speed: 1.2 seconds to 100 minutes per stroke (800 minutes in microstep
      mode).
    Valve Options: 120° 3-port, 90° 4-port, T-valve, 90° 3-way Distribution Rotary
      Plug PTFE or UHMWPE Body materials PEEK or PCTFE
    Step Resolution: Standard mode 3,000 steps, Hi-Res mode 24,000 steps
    Drive Design: Direct drive stepper motor/leadscrew with 30 mm of travel.Manually
      moveable for ”power off” syringe removal.
    品牌: Tricontinent
  model:
    name: Syringe Pumps | C-Series Syringe Pumps
    type: device
  scene:
    domain: Chemistry
    scene_name: Fluid Control
    step: Dispensing
