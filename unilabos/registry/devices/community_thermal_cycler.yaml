    TSuite软件或机器人软件控制
  manufacturer: Analytik Jena
  tags:
  - 普通PCR仪
  category:
  - 普通PCR仪
  model:
    name: Analytik Jena Biometra TRobot II自动化PCR仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    孔数: 96孔(0.2mL)或384孔
    温度范围: 3-99°C
    加热速率: 最大4.0-5.0°C/s
    冷却速率: 最大3.1-4.8°C/s
    温度均匀性: ±0.15-0.20°C
    梯度范围: 10-99°C
    最大梯度跨度: 24-30°C
    盖板温度: 30-110°C
    PCR模块尺寸: 208x260x206-209mm
    品牌: Analytik Jena
