community_141:
  class:
    module: community_drivers.141.driver:DeviceDriver
    type: python
  name: Eppendorf ThermoMixer C 热混匀仪
  description: Eppendorf ThermoMixer C是集混匀、加热和冷却于一体的多功能实验室仪器。采用2DMix-Control技术确保优异的样品混匀效果，可更换SmartBlock适配5µL至50mL的各种容器规格。选配ThermoTop加热盖可实现无冷凝操作。符合Eppendorf
    PhysioCare人体工学理念，经My Green Lab ACT可持续性认证。采用100%可再生能源装配。
  manufacturer: Eppendorf
  tags:
  - 热混匀仪
  category:
  - 热混匀仪
  model:
    name: Eppendorf ThermoMixer C 热混匀仪
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    混匀速度: 最高3,000rpm
    混匀轨道: 3mm
    容器兼容: 5µL至50mL
    品牌: Eppendorf
