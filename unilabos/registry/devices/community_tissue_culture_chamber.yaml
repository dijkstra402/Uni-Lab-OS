  name: Inheco Single Plate Incubator Shaker 单板培养振荡器
  description: Inheco Single Plate Incubator Shaker是专为自动化液体处理平台设计的紧凑型单板培养振荡器，在德国设计、研发和制造。提供MP微孔板型（底部接触式加热）和DWP深孔板型（全方位腔内加热防冷凝）。温度范围室温+5K至80°C，37°C时精度±1.0°C，均匀性≤0.8°C。独特双轴摆动驱动实现6种振荡模式（线性南北/东西、轨道圆周、椭圆、8字形、利萨如图形），频率400-1800rpm，幅度0-3mm自由编程。紧凑设计仅149×268.5mm台面面积，支持多台堆叠（MP最多3台/DWP最多2台），主从控制独立运行。电动抽屉定位精度±0.30mm，便于机械臂操作。USB接口提供开放API，已集成Hamilton、Tecan等主流系统。全球两年质保。
