    name: Thermo Fisher Talos F200C 透射电子显微镜
    type: device
  version: 1.0.0
  resource_type: device
community_33:
  class:
    module: community_drivers.33.driver:DeviceDriver
    type: python
  name: Thermo Fisher Talos Arctica 冷冻透射电子显微镜
  description: Talos Arctica是专为冷冻电子显微学设计的200kV场发射透射电镜,搭载X-FEG高亮度电子枪和Autoloader自动样品装载系统。支持单颗粒分析(SPA)、冷冻电子断层扫描(cryo-ET)和微电子衍射(MicroED),是结构生物学高分辨率成像的中端平台,定位介于筛选电镜与旗舰Titan
    Krios之间。
