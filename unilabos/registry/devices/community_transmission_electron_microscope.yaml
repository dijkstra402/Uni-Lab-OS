community_169:
  class:
    module: community_drivers.169.driver:DeviceDriver
    type: python
  name: Nion UltraSTEM 扫描透射电子显微镜
  description: Nion UltraSTEM是由像差校正技术先驱Ondrej Krivanek团队设计的高端扫描透射电子显微镜，工作电压30-200kV，实现亚埃级分辨率。采用高亮度冷场发射电子枪(CFEG)和先进C3/C5像差校正器。HERMES单色器选件可实现超高能量分辨率EELS(低至~10meV)，支持原子分辨率成像、化学映射、4D-STEM和振动光谱。广泛用于全球顶级材料科学研究机构。
