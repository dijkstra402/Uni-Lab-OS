  resource_type: device
community_32:
  class:
    module: community_drivers.32.driver:DeviceDriver
    type: python
  name: Thermo Fisher Talos F200C 透射电子显微镜
  description: Talos F200C是一款20-200kV热发射(扫描)透射电子显微镜,配备恒功率C-TWIN物镜,可在对比度与分辨率间取得最佳平衡。支持二维和三维生物样品与纳米材料成像,兼容冷冻电镜和原位动态观察,配备Ceta
    16M CMOS相机和EDS探测器,适用于细胞生物学、结构生物学和纳米技术研究。
  manufacturer: Thermo Fisher Scientific
  tags:
  - 透射电子显微镜
  category:
