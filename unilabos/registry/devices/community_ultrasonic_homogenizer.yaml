  name: UP200H / UP200S - Ultrasonic Power for the Lab
  description: 200W实验室超声波处理器，UP200H可手持或安装在支架上，UP200S仅支架使用，适用于实验室小中规模超声处理
  manufacturer: Hielscher
  icon: up20.webp
  tags:
  - 超声破碎仪
  category:
  - 超声破碎仪
  device_params:
    功率: 200W
    频率: 24kHz
    适用体积: 0.1-2000mL
    探头直径: 1-40mm可选
    应用: 均质/分散/乳化/细胞破碎/脱气/声化学
    品牌: Hielscher
  model:
    name: UP200H / UP200S - Ultrasonic Power for the Lab
    type: device
  scene:
    domain: Biology
    scene_name: Sample Preparation
    step: Sonication
  version: 1.0.0
  resource_type: device
