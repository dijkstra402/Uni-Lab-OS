  name: Q500 Sonicator
  description: Sonicators®：原创超声波液体处理器。自 1973 年起在美国制造。越来越多的科学家信任这款独一无二的超声波发生器。
  manufacturer: Qsonica
  icon: q700-with-stand_medium.png
  tags:
  - 超声破碎仪
  category:
  - 超声破碎仪
  device_params:
    参数: Nanoparticle Dispersion Create maximally stable nanoparticle suspensions by
      achieving the lowest possible particle sizes. Dispersing Deagglomerating Particle
      Size Reduction Particle Synthesis & Precipitation Surface Functionalization;
      Chromatin / DNA Shearing Achieve a narrow distribution of fragment sizes for
      next-generation sequencing, ChIP assay and other genomics applications. Chromatin
      Shearing for ChIP DNA Shearing for NGS ChIP-Seq Cell Lysis RNA and Protein Extraction;
      Cell Disruption / Cell Lysis Efficiently lyse everything from mammalian cell
      culture to gram-positive bacteria. See why
    品牌: Qsonica
  model:
    name: Q500 Sonicator
    type: device
  scene:
