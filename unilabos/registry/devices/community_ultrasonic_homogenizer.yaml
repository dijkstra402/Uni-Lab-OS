community_1036:
  class:
    module: community_drivers.1036.driver:DeviceDriver
    type: python
  name: Hielscher UP200St超声波处理器
  description: Hielscher UP200St是200W实验室级超声波处理器，频率26kHz，振幅连续可调。具有自动振幅补偿功能在负载下保持恒定振幅，内置SD卡自动记录超声参数确保实验可重复性。支持浏览器远程控制和脉冲模式，适用于均质乳化、细胞破碎、纳米分散和声化学应用。
  manufacturer: Hielscher
  tags:
  - 超声破碎仪
  category:
  - 超声破碎仪
  model:
    name: Hielscher UP200St超声波处理器
    type: device
  version: 1.0.0
  resource_type: device
community_1061:
  class:
    module: community_drivers.1061.driver:DeviceDriver
    type: python
  name: Branson SFX250/SFX550 数字超声波处理器
  description: Branson SFX250/SFX550是Emerson旗下数字超声波细胞破碎/匀浆仪，工作频率20kHz。SFX250输出250W，SFX550输出550W，振幅10-100%数字可调。支持脉冲和连续运行模式，配备能量和温度监控功能，广泛用于细胞裂解、纳米颗粒分散、乳化和DNA剪切等应用。
  manufacturer: Branson
  tags:
  - 超声破碎仪
  category:
  - 超声破碎仪
  model:
    name: Branson SFX250/SFX550 数字超声波处理器
    type: device
  version: 1.0.0
  resource_type: device
