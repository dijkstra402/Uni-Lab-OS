community_136:
  class:
    module: community_drivers.136.driver:DeviceDriver
    type: python
  name: Instron 5943/5944/5969 万能试验机
  description: Instron 5900系列万能试验机是全球广泛使用的材料测试平台。5943(1kN)和5944(2kN)为单柱台式设计，适用于生物材料、薄膜、纺织品等低力值精密测试。5969(50kN)为双柱设计，可进行拉伸、压缩和弯曲测试。符合ISO、ASTM等国际标准，配备数千种配件。已被6800系列取代，但仍有大量装机运行。
  manufacturer: Instron
  tags:
  - 万能试验机标准机
  category:
  - 万能试验机标准机
  model:
    name: Instron 5943/5944/5969 万能试验机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    5943力值: 1kN
    5944力值: 2kN
    5969力值: 50kN
    速度范围: 0.001-1500mm/min
    位置分辨率: ≤0.02μm
    数据采集: 2500Hz
    品牌: Instron
community_137:
  class:
    module: community_drivers.137.driver:DeviceDriver
    type: python
  name: ZwickRoell zwickiLine 万能试验机
  description: ZwickRoell zwickiLine是紧凑型台式万能试验机，专为低力值准静态材料测试设计。支持拉伸、压缩、弯曲和循环测试，适用于塑料、弹性体、金属、复合材料、纺织品、泡沫和医疗器械等。模块化设计，可垂直或水平操作，六个标准导轨槽可自由安装夹具和附件。配备testControl
    II测量控制电子系统和testXpert III软件。
  manufacturer: ZwickRoell
  tags:
  - 万能试验机标准机
  category:
  - 万能试验机标准机
  model:
    name: ZwickRoell zwickiLine 万能试验机
    type: device
  version: 1.0.0
  resource_type: device
  device_params:
    力值范围: 0.5kN-5kN(Z0.5至Z5.0)
    速度: 0.0005-3000mm/min
