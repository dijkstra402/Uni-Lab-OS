  name: PowerArc
  description: PowerArc™是一个完整的集成光源，包括电源、启动器、高效收集光学器件和灯罩，是用于紫外-可见-近红外应用的无臭氧氙灯光源。PowerArc光源非常适合太阳能模拟器、光化学、光诱导激发、
    光生物学等应用。
  manufacturer: Horiba
  icon: csm_PowerArc_1f21dbd52d.jpg
  tags:
  - 紫外-可见分光光谱仪
  category:
  - 紫外-可见分光光谱仪
  device_params:
    反射镜: f/1
    焦点处宽带光功率 (W): '7.5'
    焦点 (半高宽, mm): '1.5'
    输入（用户可选）: 105–120 V/60 Hz or 210–240 V/50 Hz
    额定功率: 0 - 150 w
    操作电压: 10 - 24 v
    操作电流: 0 - 8 A
    预燃电压: '> 85 v'
    最大电流处波动: < 10 mv
    预热后稳定性: 0.2%
    线路电压调整: 线路电压变化 5 v 时电流变化 0.1%
    负载调整: 负载阻抗变化 50% 时电流变化 0.1%
    尺寸: 11.5 x 27.3 x 31.8 cm
    重量: 5.45 kg
    品牌: Horiba
  model:
    name: PowerArc
    type: device
  scene:
    domain: Chemistry
    scene_name: Analysis
    step: Raman Spectroscopy
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        device_id:
          default: null
          type: integer
        communicator:
          default: null
          type: string
        error_db:
          default: null
          type: string
