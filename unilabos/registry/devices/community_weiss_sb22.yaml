  name: Weiss Technik SB22 环境模拟试验箱
  description: Weiss Technik SB22是22升台式紧凑型环境模拟试验箱，温度范围-42至+180°C，可选湿度控制。
  manufacturer: Weiss Technik
  icon: weiss_sb22.webp
  tags: &id001
  - 高低温试验箱
  category: *id001
  device_params:
    容积: ~22升
    温度: -42至+180°C(无湿度), +10至+95°C(有湿度)
    湿度: 10-98%RH(选配)
    温度波动: ±0.3至±0.5°C
    升温: ~3-5K/min
    降温: ~2-3K/min
    设计: 台式紧凑型
    品牌: Weiss Technik
  model:
    name: Weiss Technik SB22 环境模拟试验箱
    type: device
  scene:
