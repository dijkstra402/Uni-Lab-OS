  name: Quantum Detectors Xspress3 Readout System
  description: Xspress 3是Quantum Detectors开发的商用数字脉冲处理器，用于最大化X射线荧光探测器的吞吐量和分辨率。输出计数率超过3Mcps，比传统系统快10倍以上。被全球同步辐射光源广泛使用。
  manufacturer: Quantum Detectors
  icon: xspress3.webp
  tags:
  - X射线衍射仪
  category:
  - X射线衍射仪
  device_params:
    最大计数率: 340万计数/秒/通道
    FPGA: Xilinx Virtex-5(双PowerPC)
    通信: 1GbE(控制)+10GbE(数据)
    通道数: 4/6/8(根据固件)
    最大帧数: '16384'
    像素: '4096'
    图像位深: 32位
    触发: 内部触发
    界面: Web GUI
    品牌: Quantum Detectors
  model:
    name: Quantum Detectors Xspress3 Readout System
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: XRD Analysis
  version: 1.0.0
  resource_type: device
