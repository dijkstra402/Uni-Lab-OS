  name: X-ray generator Seifert ISO-Debyeflex 3003
  description: GE/Seifert高稳定性X射线发生器，3kW功率，60kV最大电压，适用于X射线衍射(Laue法)和乳腺X射线等应用
  manufacturer: GE/Seifert
  icon: debyeflex3003.webp
  tags:
  - X射线衍射仪
  category:
  - X射线衍射仪
  device_params:
    最大电压: 60kV
    电压范围: 2-60kV
    电流范围: 2-80mA
    最大功率: 3kW
    管类型: 密封管(W/Mo/Rh)
    控制接口: 串口(RS-232)
    冷却: 水冷(WW 3001)
    安全: 门联锁/声光报警/紧急断路器
    品牌: GE/Seifert
  model:
    name: X-ray generator Seifert ISO-Debyeflex 3003
    type: device
  scene:
    domain: Materials Science
    scene_name: Characterization
    step: XRD Analysis
  version: 1.0.0
  resource_type: device
  init_param_schema:
    config:
      type: object
      properties:
        intf:
          default: null
          type: string
        conf:
          default: null
          type: string
